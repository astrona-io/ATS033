- id: section-040
  title: Appropriately use kernel hardening tools such as AppArmor, seccomp
  curriculum_item: Appropriately use kernel hardening tools such as AppArmor, seccomp
  capstone: false
  section_quiz: false
  modules:
  - id: module-01
    title: Seccomp And AppArmor As Different Kernel Boundaries
    objectives:
    - Distinguish syscall filtering from resource-oriented mandatory access control.
    - Interpret RuntimeDefault, Localhost and unconfined profile choices.
    - Explain node prerequisites and container-level overrides.
    - Diagnose profile failures while preserving the intended boundary.
    outline:
    - Seccomp And AppArmor As Different Kernel Boundaries
