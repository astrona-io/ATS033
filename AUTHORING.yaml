      status: alpha
      runtime_verification: pending
    practice_readings: []
  - id: module-03
    title: Restrict ServiceAccounts And API Tokens
    objectives:
    - Use a dedicated ServiceAccount for each workload.
    - Turn off the token mount for workloads that do not call the API.
    - Describe bound projected tokens and their lifetime.
    - Close the default ServiceAccount and remove long-lived token Secrets.
    outline:
    - Dedicated ServiceAccounts And automountServiceAccountToken
    - Bound Projected Tokens
    - The Default ServiceAccount And Unused Tokens
    - Summary
    playground: true
    module_lab: true
    sources:
