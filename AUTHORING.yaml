version: 1
approval: Maintainer requested CKA and CKS playgrounds and graded labs on 2026-10-13,
  superseding the earlier reading-only scope.
course:
  id: ATS033
  certification:
    name: Certified Kubernetes Security Specialist
    code: CKS
    provider: CNCF / Linux Foundation
    domain: System Hardening
    weight: 10
    competencies:
    - Minimize host OS footprint (reduce attack surface)
    - Using least-privilege identity and access management
    - Minimize external access to the network
    - Appropriately use kernel hardening tools such as AppArmor, seccomp
defaults:
  playground: true
  module_lab: false
  capstone: false
  section_quiz: false
  final_quiz: true
assessment_format: YAML question banks v1, registered in assessments/index.yaml
sections:
- id: section-010
  title: Minimize host OS footprint (reduce attack surface)
  curriculum_item: Minimize host OS footprint (reduce attack surface)
  capstone: false
  section_quiz: false
  modules:
  - id: module-01
    title: Reduce The Host Operating-System Attack Surface
    objectives:
    - Inventory services, packages and privileged interfaces by required function.
    - Explain why host compromise affects container isolation.
    - Evaluate persistent service configuration and patch ownership.
    - Preserve operational dependencies while removing unnecessary exposure.
    outline:
    - Inventory Services And Listeners
    - Stop, Disable And Mask Services
    - Remove Packages And Keep The Node Working
    - Privileged Host Interfaces
    - Summary
    playground: true
    module_lab: true
    sources:
    - reading: sections/section-010/module-01/course-01-inventory-services-and-listeners.md
      adapted_from: null
    - reading: sections/section-010/module-01/course-02-stop-disable-and-mask-services.md
      adapted_from: null
    - reading: sections/section-010/module-01/course-03-remove-packages-and-keep-the-node-working.md
      adapted_from: null
    - reading: sections/section-010/module-01/course-04-privileged-host-interfaces.md
      adapted_from: null
    labs:
    - id: lab-01
      path: sections/section-010/module-01/labs/lab-01
      after_reading: sections/section-010/module-01/course-02-stop-disable-and-mask-services.md
      objective: Remove a seeded extra service from active and enabled node services
        while preserving Kubernetes.
      status: draft
      runtime_verification: pending
    practice_readings: []
- id: section-020
  title: Using least-privilege identity and access management
  curriculum_item: Using least-privilege identity and access management
  capstone: false
  section_quiz: false
  modules:
  - id: module-01
    title: Apply Least Privilege To Identities
    objectives:
    - Distinguish Linux users and groups from Kubernetes identities.
    - Evaluate file, socket and privilege-elevation authority.
    - Separate routine operational access from exceptional administration.
    - Review credential revocation and auditable privileged actions.
    outline:
    - Users, Groups And File Permissions
    - Privilege Elevation And Account Locking
    - Kubernetes Identities And RBAC
    - Revocation And Audit
    - Summary
    playground: true
    module_lab: true
    sources:
    - reading: sections/section-020/module-01/course-01-users-groups-and-file-permissions.md
      adapted_from: null
    - reading: sections/section-020/module-01/course-02-privilege-elevation-and-account-locking.md
      adapted_from: null
    - reading: sections/section-020/module-01/course-03-kubernetes-identities-and-rbac.md
      adapted_from: null
    - reading: sections/section-020/module-01/course-04-revocation-and-audit.md
      adapted_from: null
    labs:
    - id: lab-01
      path: sections/section-020/module-01/labs/lab-01
      after_reading: sections/section-020/module-01/course-01-users-groups-and-file-permissions.md
      objective: Grant a dedicated host identity access to one report without granting
        root access.
      status: draft
      runtime_verification: pending
    practice_readings: []
- id: section-030
  title: Minimize external access to the network
  curriculum_item: Minimize external access to the network
  capstone: false
  section_quiz: false
  modules:
  - id: module-01
    title: Minimize External Access To The Network
    objectives:
    - Map host listeners and required communication peers.
    - Distinguish bind addresses, filtering and endpoint authorization.
    - Evaluate ingress and egress rules without breaking dependencies.
    - Account for persistence, address families and alternate traffic paths.
    outline:
    - Listeners And Bind Addresses
    - Host Firewalls With iptables And ufw
    - NetworkPolicy For Pod Traffic
    - NodePorts, Control-Plane Ports And API Access
    - Summary
    playground: true
    module_lab: true
    sources:
    - reading: sections/section-030/module-01/course-01-listeners-and-bind-addresses.md
      adapted_from: null
    - reading: sections/section-030/module-01/course-02-host-firewalls-with-iptables-and-ufw.md
      adapted_from: null
    - reading: sections/section-030/module-01/course-03-networkpolicy-for-pod-traffic.md
      adapted_from: null
    - reading: sections/section-030/module-01/course-04-nodeports-control-plane-ports-and-api-access.md
      adapted_from: null
    labs:
    - id: lab-01
      path: sections/section-030/module-01/labs/lab-01
      after_reading: sections/section-030/module-01/course-01-listeners-and-bind-addresses.md
      objective: Keep a node-local management-style service reachable locally while
        closing its node-address listener.
      status: draft
      runtime_verification: pending
    practice_readings: []
- id: section-040
  title: Appropriately use kernel hardening tools such as AppArmor, seccomp
  curriculum_item: Appropriately use kernel hardening tools such as AppArmor, seccomp
  capstone: false
  section_quiz: false
  modules:
  - id: module-01
    title: Kernel Hardening With seccomp And AppArmor
    objectives:
    - Distinguish syscall filtering from resource-oriented mandatory access control.
    - Interpret RuntimeDefault, Localhost and unconfined profile choices.
    - Explain node prerequisites and container-level overrides.
    - Diagnose profile failures while preserving the intended boundary.
    outline:
    - 'Seccomp: Filtering System Calls'
    - 'AppArmor: Profiles For Files And Capabilities'
    - The Restricted Security Context
    - Diagnosing Profile Failures
    - Summary
    playground: true
    module_lab: true
    sources:
    - reading: sections/section-040/module-01/course-01-seccomp-filtering-system-calls.md
      adapted_from: null
    - reading: sections/section-040/module-01/course-02-apparmor-profiles-for-files-and-capabilities.md
      adapted_from: null
    - reading: sections/section-040/module-01/course-03-the-restricted-security-context.md
      adapted_from: null
    - reading: sections/section-040/module-01/course-04-diagnosing-profile-failures.md
      adapted_from: null
    labs:
    - id: lab-01
      path: sections/section-040/module-01/labs/lab-01
      after_reading: sections/section-040/module-01/course-03-the-restricted-security-context.md
      objective: Keep a non-root workload functional with a read-only root filesystem
        and a writable scratch volume.
      status: draft
      runtime_verification: pending
    practice_readings: []
