      after_reading: sections/section-020/module-01/course-01-users-groups-and-file-permissions.md
      objective: Grant a dedicated host identity access to one report without granting
        root access.
      status: alpha
      runtime_verification: pending
    practice_readings: []
  - id: module-02
    title: Least-Privilege RBAC Roles And Bindings
    objectives:
    - Distinguish Roles, ClusterRoles, RoleBindings and ClusterRoleBindings.
    - Write rules without wildcards and remove cluster-admin bindings.
    - Explain privilege escalation prevention.
    - Audit identities with kubectl auth can-i and find over-broad bindings.
    outline:
    - Roles, ClusterRoles And Bindings
    - Wildcards, cluster-admin And Escalation
    - Audit Permissions With kubectl auth can-i
    - Summary
    playground: true
    module_lab: true
    sources:
    - reading: sections/section-020/module-02/course-01-roles-clusterroles-and-bindings.md
