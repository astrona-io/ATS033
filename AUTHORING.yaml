- id: section-030
  title: Minimize external access to the network
  curriculum_item: Minimize external access to the network
  capstone: false
  section_quiz: false
  modules:
  - id: module-01
    title: Minimizing External Access To Host Services
    objectives:
    - Map host listeners and required communication peers.
    - Distinguish bind addresses, filtering and endpoint authorization.
    - Evaluate ingress and egress rules without breaking dependencies.
    - Account for persistence, address families and alternate traffic paths.
    outline:
    - Minimizing External Access To Host Services
    playground: false
    module_lab: false
    sources:
    - reading: sections/section-030/module-01/course-01-minimizing-external-access-to-host-services.md
