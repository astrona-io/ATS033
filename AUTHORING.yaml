sections:
- id: section-010
  title: Minimize host OS footprint (reduce attack surface)
  curriculum_item: Minimize host OS footprint (reduce attack surface)
  capstone: false
  section_quiz: false
  modules:
  - id: module-01
    title: Reducing The Host Operating-System Attack Surface
    objectives:
    - Inventory services, packages and privileged interfaces by required function.
    - Explain why host compromise affects container isolation.
    - Evaluate persistent service configuration and patch ownership.
    - Preserve operational dependencies while removing unnecessary exposure.
    outline:
    - Reducing The Host Operating-System Attack Surface
    playground: false
    module_lab: false
    sources:
