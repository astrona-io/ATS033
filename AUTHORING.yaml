- id: section-020
  title: Using least-privilege identity and access management
  curriculum_item: Using least-privilege identity and access management
  capstone: true
  section_quiz: true
  modules:
  - id: module-01
    title: Apply Least Privilege To Identities
    objectives:
    - Distinguish Linux users and groups from Kubernetes identities.
    - Evaluate file, socket and privilege-elevation authority.
    - Separate routine operational access from exceptional administration.
    - Review credential revocation and auditable privileged actions.
    outline:
    - Users, Groups And File Permissions
    - Privilege Elevation And Account Locking
    - Kubernetes Identities And RBAC
    - Revocation And Audit
    - Summary
    playground: true
    module_lab: true
    sources:
