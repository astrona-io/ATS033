        and a writable scratch volume.
      status: alpha
      runtime_verification: pending
    practice_readings: []
  - id: module-02
    title: Apply seccomp Profiles To Pods
    objectives:
    - Choose between RuntimeDefault, Localhost and Unconfined and explain the risk
      of Unconfined.
    - Place a profile file under /var/lib/kubelet/seccomp and write the matching localhostProfile
      value.
    - Read and write a profile with defaultAction and syscalls.
    - Find the syscall that a profile blocks and repair a pod that fails because of
      its profile.
    outline:
    - Profile Types, Locations And The Unconfined Risk
    - Write And Load A Localhost Profile
    - Find Blocked Syscalls And Fix Failures
    - Summary
    playground: true
    module_lab: true
    sources:
