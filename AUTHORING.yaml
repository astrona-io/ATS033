  capstone: true
  section_quiz: true
  modules:
  - id: module-01
    title: Kernel Hardening With seccomp And AppArmor
    objectives:
    - Distinguish syscall filtering from resource-oriented mandatory access control.
    - Interpret RuntimeDefault, Localhost and unconfined profile choices.
    - Explain node prerequisites and container-level overrides.
    - Diagnose profile failures while preserving the intended boundary.
    outline:
    - 'Seccomp: Filtering System Calls'
    - 'AppArmor: Profiles For Files And Capabilities'
    - The Restricted Security Context
    - Diagnosing Profile Failures
    - Summary
    playground: true
    module_lab: true
    sources:
    - reading: sections/section-040/module-01/course-01-seccomp-filtering-system-calls.md
      adapted_from: 
    - reading: sections/section-040/module-01/course-02-apparmor-profiles-for-files-and-capabilities.md
      adapted_from: 
    - reading: sections/section-040/module-01/course-03-the-restricted-security-context.md
      adapted_from: 
    - reading: sections/section-040/module-01/course-04-diagnosing-profile-failures.md
      adapted_from: 
    labs:
