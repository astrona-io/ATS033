<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" width="840" height="300" role="img" aria-labelledby="title desc">
  <title id="title">A token works only for its audience</title>
  <desc id="desc">A token with the audience probe is accepted by a service that expects the audience probe. The same token sent to the API server is rejected, because its audience does not include the identity of the API server. A token whose audience includes the API server is accepted there.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="okline" d="M260 72 H548" marker-end="url(#arrowok)"/>
  <text class="label good" x="404" y="62" text-anchor="middle">audience matches</text>
  <path class="dashed" d="M260 162 H548" marker-end="url(#arrowbad)"/>
  <text class="label bad" x="404" y="152" text-anchor="middle">wrong audience, rejected</text>
  <path class="okline" d="M260 252 H548" marker-end="url(#arrowok)"/>
  <text class="label good" x="404" y="242" text-anchor="middle">audience matches</text>

  <rect class="ask" x="30" y="48" width="230" height="48" rx="8"/>
  <text x="145" y="70" text-anchor="middle">token</text>
  <text class="code" x="145" y="88" text-anchor="middle">audience: probe</text>
  <rect class="ask" x="30" y="138" width="230" height="48" rx="8"/>
  <text x="145" y="160" text-anchor="middle">token</text>
  <text class="code" x="145" y="178" text-anchor="middle">audience: probe</text>
  <rect class="ask" x="30" y="228" width="230" height="48" rx="8"/>
  <text x="145" y="250" text-anchor="middle">token for the</text>
  <text x="145" y="268" text-anchor="middle">API server audience</text>

  <rect class="ok" x="550" y="48" width="260" height="48" rx="8"/>
  <text x="680" y="70" text-anchor="middle">service that expects</text>
  <text class="code" x="680" y="88" text-anchor="middle">probe</text>
  <rect class="drop" x="550" y="138" width="260" height="48" rx="8"/>
  <text x="680" y="167" text-anchor="middle">API server</text>
  <rect class="ok" x="550" y="228" width="260" height="48" rx="8"/>
  <text x="680" y="257" text-anchor="middle">API server</text>
</svg>
