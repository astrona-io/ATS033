<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="840" height="330" role="img" aria-labelledby="title desc">
  <title id="title">Long-lived token Secret compared with a bound token</title>
  <desc id="desc">A token Secret of type kubernetes.io/service-account-token has no expiry, stays valid until the Secret or the ServiceAccount is deleted, and works from anywhere for anyone who can read it. A bound token has an expiry time, is tied to one pod, carries an audience and stops working when the pod is deleted.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <rect class="drop" x="30" y="30" width="380" height="230" rx="10"/>
  <text class="strong" x="50" y="60">Long-lived token Secret</text>
  <text class="code" x="50" y="84">kubernetes.io/service-account-token</text>
  <text x="50" y="122">No expiry time.</text>
  <text x="50" y="150">Valid until the Secret or the</text>
  <text x="50" y="170">ServiceAccount is deleted.</text>
  <text x="50" y="206">Anyone who can read the Secret</text>
  <text x="50" y="226">can use it from anywhere.</text>

  <rect class="ok" x="430" y="30" width="380" height="230" rx="10"/>
  <text class="strong" x="450" y="60">Bound token</text>
  <text x="450" y="84">from the TokenRequest API</text>
  <text x="450" y="122">Has an expiry time.</text>
  <text x="450" y="150">Tied to one pod: deleting the</text>
  <text x="450" y="170">pod makes it invalid.</text>
  <text x="450" y="206">Carries an audience, the service</text>
  <text x="450" y="226">that should accept it.</text>

  <text x="420" y="300" text-anchor="middle">Replace a Secret that a system still uses with a bound token, then delete the Secret.</text>
</svg>
