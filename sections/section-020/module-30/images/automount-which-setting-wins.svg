<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 320" width="840" height="320" role="img" aria-labelledby="title desc">
  <title id="title">Which automountServiceAccountToken setting wins</title>
  <desc id="desc">Four combinations of automountServiceAccountToken on the ServiceAccount and on the pod. With neither set, the token is mounted. With false on the ServiceAccount only, there is no token. When the pod sets the field, the pod setting wins: true mounts the token and false removes it.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <text class="strong" x="40" y="40">ServiceAccount setting</text>
  <text class="strong" x="300" y="40">Pod setting</text>
  <text class="strong" x="560" y="40">Result in the container</text>

  <path class="line" d="M240 81 H288" marker-end="url(#arrow)"/>
  <path class="line" d="M500 81 H548" marker-end="url(#arrow)"/>
  <rect class="box" x="30" y="60" width="210" height="42" rx="8"/>
  <text class="code" x="135" y="86" text-anchor="middle">not set</text>
  <rect class="policy" x="290" y="60" width="210" height="42" rx="8"/>
  <text class="code" x="395" y="86" text-anchor="middle">not set</text>
  <rect class="ok" x="550" y="60" width="260" height="42" rx="8"/>
  <text x="680" y="86" text-anchor="middle">token mounted</text>
  <path class="line" d="M240 143 H288" marker-end="url(#arrow)"/>
  <path class="line" d="M500 143 H548" marker-end="url(#arrow)"/>
  <rect class="box" x="30" y="122" width="210" height="42" rx="8"/>
  <text class="code" x="135" y="148" text-anchor="middle">false</text>
  <rect class="policy" x="290" y="122" width="210" height="42" rx="8"/>
  <text class="code" x="395" y="148" text-anchor="middle">not set</text>
  <rect class="drop" x="550" y="122" width="260" height="42" rx="8"/>
  <text x="680" y="148" text-anchor="middle">no token</text>
  <path class="line" d="M240 205 H288" marker-end="url(#arrow)"/>
  <path class="line" d="M500 205 H548" marker-end="url(#arrow)"/>
  <rect class="box" x="30" y="184" width="210" height="42" rx="8"/>
  <text class="code" x="135" y="210" text-anchor="middle">false</text>
  <rect class="policy" x="290" y="184" width="210" height="42" rx="8"/>
  <text class="code" x="395" y="210" text-anchor="middle">true</text>
  <rect class="ok" x="550" y="184" width="260" height="42" rx="8"/>
  <text x="680" y="210" text-anchor="middle">token mounted, pod wins</text>
  <path class="line" d="M240 267 H288" marker-end="url(#arrow)"/>
  <path class="line" d="M500 267 H548" marker-end="url(#arrow)"/>
  <rect class="box" x="30" y="246" width="210" height="42" rx="8"/>
  <text class="code" x="135" y="272" text-anchor="middle">not set or true</text>
  <rect class="policy" x="290" y="246" width="210" height="42" rx="8"/>
  <text class="code" x="395" y="272" text-anchor="middle">false</text>
  <rect class="drop" x="550" y="246" width="260" height="42" rx="8"/>
  <text x="680" y="272" text-anchor="middle">no token, pod wins</text>
</svg>
