<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="860" height="380" role="img" aria-labelledby="title desc">
  <title id="title">How the kubelet gets a bound token</title>
  <desc id="desc">The kubelet asks the API server for a token through the TokenRequest API. The API server returns a signed JWT that holds the pod name and UID, an expiry time and an audience. The kubelet writes the token into a projected volume in the pod and refreshes it at 80 percent of its lifetime. When the pod is deleted, the API server rejects the token even before it expires.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="line" d="M200 74 H598" marker-end="url(#arrow)"/>
  <text class="label" x="400" y="64" text-anchor="middle">TokenRequest for the pod</text>
  <path class="okline" d="M600 100 H202" marker-end="url(#arrowok)"/>
  <text class="label good" x="400" y="122" text-anchor="middle">signed JWT</text>
  <path class="line" d="M115 112 V208" marker-end="url(#arrow)"/>
  <text class="label" x="128" y="150">writes the token, refreshes it</text>
  <text class="label" x="128" y="166">at 80 percent of its lifetime</text>
  <path class="line" d="M710 112 V168"/>

  <rect class="box" x="30" y="60" width="170" height="52" rx="8"/>
  <text x="115" y="91" text-anchor="middle">kubelet</text>
  <rect class="box" x="600" y="60" width="220" height="52" rx="8"/>
  <text x="710" y="91" text-anchor="middle">API server</text>

  <rect class="frame" x="30" y="180" width="400" height="110" rx="10"/>
  <text class="label" x="45" y="198">pod</text>
  <rect class="ok" x="50" y="210" width="360" height="62" rx="8"/>
  <text x="230" y="236" text-anchor="middle">projected volume</text>
  <text x="230" y="258" text-anchor="middle">with the <tspan class="code">token</tspan> file</text>

  <rect class="ask" x="560" y="170" width="260" height="120" rx="8"/>
  <text class="strong" x="580" y="196">The JWT holds:</text>
  <text x="580" y="222">the pod name and UID</text>
  <text x="580" y="246">an expiry time</text>
  <text x="580" y="270">an audience</text>

  <rect class="drop" x="30" y="316" width="790" height="44" rx="8"/>
  <text x="425" y="343" text-anchor="middle">Pod deleted: the API server rejects the token, even before it expires.</text>
</svg>
