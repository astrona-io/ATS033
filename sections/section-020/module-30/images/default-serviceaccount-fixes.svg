<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 320" width="840" height="320" role="img" aria-labelledby="title desc">
  <title id="title">Two fixes for the default ServiceAccount</title>
  <desc id="desc">The monitor pod and every new pod without serviceAccountName run as the default ServiceAccount. The RoleBinding default-pod-lister gives default the Role pod-lister, so the first fix deletes the binding. The second fix sets automountServiceAccountToken: false on default, so new pods start without a token.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="line" d="M240 72 H318" marker-end="url(#arrow)"/>
  <path class="line" d="M240 172 H280 V124 H318" marker-end="url(#arrow)"/>
  <path class="dashed" d="M480 100 H568" marker-end="url(#arrowbad)"/>
  <text class="label bad" x="524" y="90" text-anchor="middle">subject</text>
  <path class="dashed" d="M690 124 V178" marker-end="url(#arrowbad)"/>
  <path class="okline" d="M400 126 V228" marker-end="url(#arrowok)"/>

  <rect class="box" x="30" y="50" width="210" height="44" rx="8"/>
  <text x="135" y="77" text-anchor="middle"><tspan class="code">monitor</tspan> pod</text>
  <rect class="box" x="30" y="146" width="210" height="52" rx="8"/>
  <text x="135" y="168" text-anchor="middle">new pod with no</text>
  <text class="code" x="135" y="188" text-anchor="middle">serviceAccountName</text>
  <rect class="box" x="320" y="74" width="160" height="52" rx="8"/>
  <text x="400" y="96" text-anchor="middle">ServiceAccount</text>
  <text class="code" x="400" y="116" text-anchor="middle">default</text>

  <rect class="drop" x="570" y="74" width="240" height="50" rx="8"/>
  <text x="690" y="95" text-anchor="middle">RoleBinding</text>
  <text class="code" x="690" y="114" text-anchor="middle">default-pod-lister</text>
  <rect class="box" x="570" y="180" width="240" height="50" rx="8"/>
  <text x="690" y="201" text-anchor="middle">Role <tspan class="code">pod-lister</tspan></text>
  <text x="690" y="220" text-anchor="middle">get and list pods</text>
  <text class="label bad" x="690" y="256" text-anchor="middle">Fix 1: delete the RoleBinding</text>

  <rect class="ok" x="220" y="230" width="320" height="50" rx="8"/>
  <text class="code" x="380" y="260" text-anchor="middle">automountServiceAccountToken: false</text>
  <text class="label good" x="380" y="302" text-anchor="middle">Fix 2: no token for new pods</text>
</svg>
