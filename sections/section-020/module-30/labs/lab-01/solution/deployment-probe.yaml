apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe
  namespace: starfleet-033-020-03-01
spec:
  replicas: 1
  selector:
    matchLabels:
      app: probe
  template:
    metadata:
      labels:
        app: probe
    spec:
      automountServiceAccountToken: false
      containers:
      - name: probe
        image: docker.io/library/busybox:1.37.0
        command: ["sh", "-c", "sleep 3600"]
