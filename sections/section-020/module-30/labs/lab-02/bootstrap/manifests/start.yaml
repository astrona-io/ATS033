apiVersion: v1
kind: Namespace
metadata:
  name: starfleet-033-020-03-02
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: relay
  namespace: starfleet-033-020-03-02
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay
  namespace: starfleet-033-020-03-02
spec:
  replicas: 1
  selector:
    matchLabels:
      app: relay
  template:
    metadata:
      labels:
        app: relay
    spec:
      serviceAccountName: relay
      containers:
      - name: relay
        image: docker.io/library/busybox:1.37.0
        command: ["sh", "-c", "sleep 3600"]
