<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 250" width="840" height="250" role="img" aria-labelledby="title desc">
  <title id="title">The audit UID stays the same through sudo</title>
  <desc id="desc">student logs in over SSH, and the kernel stores the audit UID 1001. When student runs sudo tee, the process runs with UID 0, but the audit UID stays 1001. The watch rule matches, and the audit record names student, acting as root.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <!-- Lines first, so the boxes sit on top. -->
  <path class="line" d="M260 135 H303" marker-end="url(#arrow)"/>
  <path class="okline" d="M535 135 H578" marker-end="url(#arrowok)"/>

  <text class="label" x="282" y="90" text-anchor="middle">runs sudo</text>
  <text class="label good" x="557" y="90" text-anchor="middle">watch rule matches</text>

  <rect class="box" x="30" y="100" width="230" height="70" rx="8"/>
  <text class="strong" x="145" y="128" text-anchor="middle">SSH login as <tspan class="code">student</tspan></text>
  <text class="code" x="145" y="152" text-anchor="middle">uid=1001 auid=1001</text>

  <rect class="ask" x="305" y="100" width="230" height="70" rx="8"/>
  <text class="strong" x="420" y="128" text-anchor="middle"><tspan class="code">sudo tee 99-audit-test</tspan></text>
  <text class="code" x="420" y="152" text-anchor="middle">uid=0 auid=1001</text>

  <rect class="ok" x="580" y="100" width="240" height="70" rx="8"/>
  <text class="strong" x="700" y="128" text-anchor="middle">Audit record</text>
  <text x="700" y="152" text-anchor="middle">student, acting as root</text>

  <text class="label" x="145" y="196" text-anchor="middle">The kernel sets auid at login.</text>
  <text class="label" x="420" y="196" text-anchor="middle">sudo changes uid, not auid.</text>
  <text class="label" x="700" y="196" text-anchor="middle">auditd writes it to audit.log.</text>
</svg>
