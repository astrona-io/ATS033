<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" width="840" height="380" role="img" aria-labelledby="title desc">
  <title id="title">How sshd reads its configuration files</title>
  <desc id="desc">sshd reads sshd_config up to line 12, then the drop-in files 10-hardening.conf, 50-cloud-init.conf and 60-cloudimg-settings.conf in name order, then the rest of sshd_config. For most settings the first value wins. After sshd -t checks the syntax, systemctl reload ssh makes the running daemon read the files again.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <!-- Lines first, so the boxes sit on top. -->
  <rect class="frame" x="20" y="40" width="370" height="320" rx="10"/>
  <text class="label" x="36" y="32">Files that sshd reads, in this order</text>

  <path class="line" d="M200 100 V118" marker-end="url(#arrow)"/>
  <path class="line" d="M200 160 V178" marker-end="url(#arrow)"/>
  <path class="line" d="M200 220 V238" marker-end="url(#arrow)"/>
  <path class="line" d="M200 280 V298" marker-end="url(#arrow)"/>
  <path class="line" d="M390 102 H508" marker-end="url(#arrow)"/>
  <path class="line" d="M665 124 V166" marker-end="url(#arrow)"/>
  <path class="line" d="M665 210 V252" marker-end="url(#arrow)"/>

  <text class="label" x="212" y="114">line 12: Include</text>
  <text class="label" x="449" y="94" text-anchor="middle">check</text>

  <rect class="box" x="35" y="60" width="330" height="40" rx="8"/>
  <text x="200" y="85" text-anchor="middle"><tspan class="code">sshd_config</tspan>, up to line 12</text>
  <rect class="ok" x="35" y="120" width="330" height="40" rx="8"/>
  <text class="code" x="200" y="145" text-anchor="middle">sshd_config.d/10-hardening.conf</text>
  <rect class="box" x="35" y="180" width="330" height="40" rx="8"/>
  <text class="code" x="200" y="205" text-anchor="middle">sshd_config.d/50-cloud-init.conf</text>
  <rect class="box" x="35" y="240" width="330" height="40" rx="8"/>
  <text class="code" x="200" y="265" text-anchor="middle">sshd_config.d/60-cloudimg-settings.conf</text>
  <rect class="box" x="35" y="300" width="330" height="40" rx="8"/>
  <text x="200" y="325" text-anchor="middle">the rest of <tspan class="code">sshd_config</tspan></text>

  <rect class="ask" x="510" y="80" width="310" height="44" rx="8"/>
  <text x="665" y="107" text-anchor="middle"><tspan class="code">sshd -t</tspan> checks the syntax</text>
  <rect class="box" x="510" y="168" width="310" height="42" rx="8"/>
  <text x="665" y="194" text-anchor="middle"><tspan class="code">systemctl reload ssh</tspan></text>
  <rect class="ok" x="510" y="254" width="310" height="64" rx="8"/>
  <text x="665" y="279" text-anchor="middle">Running sshd: the first value wins</text>
  <text class="code" x="665" y="301" text-anchor="middle">permitrootlogin no, maxauthtries 3</text>
</svg>
