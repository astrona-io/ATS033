<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 290" width="840" height="290" role="img" aria-labelledby="title desc">
  <title id="title">How a RoleBinding gives a Role to a ServiceAccount</title>
  <desc id="desc">In the starfleet namespace, the RoleBinding probe-reader-pod-reader names the ServiceAccount probe-reader as its subject and the Role pod-reader in roleRef. The Role allows get and list on pods in starfleet. Pods in outpost get no access, because no binding exists there.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <!-- Lines first, so the boxes sit on top. -->
  <rect class="frame" x="20" y="60" width="800" height="120" rx="10"/>
  <text class="label" x="36" y="52">namespace <tspan class="code">starfleet</tspan></text>
  <rect class="frame" x="420" y="205" width="220" height="75" rx="10"/>
  <text class="label" x="436" y="197">namespace <tspan class="code">outpost</tspan></text>

  <path class="line" d="M190 125 H248" marker-end="url(#arrow)"/>
  <path class="line" d="M450 125 H508" marker-end="url(#arrow)"/>
  <path class="okline" d="M640 125 H688" marker-end="url(#arrowok)"/>
  <path class="dashed" d="M350 150 V245 H448" marker-end="url(#arrowbad)"/>

  <text class="label" x="219" y="92" text-anchor="middle">subjects</text>
  <text class="label" x="479" y="92" text-anchor="middle">roleRef</text>
  <text class="label good" x="664" y="92" text-anchor="middle">get, list</text>
  <text class="label bad" x="362" y="172">no binding in outpost</text>

  <rect class="box" x="40" y="100" width="150" height="50" rx="8"/>
  <text x="115" y="121" text-anchor="middle">ServiceAccount</text>
  <text class="code" x="115" y="140" text-anchor="middle">probe-reader</text>

  <rect class="ask" x="250" y="100" width="200" height="50" rx="8"/>
  <text x="350" y="121" text-anchor="middle">RoleBinding</text>
  <text class="code" x="350" y="140" text-anchor="middle">probe-reader-pod-reader</text>

  <rect class="ask" x="510" y="100" width="130" height="50" rx="8"/>
  <text x="575" y="121" text-anchor="middle">Role</text>
  <text class="code" x="575" y="140" text-anchor="middle">pod-reader</text>

  <rect class="ok" x="690" y="100" width="115" height="50" rx="8"/>
  <text class="code" x="747" y="130" text-anchor="middle">pods</text>

  <rect class="drop" x="450" y="225" width="160" height="40" rx="8"/>
  <text class="code" x="530" y="250" text-anchor="middle">pods</text>
</svg>
