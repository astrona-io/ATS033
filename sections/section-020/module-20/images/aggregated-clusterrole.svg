<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 320" width="840" height="320" role="img" aria-labelledby="title desc">
  <title id="title">How an aggregated ClusterRole grows</title>
  <desc id="desc">ClusterRoles with the label rbac.authorization.k8s.io/aggregate-to-view set to true, such as system:aggregate-to-view or a new ClusterRole for a CRD, are read by a controller in kube-controller-manager. The controller copies their rules into the view ClusterRole, which holds an aggregationRule with a label selector. A RoleBinding to view then grants the copied rules too.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>
  <path class="line" d="M240 80 H262 V125 H303" marker-end="url(#arrow)"/>
  <path class="line" d="M240 180 H262 V150 H303" marker-end="url(#arrow)"/>
  <path class="okline" d="M465 138 H598" marker-end="url(#arrowok)"/>
  <path class="line" d="M710 238 V178" marker-end="url(#arrow)"/>

  <rect class="box" x="20" y="50" width="220" height="60" rx="8"/>
  <text class="code" x="130" y="75" text-anchor="middle">system:aggregate-to-view</text>
  <text class="label" x="130" y="96" text-anchor="middle">has the aggregate-to-view label</text>
  <rect class="ask" x="20" y="150" width="220" height="60" rx="8"/>
  <text x="130" y="175" text-anchor="middle">new ClusterRole for a CRD</text>
  <text class="label" x="130" y="196" text-anchor="middle">adds the same label</text>

  <rect class="frame" x="280" y="60" width="215" height="140" rx="10"/>
  <text class="label" x="292" y="82"><tspan class="code">kube-controller-manager</tspan></text>
  <rect class="box" x="305" y="108" width="160" height="60" rx="8"/>
  <text x="385" y="134" text-anchor="middle">aggregation</text>
  <text x="385" y="154" text-anchor="middle">controller</text>
  <text class="label good" x="547" y="128" text-anchor="middle">copies rules</text>

  <rect class="ok" x="600" y="100" width="220" height="76" rx="8"/>
  <text x="710" y="124" text-anchor="middle">ClusterRole <tspan class="code">view</tspan></text>
  <text class="code" x="710" y="144" text-anchor="middle">aggregationRule:</text>
  <text class="label" x="710" y="164" text-anchor="middle">label selector</text>

  <rect class="box" x="600" y="240" width="220" height="56" rx="8"/>
  <text x="710" y="263" text-anchor="middle">RoleBinding to <tspan class="code">view</tspan></text>
  <text class="label" x="710" y="283" text-anchor="middle">grants the copied rules too</text>
  <text class="code label" x="720" y="212">roleRef</text>
</svg>
