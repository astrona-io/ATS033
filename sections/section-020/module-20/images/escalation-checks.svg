<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 340" width="840" height="340" role="img" aria-labelledby="title desc">
  <title id="title">How the API server stops privilege escalation</title>
  <desc id="desc">A user sends a request to create or update a Role, a ClusterRole or a binding. Check 1: does the user already hold every permission in the role? If yes, the request is allowed. If no, check 2: does the user hold the verb escalate for roles or bind for bindings? If yes, the request is allowed. If no, the request is rejected.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>
  <path class="line" d="M190 80 H228" marker-end="url(#arrow)"/>
  <path class="okline" d="M490 80 H598" marker-end="url(#arrowok)"/>
  <path class="dashed" d="M360 120 V198" marker-end="url(#arrowbad)"/>
  <path class="okline" d="M490 215 H700 V122" marker-end="url(#arrowok)"/>
  <path class="dashed" d="M490 275 H598" marker-end="url(#arrowbad)"/>

  <text class="label good" x="530" y="72">yes</text>
  <text class="label bad" x="372" y="164">no</text>
  <text class="label good" x="530" y="207">yes</text>
  <text class="label bad" x="530" y="267">no</text>

  <rect class="box" x="20" y="40" width="170" height="80" rx="8"/>
  <text x="105" y="64" text-anchor="middle">Request to create</text>
  <text x="105" y="84" text-anchor="middle">a Role, ClusterRole</text>
  <text x="105" y="104" text-anchor="middle">or a binding</text>

  <rect class="ask" x="230" y="40" width="260" height="80" rx="8"/>
  <text class="strong" x="360" y="64" text-anchor="middle">Check 1</text>
  <text x="360" y="84" text-anchor="middle">Does the user already hold</text>
  <text x="360" y="104" text-anchor="middle">every permission in the role?</text>

  <rect class="ask" x="230" y="200" width="260" height="90" rx="8"/>
  <text class="strong" x="360" y="224" text-anchor="middle">Check 2</text>
  <text x="360" y="244" text-anchor="middle">Does the user hold <tspan class="code">escalate</tspan></text>
  <text x="360" y="264" text-anchor="middle">(for roles) or <tspan class="code">bind</tspan></text>
  <text x="360" y="282" text-anchor="middle">(for bindings)?</text>

  <rect class="ok" x="600" y="40" width="210" height="80" rx="8"/>
  <text class="strong good" x="705" y="68" text-anchor="middle">Allowed</text>
  <text x="705" y="92" text-anchor="middle">The API server stores</text>
  <text x="705" y="110" text-anchor="middle">the object.</text>

  <rect class="drop" x="600" y="250" width="210" height="60" rx="8"/>
  <text class="strong bad" x="705" y="276" text-anchor="middle">Rejected</text>
  <text x="705" y="298" text-anchor="middle">The request fails.</text>
</svg>
