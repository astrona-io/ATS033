apiVersion: astrona.io/v1
metadata:
  name: ats-033-lab-020-02-03
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    nodes:
      workers: 0
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: aggregated-secret-access-removed
    description: The view ClusterRole no longer aggregates access to Secrets
    type: file
    source: validation/validate-aggregated-secret-access-removed.sh
    points: 1
  - name: group-binding-removed
    description: No RoleBinding grants edit to every ServiceAccount of the namespace
    type: file
    source: validation/validate-group-binding-removed.sh
    points: 1
