apiVersion: astrona.io/v1
metadata:
  name: ats-033-lab-020-02-01
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/python:3.13-alpine
    - docker.io/library/busybox:1.37.0
    nodes:
      workers: 1
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: cluster-admin-removed
    description: ops-agent has no binding to cluster-admin and no cluster-wide access
    type: file
    source: validation/validate-cluster-admin-removed.sh
    points: 1
  - name: wildcard-binding-removed
    description: ops-agent has no RoleBinding to a wildcard Role
    type: file
    source: validation/validate-wildcard-binding-removed.sh
    points: 1
  - name: least-privilege-reader
    description: ops-agent can read pods and logs in its namespace through ops-agent-reader and nothing more
    type: file
    source: validation/validate-least-privilege-reader.sh
    points: 2
