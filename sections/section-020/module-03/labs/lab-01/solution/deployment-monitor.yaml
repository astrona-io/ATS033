apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitor
  namespace: starfleet-033-020-03-01
spec:
  replicas: 1
  selector:
    matchLabels:
      app: monitor
  template:
    metadata:
      labels:
        app: monitor
    spec:
      serviceAccountName: monitor
      automountServiceAccountToken: false
      containers:
      - name: monitor
        image: docker.io/library/busybox:1.37.0
        command:
        - sh
        - -c
        - sleep 3600
