apiVersion: astrona.io/v1
metadata:
  name: ats-033-lab-020-01-02
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  # The lab works on node accounts, groups, sudo rules and sshd, so it runs a
  # real one-node kubeadm cluster in a VM instead of a kind node container.
  type: qemu
  qemu:
  - image:
      type: oci
      source: ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-cks
      checksums:
        amd64: sha256:dc3348c725b6b36d08888acdcbda44cc34894b76d5b56a594f7ce253b6d2e773
        arm64: sha256:31798490219e2ee856d7f8c2cb9df83182bbac64c7d8ce7c15e81445527d7898
    cpus: 2
    memoryMB: 4096
    diskSizeGB: 25
    display: false
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: vm/install.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: vm/verify-start.sh
  - name: reference-result
    type: file
    source: vm/apply-solution.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: vm/wait-solved.sh
validation:
  scripts:
  - name: departed-locked
    description: passwd -S reports departed-user as locked (L)
    type: file
    source: vm/validate-departed-locked.sh
    points: 1
  - name: departed-expired
    description: departed-user has an expiry date in the past and su to the account fails
    type: file
    source: vm/validate-departed-expired.sh
    points: 1
  - name: departed-nologin
    description: departed-user has a nologin shell
    type: file
    source: vm/validate-departed-nologin.sh
    points: 1
  - name: sshd-hardened
    description: sshd -T and the running sshd refuse root and password logins
    type: file
    source: vm/validate-sshd-hardened.sh
    points: 1
