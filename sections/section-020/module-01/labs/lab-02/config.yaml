apiVersion: astrona.io/v1
metadata:
  name: ats-033-lab-020-01-02
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    nodes:
      workers: 0
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: departed-locked
    description: passwd -S reports departed-user as locked (L)
    type: file
    source: validation/validate-departed-locked.sh
    points: 1
  - name: departed-expired
    description: departed-user has an expiry date in the past and su to the account fails
    type: file
    source: validation/validate-departed-expired.sh
    points: 1
  - name: departed-nologin
    description: departed-user has a nologin shell
    type: file
    source: validation/validate-departed-nologin.sh
    points: 1
