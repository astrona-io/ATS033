apiVersion: astrona.io/v1
metadata:
  name: ats-033-lab-020-01-01
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    nodes:
      workers: 0
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: navigator-group-read
    description: navigator reads telemetry.log through the flight-log-readers group and holds no other extra group
    type: file
    source: validation/validate-navigator-group-read.sh
    points: 1
  - name: other-accounts-denied
    description: telemetry.log is root:flight-log-readers without read access for other accounts, so cadet is denied
    type: file
    source: validation/validate-other-accounts-denied.sh
    points: 1
