apiVersion: astrona.io/v1
metadata:
  name: ats-033-lab-020-01-03
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  # The lab works on node accounts, groups, sudo rules and sshd, so it runs a
  # real one-node kubeadm cluster in a VM instead of a kind node container.
  type: qemu
  qemu:
  - image:
      type: oci
      source: ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-cks-20261118-{ARCH}
      checksums:
        amd64: sha256:dc3348c725b6b36d08888acdcbda44cc34894b76d5b56a594f7ce253b6d2e773
        arm64: sha256:31798490219e2ee856d7f8c2cb9df83182bbac64c7d8ce7c15e81445527d7898
    cpus: 2
    memoryMB: 4096
    diskSizeGB: 25
    display: false
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: vm/install.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: vm/verify-start.sh
  - name: reference-result
    type: file
    source: vm/apply-solution.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: vm/wait-solved.sh
validation:
  scripts:
  - name: group-access-revoked
    description: leaver is out of flight-ops and cannot read the roster, while crew-member still can
    type: file
    source: vm/validate-group-access-revoked.sh
    points: 1
  - name: sudo-rule-removed
    description: sudo -l -U leaver allows nothing, visudo -c passes and the crew-member rule stays
    type: file
    source: vm/validate-sudo-rule-removed.sh
    points: 1
  - name: cluster-access-revoked
    description: The Kubernetes user leaver has no binding and kubectl auth can-i answers no, while crew-member keeps its access
    type: file
    source: vm/validate-cluster-access-revoked.sh
    points: 1
  - name: account-locked
    description: passwd -S reports leaver as locked (L), a key login as leaver is refused and the account still exists
    type: file
    source: vm/validate-account-locked.sh
    points: 1
