apiVersion: astrona.io/v1
metadata:
  name: ats-033-playground-020-01
  docs:
    guide: docs/overview.md
# The readings work on node accounts, groups, file modes, sudo and sshd, so the
# playground is a real one-node kubeadm cluster in a VM instead of kind node
# containers.
runtime:
  type: qemu
  qemu:
  - image:
      type: oci
      source: ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-cks
    cpus: 2
    memoryMB: 4096
    diskSizeGB: 25
    display: false
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
