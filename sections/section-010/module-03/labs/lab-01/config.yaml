apiVersion: astrona.io/v1
metadata:
  name: ats-033-lab-010-03-01
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/busybox:1.37.0
    nodes:
      workers: 1
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: no-host-namespaces
    description: The beacon pod shares no host namespace, has its own IP address and cannot see node processes
    type: file
    source: validation/validate-no-host-namespaces.sh
    points: 1
  - name: scratch-volume
    description: The beacon pod mounts no hostPath volume and can write to an emptyDir at /scratch
    type: file
    source: validation/validate-scratch-volume.sh
    points: 1
  - name: non-root-unprivileged
    description: The beacon container runs as user 10001 without privilege, privilege escalation or capabilities
    type: file
    source: validation/validate-non-root-unprivileged.sh
    points: 2
  - name: read-only-root
    description: The beacon container has a read-only root filesystem and a write to / fails
    type: file
    source: validation/validate-read-only-root.sh
    points: 1
