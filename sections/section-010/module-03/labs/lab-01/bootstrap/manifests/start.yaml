apiVersion: v1
kind: Namespace
metadata:
  name: starfleet-033-010-03-01
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beacon
  namespace: starfleet-033-010-03-01
spec:
  replicas: 1
  selector:
    matchLabels:
      app: beacon
  template:
    metadata:
      labels:
        app: beacon
    spec:
      hostNetwork: true
      hostPID: true
      containers:
      - name: beacon
        image: docker.io/library/busybox:1.37.0
        command:
        - sh
        - -c
        - sleep 3600
        securityContext:
          privileged: true
        volumeMounts:
        - name: host-log
          mountPath: /host-log
      volumes:
      - name: host-log
        hostPath:
          path: /var/log
