apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger
  namespace: starfleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ledger
  template:
    metadata:
      labels:
        app: ledger
    spec:
      nodeSelector:
        node-restriction.kubernetes.io/dedicated: ledger
      tolerations:
      - key: dedicated
        operator: Equal
        value: ledger
        effect: NoSchedule
      containers:
      - name: ledger
        image: docker.io/library/busybox:1.37.0
        command:
        - sh
        - -c
        - sleep 3600
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 10001
          capabilities:
            drop:
            - ALL
