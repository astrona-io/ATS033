apiVersion: astrona.io/v1
metadata:
  name: ats-033-lab-010-02-02
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  # The lab works on systemd, packages, sshd and accounts of a real host, so it
  # runs a one-node kubeadm cluster in an Ubuntu VM instead of kind node containers.
  type: qemu
  qemu:
  - image:
      type: oci
      source: ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-cks
    cpus: 2
    memoryMB: 4096
    diskSizeGB: 25
    display: false
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: vm/install.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: vm/verify-start.sh
  - name: reference-result
    type: file
    source: vm/apply-solution.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: vm/wait-solved.sh
validation:
  scripts:
  - name: olduser-no-login-shell
    description: olduser has a shell that refuses logins, so su olduser fails
    type: file
    source: vm/validate-olduser-no-login-shell.sh
    points: 1
  - name: olduser-password-locked
    description: passwd -S reports the password of olduser as locked (L)
    type: file
    source: vm/validate-olduser-password-locked.sh
    points: 1
  - name: single-uid-zero
    description: root is the only account with UID 0
    type: file
    source: vm/validate-single-uid-zero.sh
    points: 1
