<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 310" width="840" height="310" role="img" aria-labelledby="title desc">
  <title id="title">Three credentials of an unused account</title>
  <desc id="desc">The unused account olduser has three credentials. The shell set to /usr/sbin/nologin refuses su and console logins. The locked password refuses password logins. The removed authorized_keys file refuses key logins.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>
  <path class="line" d="M190 165 L296 65" marker-end="url(#arrow)"/>
  <path class="dashed" d="M560 65 H596" marker-end="url(#arrowbad)"/>
  <path class="line" d="M190 165 L296 165" marker-end="url(#arrow)"/>
  <path class="dashed" d="M560 165 H596" marker-end="url(#arrowbad)"/>
  <path class="line" d="M190 165 L296 265" marker-end="url(#arrow)"/>
  <path class="dashed" d="M560 265 H596" marker-end="url(#arrowbad)"/>
  <rect class="box" x="30" y="140" width="160" height="50" rx="8"/>
  <text x="110" y="170" text-anchor="middle"><tspan class="code">olduser</tspan> account</text>
  <rect class="ok" x="300" y="40" width="260" height="50" rx="8"/>
  <text x="430" y="70" text-anchor="middle">shell: <tspan class="code">/usr/sbin/nologin</tspan></text>
  <rect class="drop" x="600" y="40" width="210" height="50" rx="8"/>
  <text x="705" y="70" text-anchor="middle">su and console refused</text>
  <rect class="ok" x="300" y="140" width="260" height="50" rx="8"/>
  <text x="430" y="170" text-anchor="middle">password: locked (<tspan class="code">L</tspan>)</text>
  <rect class="drop" x="600" y="140" width="210" height="50" rx="8"/>
  <text x="705" y="170" text-anchor="middle">password login refused</text>
  <rect class="ok" x="300" y="240" width="260" height="50" rx="8"/>
  <text x="430" y="270" text-anchor="middle"><tspan class="code">authorized_keys</tspan>: removed</text>
  <rect class="drop" x="600" y="240" width="210" height="50" rx="8"/>
  <text x="705" y="270" text-anchor="middle">key login refused</text>
</svg>
