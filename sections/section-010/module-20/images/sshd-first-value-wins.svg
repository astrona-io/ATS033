<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 370" width="840" height="370" role="img" aria-labelledby="title desc">
  <title id="title">The first value of an sshd keyword wins</title>
  <desc id="desc">sshd reads the Include line at line 12 of sshd_config, then 50-cloud-init.conf with PasswordAuthentication yes, then 60-cloudimg-settings.conf and line 135 of the main file, both with PasswordAuthentication no. The first value, yes, is the effective value; the later no lines are ignored.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>
  <path class="line" d="M250 92 V110" marker-end="url(#arrow)"/>
  <path class="line" d="M250 164 V182" marker-end="url(#arrow)"/>
  <path class="line" d="M250 236 V254" marker-end="url(#arrow)"/>
  <path class="okline" d="M440 138 H596" marker-end="url(#arrowok)"/>
  <text class="label good" x="518" y="128" text-anchor="middle">first value: wins</text>
  <text class="strong" x="40" y="71" text-anchor="middle">1</text>
  <rect class="box" x="60" y="40" width="380" height="52" rx="8"/>
  <text class="label" x="76" y="60">sshd_config, line 12</text>
  <text class="code" x="76" y="80">Include /etc/ssh/sshd_config.d/*.conf</text>
  <text class="strong" x="40" y="143" text-anchor="middle">2</text>
  <rect class="ok" x="60" y="112" width="380" height="52" rx="8"/>
  <text class="label" x="76" y="132">50-cloud-init.conf</text>
  <text class="code" x="76" y="152">PasswordAuthentication yes</text>
  <text class="strong" x="40" y="215" text-anchor="middle">3</text>
  <rect class="drop" x="60" y="184" width="380" height="52" rx="8"/>
  <text class="label" x="76" y="204">60-cloudimg-settings.conf</text>
  <text class="code" x="76" y="224">PasswordAuthentication no</text>
  <text class="label bad" x="456" y="215">ignored: keyword already set</text>
  <text class="strong" x="40" y="287" text-anchor="middle">4</text>
  <rect class="drop" x="60" y="256" width="380" height="52" rx="8"/>
  <text class="label" x="76" y="276">sshd_config, line 135</text>
  <text class="code" x="76" y="296">PasswordAuthentication no</text>
  <text class="label bad" x="456" y="287">ignored: keyword already set</text>
  <rect class="ask" x="600" y="108" width="210" height="60" rx="8"/>
  <text x="705" y="132" text-anchor="middle">Effective value</text>
  <text class="code" x="705" y="153" text-anchor="middle">passwordauthentication yes</text>
  <text x="60" y="345">For each keyword, <tspan class="code">sshd</tspan> keeps the first value it reads and ignores later ones.</text>
</svg>
