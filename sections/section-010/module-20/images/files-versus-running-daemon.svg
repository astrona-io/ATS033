<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 310" width="840" height="310" role="img" aria-labelledby="title desc">
  <title id="title">Files on disk and the running daemon</title>
  <desc id="desc">sshd -T reads the files on disk now and shows passwordauthentication no. The running sshd process does not read the files until a reload, so it still offers publickey and password. systemctl reload ssh.service makes it read the files again.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>
  <path class="okline" d="M300 124 L416 70" marker-end="url(#arrowok)"/>
  <path class="dashed" d="M300 156 L416 210" marker-end="url(#arrowbad)"/>
  <text class="label good" x="330" y="82" text-anchor="middle">reads now</text>
  <text class="label bad" x="318" y="214" text-anchor="middle">not read</text>
  <text class="label bad" x="318" y="230" text-anchor="middle">until reload</text>
  <rect class="frame" x="30" y="90" width="270" height="100" rx="10"/>
  <text class="label" x="44" y="110">files on disk</text>
  <rect class="box" x="44" y="120" width="242" height="56" rx="8"/>
  <text class="code" x="165" y="143" text-anchor="middle">50-cloud-init.conf</text>
  <text class="code" x="165" y="163" text-anchor="middle">PasswordAuthentication no</text>
  <rect class="ok" x="420" y="40" width="390" height="56" rx="8"/>
  <text x="615" y="63" text-anchor="middle"><tspan class="code">sshd -T</tspan> reads the files now</text>
  <text class="code" x="615" y="84" text-anchor="middle">passwordauthentication no</text>
  <rect class="drop" x="420" y="182" width="390" height="56" rx="8"/>
  <text x="615" y="205" text-anchor="middle">running <tspan class="code">sshd</tspan> keeps its old values</text>
  <text class="code" x="615" y="226" text-anchor="middle">offers publickey,password</text>
  <text x="30" y="285"><tspan class="code">systemctl reload ssh.service</tspan> makes the running daemon read the files again.</text>
</svg>
