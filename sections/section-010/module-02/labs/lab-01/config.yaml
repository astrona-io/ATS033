apiVersion: astrona.io/v1
metadata:
  name: ats-033-lab-010-02-01
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  # The lab works on systemd, packages, sshd and accounts of a real host, so it
  # runs a one-node kubeadm cluster in an Ubuntu VM instead of kind node containers.
  type: qemu
  qemu:
  - image:
      type: oci
      source: ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-cks
      checksums:
        amd64: sha256:dc3348c725b6b36d08888acdcbda44cc34894b76d5b56a594f7ce253b6d2e773
        arm64: sha256:31798490219e2ee856d7f8c2cb9df83182bbac64c7d8ce7c15e81445527d7898
    cpus: 2
    memoryMB: 4096
    diskSizeGB: 25
    display: false
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: vm/install.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: vm/verify-start.sh
  - name: reference-result
    type: file
    source: vm/apply-solution.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: vm/wait-solved.sh
validation:
  scripts:
  - name: root-login-refused
    description: sshd -T shows the effective global PermitRootLogin value no
    type: file
    source: vm/validate-root-login-refused.sh
    points: 1
  - name: password-login-refused
    description: sshd -T shows PasswordAuthentication no and PubkeyAuthentication yes, and the running server no longer offers passwords
    type: file
    source: vm/validate-password-login-refused.sh
    points: 1
  - name: allow-listed-accounts-only
    description: sshd -T shows a global AllowUsers list of exactly opsadmin, student and astrona, and the running server refuses other accounts
    type: file
    source: vm/validate-allow-listed-accounts-only.sh
    points: 1
