apiVersion: astrona.io/v1
metadata:
  name: ats-033-lab-010-02-01
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    nodes:
      workers: 1
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: root-login-refused
    description: The first global PermitRootLogin value that sshd reads is no
    type: file
    source: validation/validate-root-login-refused.sh
    points: 1
  - name: password-login-refused
    description: The first global PasswordAuthentication value that sshd reads is no and key logins stay on
    type: file
    source: validation/validate-password-login-refused.sh
    points: 1
  - name: allow-only-opsadmin
    description: A global AllowUsers list, outside every Match block, allows only opsadmin
    type: file
    source: validation/validate-allow-only-opsadmin.sh
    points: 1
