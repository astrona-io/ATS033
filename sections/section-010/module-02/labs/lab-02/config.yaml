apiVersion: astrona.io/v1
metadata:
  name: ats-033-lab-010-02-02
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    nodes:
      workers: 1
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: olduser-no-login-shell
    description: olduser has a shell that refuses logins, so su olduser fails
    type: file
    source: validation/validate-olduser-no-login-shell.sh
    points: 1
  - name: olduser-password-locked
    description: passwd -S reports the password of olduser as locked (L)
    type: file
    source: validation/validate-olduser-password-locked.sh
    points: 1
  - name: single-uid-zero
    description: root is the only account with UID 0
    type: file
    source: validation/validate-single-uid-zero.sh
    points: 1
