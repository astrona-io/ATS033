apiVersion: astrona.io/v1
metadata:
  name: ats-033-playground-010-02
  docs:
    guide: docs/overview.md
# A real Ubuntu node with a running SSH daemon, so sshd -T, sshd -t and a
# reload of ssh.service work on a real host instead of a kind node container.
runtime:
  type: qemu
  qemu:
  - image:
      type: oci
      source: ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-cks
      checksums:
        amd64: sha256:dc3348c725b6b36d08888acdcbda44cc34894b76d5b56a594f7ce253b6d2e773
        arm64: sha256:31798490219e2ee856d7f8c2cb9df83182bbac64c7d8ce7c15e81445527d7898
    cpus: 2
    memoryMB: 4096
    diskSizeGB: 25
    display: false
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
