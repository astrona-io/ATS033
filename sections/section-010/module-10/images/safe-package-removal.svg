<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 270" width="840" height="270" role="img" aria-labelledby="title desc">
  <title id="title">Safe order for removing a package</title>
  <desc id="desc">Choose a package and simulate its removal first. If the simulation removes only this package, remove or purge it, then check the kubelet, the container runtime, the readyz endpoint and the pods. If it would remove other needed packages, keep the package.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="line" d="M170 135 H218" marker-end="url(#arrow)"/>
  <path class="okline" d="M305 110 V65 H468" marker-end="url(#arrowok)"/>
  <text class="label good" x="390" y="56" text-anchor="middle">only this package</text>
  <path class="dashed" d="M305 160 V215 H468" marker-end="url(#arrowbad)"/>
  <text class="label bad" x="390" y="234" text-anchor="middle">other needed packages</text>
  <path class="okline" d="M620 65 H668" marker-end="url(#arrowok)"/>

  <rect class="box" x="20" y="110" width="150" height="50" rx="8"/>
  <text x="95" y="140" text-anchor="middle">Choose a package</text>

  <rect class="ask" x="220" y="110" width="170" height="50" rx="8"/>
  <text x="305" y="140" text-anchor="middle">Simulate the removal</text>

  <rect class="ok" x="470" y="40" width="150" height="50" rx="8"/>
  <text x="545" y="70" text-anchor="middle">Remove or purge</text>

  <rect class="box" x="670" y="34" width="160" height="62" rx="8"/>
  <text x="750" y="60" text-anchor="middle">Check kubelet,</text>
  <text x="750" y="80" text-anchor="middle">runtime, readyz, pods</text>

  <rect class="drop" x="470" y="190" width="150" height="50" rx="8"/>
  <text x="545" y="220" text-anchor="middle">Keep the package</text>
</svg>
