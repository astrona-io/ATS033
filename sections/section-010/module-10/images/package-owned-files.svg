<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" width="840" height="300" role="img" aria-labelledby="title desc">
  <title id="title">Which files the package manager patches</title>
  <desc id="desc">dpkg -S finds the package that owns a file. /usr/bin/systemctl belongs to systemd and /usr/bin/node-diag belongs to node-diag-tools, so package updates patch both. /usr/local/sbin/astrona-kubeadm-init belongs to no package, so apt never patches it.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <text class="label" x="175" y="36" text-anchor="middle">file on the node</text>
  <text class="label" x="470" y="36" text-anchor="middle">package from <tspan class="code">dpkg -S</tspan></text>
  <text class="label" x="600" y="36">package updates</text>

  <path class="okline" d="M330 75 H378" marker-end="url(#arrowok)"/>
  <path class="okline" d="M330 155 H378" marker-end="url(#arrowok)"/>
  <path class="dashed" d="M330 235 H378" marker-end="url(#arrowbad)"/>

  <rect class="box" x="20" y="50" width="310" height="50" rx="8"/>
  <text class="code" x="175" y="80" text-anchor="middle">/usr/bin/systemctl</text>
  <rect class="ok" x="380" y="50" width="180" height="50" rx="8"/>
  <text class="code" x="470" y="80" text-anchor="middle">systemd</text>
  <text class="good" x="600" y="80">patched by updates</text>

  <rect class="box" x="20" y="130" width="310" height="50" rx="8"/>
  <text class="code" x="175" y="160" text-anchor="middle">/usr/bin/node-diag</text>
  <rect class="ok" x="380" y="130" width="180" height="50" rx="8"/>
  <text class="code" x="470" y="160" text-anchor="middle">node-diag-tools</text>
  <text class="good" x="600" y="160">patched by updates</text>

  <rect class="box" x="20" y="210" width="310" height="50" rx="8"/>
  <text class="code" x="175" y="240" text-anchor="middle">/usr/local/sbin/astrona-kubeadm-init</text>
  <rect class="drop" x="380" y="210" width="180" height="50" rx="8"/>
  <text x="470" y="240" text-anchor="middle">no package</text>
  <text class="bad" x="600" y="232">never patched by apt</text>
  <text x="600" y="252">own update process or new image</text>
</svg>
