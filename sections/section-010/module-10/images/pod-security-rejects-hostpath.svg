<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 320" width="840" height="320" role="img" aria-labelledby="title desc">
  <title id="title">Pod Security Admission rejects the hostPath pod</title>
  <desc id="desc">Without the enforce label, the API server stores the host-reader pod and the kubelet mounts the node directory /etc at /host-etc. With pod-security.kubernetes.io/enforce=baseline on the starfleet namespace, Pod Security Admission in the API server rejects the pod because of its hostPath volume, so it never reaches a node.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <text class="label" x="20" y="34">Namespace <tspan class="code">starfleet</tspan> without the enforce label</text>
  <path class="line" d="M170 78 H238" marker-end="url(#arrow)"/>
  <path class="okline" d="M430 78 H478" marker-end="url(#arrowok)"/>
  <rect class="box" x="20" y="50" width="150" height="56" rx="8"/>
  <text class="code" x="95" y="83" text-anchor="middle">kubectl apply</text>
  <rect class="box" x="240" y="50" width="190" height="56" rx="8"/>
  <text x="335" y="83" text-anchor="middle">API server</text>
  <rect class="ok" x="480" y="50" width="340" height="56" rx="8"/>
  <text x="650" y="73" text-anchor="middle">Pod runs on the node</text>
  <text class="code" x="650" y="94" text-anchor="middle">kubelet mounts /etc at /host-etc</text>

  <line class="sep" x1="20" y1="150" x2="820" y2="150"/>

  <text class="label" x="20" y="184">Namespace <tspan class="code">starfleet</tspan> with <tspan class="code">pod-security.kubernetes.io/enforce=baseline</tspan></text>
  <path class="line" d="M170 228 H238" marker-end="url(#arrow)"/>
  <path class="dashed" d="M430 228 H498" marker-end="url(#arrowbad)"/>
  <rect class="box" x="20" y="200" width="150" height="56" rx="8"/>
  <text class="code" x="95" y="233" text-anchor="middle">kubectl apply</text>
  <rect class="ask" x="240" y="200" width="190" height="56" rx="8"/>
  <text x="335" y="223" text-anchor="middle">API server</text>
  <text x="335" y="243" text-anchor="middle">Pod Security Admission</text>
  <rect class="drop" x="500" y="200" width="320" height="56" rx="8"/>
  <text x="660" y="223" text-anchor="middle">Forbidden, no pod is created</text>
  <text class="code" x="660" y="244" text-anchor="middle">hostPath volumes (volume "host-etc")</text>
  <text class="label" x="660" y="282" text-anchor="middle">the pod never reaches a node</text>
</svg>
