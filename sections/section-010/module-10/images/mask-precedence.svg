<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 290" width="840" height="290" role="img" aria-labelledby="title desc">
  <title id="title">A mask in /etc/systemd/system wins over the package unit file</title>
  <desc id="desc">When systemd looks up ModemManager.service, the name in /etc/systemd/system takes precedence. It is a symbolic link to /dev/null, so the start is refused. The package file in /usr/lib/systemd/system stays on disk but is not used while the mask exists.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="line" d="M200 128 H235 V68 H268" marker-end="url(#arrow)"/>
  <path class="line" d="M200 152 H235 V218 H268" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <path class="dashed" d="M600 68 H648" marker-end="url(#arrowbad)"/>

  <rect class="box" x="20" y="110" width="180" height="60" rx="8"/>
  <text class="code" x="110" y="135" text-anchor="middle">systemctl start</text>
  <text class="code" x="110" y="155" text-anchor="middle">ModemManager.service</text>

  <rect class="policy" x="270" y="40" width="330" height="56" rx="8"/>
  <text class="code" x="435" y="63" text-anchor="middle">/etc/systemd/system/</text>
  <text class="code" x="435" y="83" text-anchor="middle">ModemManager.service → /dev/null</text>
  <text class="label" x="435" y="116" text-anchor="middle">takes precedence</text>

  <rect class="drop" x="650" y="40" width="170" height="56" rx="8"/>
  <text x="735" y="63" text-anchor="middle">Start refused</text>
  <text x="735" y="83" text-anchor="middle">unit is masked</text>

  <rect class="box" x="270" y="190" width="330" height="56" rx="8" opacity="0.55"/>
  <text class="code" x="435" y="213" text-anchor="middle" opacity="0.7">/usr/lib/systemd/system/</text>
  <text class="code" x="435" y="233" text-anchor="middle" opacity="0.7">ModemManager.service</text>
  <text class="label" x="435" y="266" text-anchor="middle">not used while the mask exists</text>
  <text x="620" y="223">package file, still on disk</text>
</svg>
