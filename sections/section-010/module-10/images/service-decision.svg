<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 290" width="840" height="290" role="img" aria-labelledby="title desc">
  <title id="title">Decide about each service on the node</title>
  <desc id="desc">For each service, ask whether it has a purpose. A service without a purpose is a candidate for removal. A service with a purpose stays; if it needs a network listener, limit who can connect to it.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="line" d="M170 145 H218" marker-end="url(#arrow)"/>
  <path class="dashed" d="M295 170 V223" marker-end="url(#arrowbad)"/>
  <text class="label bad" x="305" y="202">no</text>
  <path class="okline" d="M370 145 H438" marker-end="url(#arrowok)"/>
  <text class="label good" x="404" y="137" text-anchor="middle">yes</text>
  <path class="okline" d="M525 120 V68 H648" marker-end="url(#arrowok)"/>
  <text class="label good" x="535" y="92">no</text>
  <path class="okline" d="M525 170 V228 H648" marker-end="url(#arrowok)"/>
  <text class="label good" x="535" y="206">yes</text>

  <rect class="box" x="20" y="120" width="150" height="50" rx="8"/>
  <text x="95" y="150" text-anchor="middle">Service on the node</text>

  <rect class="ask" x="220" y="120" width="150" height="50" rx="8"/>
  <text x="295" y="150" text-anchor="middle">Has a purpose?</text>

  <rect class="drop" x="200" y="225" width="190" height="50" rx="8"/>
  <text x="295" y="255" text-anchor="middle">Candidate for removal</text>

  <rect class="ask" x="440" y="120" width="170" height="50" rx="8"/>
  <text x="525" y="150" text-anchor="middle">Needs a listener?</text>

  <rect class="ok" x="650" y="40" width="180" height="56" rx="8"/>
  <text x="740" y="63" text-anchor="middle">Keep the service</text>
  <text x="740" y="83" text-anchor="middle">no network exposure</text>

  <rect class="ok" x="650" y="200" width="180" height="56" rx="8"/>
  <text x="740" y="223" text-anchor="middle">Keep the service</text>
  <text x="740" y="243" text-anchor="middle">limit who can connect</text>
</svg>
