<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 340" width="840" height="340" role="img" aria-labelledby="title desc">
  <title id="title">Four interfaces that give host authority</title>
  <desc id="desc">Write access to the container runtime socket, a hostPath volume, the host namespaces of a pod and a privileged container each give a process the same power as a root shell on the node, without any network port.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="line" d="M360 68 L558 160" marker-end="url(#arrow)"/>
  <path class="line" d="M360 143 L558 172" marker-end="url(#arrow)"/>
  <path class="line" d="M360 218 L558 188" marker-end="url(#arrow)"/>
  <path class="line" d="M360 293 L558 200" marker-end="url(#arrow)"/>

  <rect class="box" x="30" y="40" width="330" height="56" rx="8"/>
  <text class="strong" x="46" y="63">Container runtime socket</text>
  <text class="code" x="46" y="84">/run/containerd/containerd.sock</text>

  <rect class="box" x="30" y="115" width="330" height="56" rx="8"/>
  <text class="strong" x="46" y="138">hostPath volume</text>
  <text x="46" y="159">a node file or directory inside a pod</text>

  <rect class="box" x="30" y="190" width="330" height="56" rx="8"/>
  <text class="strong" x="46" y="213">Host namespaces</text>
  <text class="code" x="46" y="234">hostNetwork, hostPID, hostIPC</text>

  <rect class="box" x="30" y="265" width="330" height="56" rx="8"/>
  <text class="strong" x="46" y="288">Privileged container</text>
  <text class="code" x="46" y="309">privileged: true</text>

  <rect class="drop" x="560" y="135" width="250" height="90" rx="8"/>
  <text class="strong" x="685" y="164" text-anchor="middle">Host authority</text>
  <text x="685" y="188" text-anchor="middle">same power as a root</text>
  <text x="685" y="208" text-anchor="middle">shell on the node</text>
</svg>
