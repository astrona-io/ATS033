<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="840" height="330" role="img" aria-labelledby="title desc">
  <title id="title">Only admission can refuse a pod</title>
  <desc id="desc">kubectl apply sends the pod to the API server, where an admission check can refuse it. An accepted pod is stored. On the node, the kubelet reads the specification and containerd creates the container with the namespaces, mounts and security settings it asks for, without checking the host fields.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="line" d="M190 72 H258" marker-end="url(#arrow)"/>
  <path class="dashed" d="M480 72 H588" marker-end="url(#arrowbad)"/>
  <path class="okline" d="M370 94 V140 H160 V210" marker-end="url(#arrowok)"/>
  <path class="line" d="M260 232 H318" marker-end="url(#arrow)"/>
  <path class="line" d="M520 232 H578" marker-end="url(#arrow)"/>
  <text class="label bad" x="534" y="62" text-anchor="middle">refuses</text>
  <text class="label good" x="380" y="130">accepted and stored</text>
  <text class="label" x="289" y="222" text-anchor="middle">reads</text>
  <text class="label" x="549" y="222" text-anchor="middle">creates</text>
  <rect class="box" x="30" y="50" width="160" height="44" rx="8"/>
  <text class="code" x="110" y="77" text-anchor="middle">kubectl apply</text>
  <rect class="ask" x="260" y="50" width="220" height="44" rx="8"/>
  <text x="370" y="77" text-anchor="middle">API server: admission</text>
  <rect class="drop" x="590" y="50" width="220" height="44" rx="8"/>
  <text x="700" y="77" text-anchor="middle">Pod rejected, not stored</text>
  <rect class="frame" x="30" y="170" width="780" height="140" rx="10"/>
  <text class="label" x="794" y="192" text-anchor="end">Node: no check of host fields here</text>
  <rect class="box" x="60" y="210" width="200" height="44" rx="8"/>
  <text class="code" x="160" y="237" text-anchor="middle">kubelet</text>
  <rect class="box" x="320" y="210" width="200" height="44" rx="8"/>
  <text class="code" x="420" y="237" text-anchor="middle">containerd</text>
  <rect class="box" x="580" y="210" width="210" height="44" rx="8"/>
  <text x="685" y="237" text-anchor="middle">container</text>
  <text class="label" x="420" y="290" text-anchor="middle">Sets up the namespaces, mounts and security settings that the specification asks for</text>
</svg>
