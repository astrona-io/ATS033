<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 340" width="840" height="340" role="img" aria-labelledby="title desc">
  <title id="title">Pod Security levels and modes</title>
  <desc id="desc">The privileged level allows everything. The baseline level blocks host namespaces, hostPath, host ports, privileged containers and extra capabilities. The restricted level adds non-root users, no privilege escalation, dropped capabilities, a seccomp profile and few volume types. For a pod that breaks the level, enforce rejects it, warn accepts it with a warning, and audit accepts it and records an audit event.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="line" d="M14 60 V292" marker-end="url(#arrow)"/>
  <path class="line" d="M590 74 H608" marker-end="url(#arrow)"/>
  <path class="line" d="M590 158 H608" marker-end="url(#arrow)"/>
  <path class="line" d="M590 242 H608" marker-end="url(#arrow)"/>
  <text class="strong" x="30" y="36">Level (from loosest to strictest)</text>
  <text class="strong" x="500" y="36">Mode, for a pod that breaks the level</text>
  <rect class="ok" x="30" y="52" width="420" height="68" rx="8"/>
  <text class="code strong" x="46" y="76">privileged</text>
  <text x="46" y="96">Allows everything</text>
  <rect class="ask" x="30" y="136" width="420" height="68" rx="8"/>
  <text class="code strong" x="46" y="160">baseline</text>
  <text x="46" y="180">Blocks host namespaces, hostPath, host ports,</text>
  <text x="46" y="198">privileged containers, extra capabilities</text>
  <rect class="drop" x="30" y="220" width="420" height="68" rx="8"/>
  <text class="code strong" x="46" y="244">restricted</text>
  <text x="46" y="264">Baseline plus: non-root, no privilege escalation,</text>
  <text x="46" y="282">drop all capabilities, seccomp, few volume types</text>
  <rect class="box" x="500" y="52" width="90" height="44" rx="8"/>
  <text class="code" x="545" y="79" text-anchor="middle">enforce</text>
  <rect class="drop" x="610" y="52" width="200" height="44" rx="8"/>
  <text x="710" y="79" text-anchor="middle">Rejected</text>
  <rect class="box" x="500" y="136" width="90" height="44" rx="8"/>
  <text class="code" x="545" y="163" text-anchor="middle">warn</text>
  <rect class="ask" x="610" y="136" width="200" height="44" rx="8"/>
  <text x="710" y="155" text-anchor="middle">Accepted,</text>
  <text x="710" y="173" text-anchor="middle">warning to the user</text>
  <rect class="box" x="500" y="220" width="90" height="44" rx="8"/>
  <text class="code" x="545" y="247" text-anchor="middle">audit</text>
  <rect class="ask" x="610" y="220" width="200" height="44" rx="8"/>
  <text x="710" y="239" text-anchor="middle">Accepted,</text>
  <text x="710" y="257" text-anchor="middle">audit event recorded</text>
  <text class="code" x="420" y="318" text-anchor="middle">Label: pod-security.kubernetes.io/&lt;mode&gt;=&lt;level&gt;</text>
</svg>
