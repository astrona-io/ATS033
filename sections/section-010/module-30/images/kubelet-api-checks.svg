<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="840" height="330" role="img" aria-labelledby="title desc">
  <title id="title">Checks on the kubelet API</title>
  <desc id="desc">A request to kubelet port 10250 without credentials gets 401 Unauthorized because anonymous access is off. A request with a valid identity goes through a Webhook check, where the API server decides if the caller may do the action. The read-only port 10255 serves plain HTTP without authentication, so with readOnlyPort 0 it must not listen at all.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="dashed" d="M240 85 H298" marker-end="url(#arrowbad)"/>
  <path class="dashed" d="M500 85 H578" marker-end="url(#arrowbad)"/>
  <path class="line" d="M240 185 H298" marker-end="url(#arrow)"/>
  <path class="okline" d="M500 185 H578" marker-end="url(#arrowok)"/>
  <path class="dashed" d="M240 285 H298" marker-end="url(#arrowbad)"/>
  <text class="label bad" x="539" y="75" text-anchor="middle">refused</text>
  <text class="label" x="539" y="175" text-anchor="middle">asks</text>
  <rect class="box" x="30" y="60" width="210" height="50" rx="8"/>
  <text x="135" y="82" text-anchor="middle">Request without</text>
  <text x="135" y="100" text-anchor="middle">credentials</text>
  <rect class="box" x="30" y="160" width="210" height="50" rx="8"/>
  <text x="135" y="182" text-anchor="middle">Request with a</text>
  <text x="135" y="200" text-anchor="middle">valid identity</text>
  <rect class="box" x="30" y="260" width="210" height="50" rx="8"/>
  <text x="135" y="282" text-anchor="middle">Plain HTTP request,</text>
  <text x="135" y="300" text-anchor="middle">no authentication</text>
  <rect class="box" x="300" y="60" width="200" height="50" rx="8"/>
  <text x="400" y="82" text-anchor="middle">kubelet port 10250</text>
  <text class="code" x="400" y="100" text-anchor="middle">anonymous.enabled: false</text>
  <rect class="ask" x="300" y="160" width="200" height="50" rx="8"/>
  <text x="400" y="182" text-anchor="middle">kubelet port 10250</text>
  <text class="code" x="400" y="200" text-anchor="middle">authorization: Webhook</text>
  <rect class="policy" x="300" y="260" width="200" height="50" rx="8"/>
  <text x="400" y="282" text-anchor="middle">port 10255</text>
  <text class="code" x="400" y="300" text-anchor="middle">readOnlyPort: 0</text>
  <rect class="drop" x="580" y="60" width="230" height="50" rx="8"/>
  <text class="code" x="695" y="90" text-anchor="middle">401 Unauthorized</text>
  <rect class="ok" x="580" y="160" width="230" height="50" rx="8"/>
  <text x="695" y="182" text-anchor="middle">API server decides if the</text>
  <text x="695" y="200" text-anchor="middle">caller may do the action</text>
  <text class="label bad" x="520" y="290">Must not listen at all</text>
</svg>
