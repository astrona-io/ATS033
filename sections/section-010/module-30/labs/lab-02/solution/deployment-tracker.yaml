apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracker
  namespace: outpost-033-010-03-02
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tracker
  template:
    metadata:
      labels:
        app: tracker
    spec:
      containers:
      - name: tracker
        image: docker.io/library/busybox:1.37.0
        command:
        - sh
        - -c
        - sleep 3600
