apiVersion: astrona.io/v1
metadata:
  name: ats-033-lab-010-03-02
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/busybox:1.37.0
    nodes:
      workers: 1
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: baseline-enforced
    description: The outpost namespace enforces the baseline Pod Security Standard and the API server rejects a privileged pod
    type: file
    source: validation/validate-baseline-enforced.sh
    points: 1
  - name: tracker-without-host-access
    description: The tracker Deployment runs without hostPID, hostNetwork, hostIPC or privilege and all its pods are Ready
    type: file
    source: validation/validate-tracker-without-host-access.sh
    points: 1
