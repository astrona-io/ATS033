apiVersion: astrona.io/v1
metadata:
  name: ats-033-lab-010-01-02
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    nodes:
      workers: 1
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: package-removed
    description: The debug-relay package is no longer installed, its program is gone and nothing listens on TCP port 7070
    type: file
    source: validation/validate-package-removed.sh
    points: 1
  - name: configuration-purged
    description: dpkg keeps no record of debug-relay and its configuration file is gone
    type: file
    source: validation/validate-configuration-purged.sh
    points: 1
