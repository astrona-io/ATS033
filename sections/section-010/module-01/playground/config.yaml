apiVersion: astrona.io/v1
metadata:
  name: ats-033-playground-010-01
  docs:
    guide: docs/overview.md
# A real Ubuntu node with systemd, apt and dpkg, so the service and package
# commands of this module run on a real host instead of a kind node container.
runtime:
  type: qemu
  qemu:
  - image:
      type: oci
      source: ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-cks
    cpus: 2
    memoryMB: 4096
    diskSizeGB: 25
    display: false
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
