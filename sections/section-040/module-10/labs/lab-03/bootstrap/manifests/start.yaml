apiVersion: v1
kind: Namespace
metadata:
  name: starfleet-033-040-01-03
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scout
  namespace: starfleet-033-040-01-03
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scout
  template:
    metadata:
      labels:
        app: scout
    spec:
      containers:
      - name: scout
        image: docker.io/library/busybox:1.37.0
        command:
        - sh
        - -c
        - while date > /tmp/heartbeat; do sleep 5; done
        readinessProbe:
          exec:
            command:
            - cat
            - /tmp/heartbeat
          periodSeconds: 5
