<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" width="840" height="400" role="img" aria-labelledby="title desc">
  <title id="title">How the kubelet resolves a seccomp profile</title>
  <desc id="desc">The kubelet reads the seccompProfile type. RuntimeDefault gives the default filter of the container runtime. Localhost gives the profile file in /var/lib/kubelet/seccomp. Unconfined gives no filter. When the field is not set, the kubelet setting seccompDefault decides: true gives the runtime default filter, false gives no filter.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="line" d="M420 92 V118"/>
  <path class="line" d="M110 118 H695"/>
  <path class="okline" d="M110 118 V158" marker-end="url(#arrowok)"/>
  <path class="okline" d="M305 118 V158" marker-end="url(#arrowok)"/>
  <path class="dashed" d="M500 118 V158" marker-end="url(#arrowbad)"/>
  <path class="line" d="M695 118 V158" marker-end="url(#arrow)"/>
  <text class="label" x="118" y="142">RuntimeDefault</text>
  <text class="label" x="313" y="142">Localhost</text>
  <text class="label" x="508" y="142">Unconfined</text>
  <text class="label" x="703" y="142">not set</text>
  <path class="okline" d="M650 230 V290" marker-end="url(#arrowok)"/>
  <path class="dashed" d="M745 230 V290" marker-end="url(#arrowbad)"/>
  <text class="label good" x="642" y="266" text-anchor="end">true</text>
  <text class="label bad" x="753" y="266">false</text>

  <rect class="box" x="290" y="40" width="260" height="52" rx="8"/>
  <text x="420" y="64" text-anchor="middle">pod or container</text>
  <text class="code" x="420" y="82" text-anchor="middle">seccompProfile.type</text>

  <rect class="ok" x="20" y="160" width="180" height="70" rx="8"/>
  <text x="110" y="190" text-anchor="middle">default filter of</text>
  <text x="110" y="210" text-anchor="middle">the runtime</text>
  <rect class="ok" x="215" y="160" width="180" height="70" rx="8"/>
  <text x="305" y="188" text-anchor="middle">profile file in</text>
  <text class="code" x="305" y="210" text-anchor="middle" style="font-size: 11.5px">/var/lib/kubelet/seccomp</text>
  <rect class="drop" x="410" y="160" width="180" height="70" rx="8"/>
  <text x="500" y="200" text-anchor="middle">no filter</text>
  <rect class="ask" x="605" y="160" width="180" height="70" rx="8"/>
  <text x="695" y="188" text-anchor="middle">kubelet setting</text>
  <text class="code" x="695" y="210" text-anchor="middle">seccompDefault</text>

  <rect class="ok" x="545" y="292" width="140" height="62" rx="8"/>
  <text x="615" y="318" text-anchor="middle">default filter</text>
  <text x="615" y="338" text-anchor="middle">of the runtime</text>
  <rect class="drop" x="705" y="292" width="115" height="62" rx="8"/>
  <text x="762" y="328" text-anchor="middle">no filter</text>
</svg>
