<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" width="840" height="420" role="img" aria-labelledby="title desc">
  <title id="title">When a pod with an AppArmor profile can start</title>
  <desc id="desc">A pod with appArmorProfile first needs a node with AppArmor enabled; if not, the pod is not admitted or the profile is not applied. With RuntimeDefault the runtime default profile applies. With Localhost the profile must be loaded on the node: if it is, the container starts under the profile, if not, the container does not start. Unconfined applies no restriction.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="line" d="M420 82 V108" marker-end="url(#arrow)"/>
  <path class="dashed" d="M300 135 H210" marker-end="url(#arrowbad)"/>
  <text class="label bad" x="255" y="125" text-anchor="middle">no</text>
  <path class="okline" d="M420 162 V196" marker-end="url(#arrowok)"/>
  <text class="label good" x="430" y="185">yes</text>
  <path class="line" d="M420 244 V262"/>
  <path class="line" d="M150 262 H690"/>
  <path class="okline" d="M150 262 V292" marker-end="url(#arrowok)"/>
  <path class="line" d="M420 262 V292" marker-end="url(#arrow)"/>
  <path class="line" d="M690 262 V292" marker-end="url(#arrow)"/>
  <text class="label" x="158" y="283">RuntimeDefault</text>
  <text class="label" x="428" y="283">Localhost</text>
  <text class="label" x="698" y="283">Unconfined</text>
  <path class="okline" d="M370 340 V368" marker-end="url(#arrowok)"/>
  <path class="dashed" d="M470 340 V368" marker-end="url(#arrowbad)"/>
  <text class="label good" x="362" y="360" text-anchor="end">yes</text>
  <text class="label bad" x="478" y="360">no</text>

  <rect class="box" x="300" y="30" width="240" height="52" rx="8"/>
  <text x="420" y="54" text-anchor="middle">pod with</text>
  <text class="code" x="420" y="72" text-anchor="middle">appArmorProfile</text>
  <rect class="ask" x="300" y="110" width="240" height="50" rx="8"/>
  <text x="420" y="140" text-anchor="middle">node has AppArmor enabled?</text>
  <rect class="drop" x="30" y="105" width="180" height="60" rx="8"/>
  <text x="120" y="130" text-anchor="middle">pod not admitted or</text>
  <text x="120" y="150" text-anchor="middle">profile not applied</text>
  <rect class="ask" x="320" y="198" width="200" height="46" rx="8"/>
  <text x="420" y="226" text-anchor="middle">which type?</text>

  <rect class="ok" x="60" y="294" width="180" height="46" rx="8"/>
  <text x="150" y="322" text-anchor="middle">runtime default profile</text>
  <rect class="ask" x="320" y="294" width="200" height="46" rx="8"/>
  <text x="420" y="322" text-anchor="middle">profile loaded on node?</text>
  <rect class="box" x="600" y="294" width="180" height="46" rx="8"/>
  <text x="690" y="322" text-anchor="middle">no restriction</text>
  <rect class="ok" x="230" y="370" width="170" height="40" rx="8"/>
  <text x="315" y="395" text-anchor="middle">starts under profile</text>
  <rect class="drop" x="440" y="370" width="170" height="40" rx="8"/>
  <text x="525" y="395" text-anchor="middle">container not started</text>
</svg>
