<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" width="840" height="300" role="img" aria-labelledby="title desc">
  <title id="title">seccomp allows the syscall, AppArmor denies the path</title>
  <desc id="desc">The shell in the apparmor-localhost pod runs echo test > /tmp/file. The openat syscall passes seccomp, because seccomp decides on the syscall name and openat is allowed. AppArmor then checks the path /tmp/file against the profile k8s-deny-tmp-write, whose rule deny /tmp/** w blocks the write, so the shell gets Permission denied.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="okline" d="M210 130 H278" marker-end="url(#arrowok)"/>
  <text class="label code" x="236" y="120" text-anchor="middle">openat</text>
  <path class="okline" d="M480 130 H548" marker-end="url(#arrowok)"/>
  <text class="label good" x="514" y="120" text-anchor="middle">allowed</text>
  <path class="dashed" d="M680 165 V215 H120 V168" marker-end="url(#arrowbad)"/>
  <text class="label bad code" x="400" y="235" text-anchor="middle">Permission denied</text>

  <rect class="box" x="30" y="95" width="180" height="70" rx="8"/>
  <text class="code" x="120" y="124" text-anchor="middle">apparmor-localhost</text>
  <text class="code" x="120" y="146" text-anchor="middle">echo test &gt; /tmp/file</text>

  <rect class="frame" x="260" y="40" width="560" height="140" rx="10"/>
  <text class="label" x="275" y="62">kernel</text>
  <rect class="ok" x="280" y="95" width="200" height="70" rx="8"/>
  <text class="strong" x="380" y="122" text-anchor="middle">seccomp</text>
  <text x="380" y="146" text-anchor="middle">checks the syscall name</text>
  <rect class="drop" x="550" y="95" width="250" height="70" rx="8"/>
  <text class="strong" x="675" y="122" text-anchor="middle">AppArmor</text>
  <text class="code" x="675" y="146" text-anchor="middle">deny /tmp/** w,</text>
  <text x="400" y="272" text-anchor="middle">The write is blocked by the path, not by the syscall.</text>
</svg>
