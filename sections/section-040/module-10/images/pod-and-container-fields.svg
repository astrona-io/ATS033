<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="840" height="330" role="img" aria-labelledby="title desc">
  <title id="title">Pod-level and container-level securityContext fields</title>
  <desc id="desc">The pod-level securityContext of restricted-reader holds runAsNonRoot, runAsUser, runAsGroup, fsGroup and seccompProfile, and applies to every container. The container-level securityContext of the reader container holds allowPrivilegeEscalation, capabilities and readOnlyRootFilesystem, which exist at container level only. A container value overrides a pod value.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <rect class="frame" x="30" y="30" width="780" height="280" rx="10"/>
  <text class="label" x="45" y="52">pod <tspan class="code">restricted-reader</tspan></text>
  <rect class="ask" x="50" y="70" width="330" height="220" rx="8"/>
  <text class="strong" x="70" y="96"><tspan class="code">spec.securityContext</tspan></text>
  <text x="70" y="118">applies to every container</text>
  <text class="code" x="70" y="152">runAsNonRoot: true</text>
  <text class="code" x="70" y="176">runAsUser: 1000</text>
  <text class="code" x="70" y="200">runAsGroup: 1000</text>
  <text class="code" x="70" y="224">fsGroup: 1000</text>
  <text class="code" x="70" y="248">seccompProfile:</text>
  <text class="code" x="90" y="268">type: RuntimeDefault</text>

  <rect class="frame" x="410" y="70" width="380" height="220" rx="10"/>
  <text class="label" x="425" y="92">container <tspan class="code">reader</tspan></text>
  <rect class="ok" x="425" y="105" width="350" height="140" rx="8"/>
  <text class="strong" x="445" y="130"><tspan class="code">securityContext</tspan></text>
  <text x="445" y="152">container level only</text>
  <text class="code" x="445" y="182">allowPrivilegeEscalation: false</text>
  <text class="code" x="445" y="206">capabilities: drop: [ALL]</text>
  <text class="code" x="445" y="230">readOnlyRootFilesystem: true</text>
  <text x="600" y="276" text-anchor="middle">A container value overrides a pod value.</text>
</svg>
