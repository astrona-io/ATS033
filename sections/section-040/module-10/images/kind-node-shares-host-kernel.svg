<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 340" width="840" height="340" role="img" aria-labelledby="title desc">
  <title id="title">The kind node uses the kernel of the host</title>
  <desc id="desc">The machine that runs Podman has one Linux kernel. The kind node is a container on that machine, and the pods run inside the node container. The pods and the node container use the same host kernel, so AppArmor works in the playground only if that kernel has AppArmor enabled.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <rect class="frame" x="30" y="30" width="780" height="290" rx="10"/>
  <text class="label" x="45" y="52">machine that runs Podman</text>
  <rect class="frame" x="60" y="70" width="720" height="140" rx="10"/>
  <text class="label" x="75" y="92">kind node container (Podman)</text>
  <rect class="box" x="90" y="110" width="200" height="70" rx="8"/>
  <text class="code" x="190" y="140" text-anchor="middle">probe</text>
  <text x="190" y="162" text-anchor="middle">pods</text>
  <rect class="box" x="320" y="110" width="200" height="70" rx="8"/>
  <text class="code" x="420" y="140" text-anchor="middle">shuttle</text>
  <text x="420" y="162" text-anchor="middle">pod</text>
  <rect class="box" x="550" y="110" width="200" height="70" rx="8"/>
  <text class="code" x="650" y="140" text-anchor="middle">drifter</text>
  <text x="650" y="162" text-anchor="middle">pod</text>
  <rect class="ask" x="60" y="230" width="720" height="70" rx="8"/>
  <text class="strong" x="420" y="258" text-anchor="middle">one Linux kernel, shared by everything above</text>
  <text x="420" y="282" text-anchor="middle">AppArmor works only if this kernel has it enabled</text>
</svg>
