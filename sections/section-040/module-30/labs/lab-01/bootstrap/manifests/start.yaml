apiVersion: v1
kind: Namespace
metadata:
  name: starfleet-033-040-03-01
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scout
  namespace: starfleet-033-040-03-01
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scout
  template:
    metadata:
      labels:
        app: scout
    spec:
      containers:
      - name: scout
        image: docker.io/library/busybox:1.37.0
        command:
        - sh
        - -c
        - sleep 3600
        securityContext:
          appArmorProfile:
            type: Localhost
            localhostProfile: k8s-deny-etc-write
