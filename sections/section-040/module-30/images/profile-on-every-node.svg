<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 350" width="840" height="350" role="img" aria-labelledby="title desc">
  <title id="title">A profile must be loaded on every node</title>
  <desc id="desc">The same pod asks for the profile k8s-deny-tmp-write. On the node whose kernel loaded the profile, the container runs under it. On the node without the profile, the container runtime does not create the container and the pod shows CreateContainerError.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <rect class="frame" x="20" y="110" width="390" height="220" rx="10"/>
  <text class="label" x="34" y="130" text-anchor="start">node with the profile</text>
  <rect class="frame" x="430" y="110" width="390" height="220" rx="10"/>
  <text class="label" x="444" y="130" text-anchor="start">node without the profile</text>
  <path class="okline" d="M330 76 L190 148" marker-end="url(#arrowok)"/>
  <path class="dashed" d="M530 76 L690 148" marker-end="url(#arrowbad)"/>
  <rect class="box" x="250" y="20" width="340" height="56" rx="8"/>
  <text x="420" y="43" text-anchor="middle">pod</text>
  <text x="420" y="63" text-anchor="middle"><tspan class="code">localhostProfile: k8s-deny-tmp-write</tspan></text>
  <rect class="ok" x="50" y="150" width="330" height="56" rx="8"/>
  <text x="215" y="183" text-anchor="middle">container runs under the profile</text>
  <rect class="ask" x="50" y="248" width="330" height="56" rx="8"/>
  <text x="215" y="271" text-anchor="middle">kernel: loaded</text>
  <text x="215" y="291" text-anchor="middle"><tspan class="code">k8s-deny-tmp-write</tspan></text>
  <rect class="drop" x="460" y="150" width="330" height="56" rx="8"/>
  <text x="625" y="173" text-anchor="middle">container not created</text>
  <text x="625" y="193" text-anchor="middle"><tspan class="code">CreateContainerError</tspan></text>
  <rect class="box" x="460" y="248" width="330" height="56" rx="8" opacity="0.7"/>
  <text x="625" y="281" text-anchor="middle">kernel: profile not loaded</text>
</svg>
