<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 350" width="870" height="350" role="img" aria-labelledby="title desc">
  <title id="title">Checks before a container runs under a profile</title>
  <desc id="desc">A pod with appArmorProfile reaches the kubelet. If the node has no AppArmor, the kubelet rejects the pod. Otherwise containerd checks that the profile is loaded. If it is not, the pod shows CreateContainerError. If it is, the container runs under the profile.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="line" d="M230 64 H268" marker-end="url(#arrow)"/>
  <path class="line" d="M400 64 H438" marker-end="url(#arrow)"/>
  <path class="dashed" d="M650 64 H678" marker-end="url(#arrowbad)"/>
  <text class="label bad" x="664" y="54" text-anchor="middle">no</text>
  <path class="line" d="M545 88 V158" marker-end="url(#arrow)"/>
  <text class="label" x="555" y="128" text-anchor="start">yes</text>
  <path class="line" d="M545 206 V278" marker-end="url(#arrow)"/>
  <path class="dashed" d="M650 302 H678" marker-end="url(#arrowbad)"/>
  <text class="label bad" x="664" y="292" text-anchor="middle">no</text>
  <path class="okline" d="M440 302 H342" marker-end="url(#arrowok)"/>
  <text class="label good" x="391" y="292" text-anchor="middle">yes</text>
  <rect class="box" x="30" y="40" width="200" height="48" rx="8"/>
  <text x="130" y="69" text-anchor="middle">pod with <tspan class="code">appArmorProfile</tspan></text>
  <rect class="box" x="270" y="40" width="130" height="48" rx="8"/>
  <text x="335" y="69" text-anchor="middle">kubelet</text>
  <rect class="ask" x="440" y="40" width="210" height="48" rx="8"/>
  <text x="545" y="69" text-anchor="middle">AppArmor on the node?</text>
  <rect class="drop" x="680" y="40" width="170" height="48" rx="8"/>
  <text x="765" y="69" text-anchor="middle">pod rejected</text>
  <rect class="box" x="440" y="158" width="210" height="48" rx="8"/>
  <text x="545" y="187" text-anchor="middle"><tspan class="code">containerd</tspan></text>
  <rect class="ask" x="440" y="278" width="210" height="48" rx="8"/>
  <text x="545" y="307" text-anchor="middle">profile loaded?</text>
  <rect class="drop" x="680" y="278" width="170" height="48" rx="8"/>
  <text x="765" y="307" text-anchor="middle"><tspan class="code">CreateContainerError</tspan></text>
  <rect class="ok" x="60" y="278" width="280" height="48" rx="8"/>
  <text x="200" y="307" text-anchor="middle">container runs under the profile</text>
</svg>
