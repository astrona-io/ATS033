<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="700" height="360" role="img" aria-labelledby="title desc">
  <title id="title">Writing a profile in complain mode</title>
  <desc id="desc">Write the profile, load it in complain mode, run the workload and read the log. When the log shows needed access, add an allow rule and load the profile again. When it does not, load the profile in enforce mode.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="line" d="M180 64 H218" marker-end="url(#arrow)"/>
  <path class="line" d="M420 64 H458" marker-end="url(#arrow)"/>
  <path class="line" d="M565 88 V168" marker-end="url(#arrow)"/>
  <path class="line" d="M460 192 H422" marker-end="url(#arrow)"/>
  <text class="label" x="441" y="182" text-anchor="middle">yes</text>
  <path class="line" d="M320 168 V90" marker-end="url(#arrow)"/>
  <path class="okline" d="M565 216 V286" marker-end="url(#arrowok)"/>
  <text class="label" x="578" y="256" text-anchor="start">no</text>
  <rect class="box" x="30" y="40" width="150" height="48" rx="8"/>
  <text x="105" y="69" text-anchor="middle">write profile</text>
  <rect class="box" x="220" y="40" width="200" height="48" rx="8"/>
  <text x="320" y="69" text-anchor="middle">load in complain mode</text>
  <rect class="box" x="460" y="40" width="210" height="48" rx="8"/>
  <text x="565" y="69" text-anchor="middle">run workload, read log</text>
  <rect class="ask" x="460" y="168" width="210" height="48" rx="8"/>
  <text x="565" y="197" text-anchor="middle">needed access in log?</text>
  <rect class="box" x="220" y="168" width="200" height="48" rx="8"/>
  <text x="320" y="197" text-anchor="middle">add an allow rule</text>
  <rect class="ok" x="460" y="288" width="210" height="48" rx="8"/>
  <text x="565" y="317" text-anchor="middle">load in enforce mode</text>
</svg>
