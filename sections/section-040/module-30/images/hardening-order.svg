<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 250" width="850" height="250" role="img" aria-labelledby="title desc">
  <title id="title">The order of hardening a container</title>
  <desc id="desc">If privileged is true, the container gets all capabilities, the devices of the node and no profile. If privileged is false, it starts from the default capability set. Then drop ALL, add only the needed capability, and set allowPrivilegeEscalation to false.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="line" d="M190 64 H238" marker-end="url(#arrow)"/>
  <path class="dashed" d="M390 64 H448" marker-end="url(#arrowbad)"/>
  <text class="label bad" x="419" y="54" text-anchor="middle">true</text>
  <path class="okline" d="M315 88 V125 H105 V178" marker-end="url(#arrowok)"/>
  <text class="label good" x="325" y="112" text-anchor="start">false</text>
  <path class="line" d="M190 202 H218" marker-end="url(#arrow)"/>
  <path class="line" d="M340 202 H368" marker-end="url(#arrow)"/>
  <path class="line" d="M560 202 H588" marker-end="url(#arrow)"/>
  <rect class="box" x="20" y="40" width="170" height="48" rx="8"/>
  <text x="105" y="69" text-anchor="middle">container process</text>
  <rect class="ask" x="240" y="40" width="150" height="48" rx="8"/>
  <text x="315" y="69" text-anchor="middle"><tspan class="code">privileged</tspan>?</text>
  <rect class="drop" x="450" y="40" width="380" height="48" rx="8"/>
  <text x="640" y="69" text-anchor="middle">all capabilities, node devices, no profile</text>
  <rect class="box" x="20" y="178" width="170" height="48" rx="8"/>
  <text x="105" y="207" text-anchor="middle">default capability set</text>
  <rect class="box" x="220" y="178" width="120" height="48" rx="8"/>
  <text x="280" y="207" text-anchor="middle">drop <tspan class="code">ALL</tspan></text>
  <rect class="box" x="370" y="178" width="190" height="48" rx="8"/>
  <text x="465" y="207" text-anchor="middle">add only the needed one</text>
  <rect class="ok" x="590" y="178" width="250" height="48" rx="8"/>
  <text x="715" y="207" text-anchor="middle"><tspan class="code" style="font-size:12px">allowPrivilegeEscalation: false</tspan></text>
</svg>
