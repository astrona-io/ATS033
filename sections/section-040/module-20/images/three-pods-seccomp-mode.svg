<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 270" width="840" height="270" role="img" aria-labelledby="title desc">
  <title id="title">Seccomp mode of the three test pods</title>
  <desc id="desc">The pod seccomp-runtime sets RuntimeDefault and reports Seccomp 2. The pod seccomp-unset sets no profile and reports 0 or 2, depending on seccompDefault on the node. The pod seccomp-privileged runs with privileged true and reports Seccomp 0.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>
  <rect class="frame" x="20" y="20" width="800" height="230" rx="10"/>
  <text class="label" x="36" y="44">node</text>
  <path class="line" d="M155 104 V128" marker-end="url(#arrow)"/>
  <path class="line" d="M425 104 V128" marker-end="url(#arrow)"/>
  <path class="line" d="M695 104 V128" marker-end="url(#arrow)"/>
  <rect class="box" x="40" y="60" width="230" height="44" rx="8"/>
  <text class="code" x="155" y="87" text-anchor="middle">seccomp-runtime</text>
  <rect class="ok" x="40" y="130" width="230" height="44" rx="8"/>
  <text class="code" x="155" y="157" text-anchor="middle">Seccomp: 2</text>
  <text class="code" x="155" y="204" text-anchor="middle">type: RuntimeDefault</text>
  <text class="label good" x="155" y="226" text-anchor="middle">runtime filter installed</text>
  <rect class="box" x="310" y="60" width="230" height="44" rx="8"/>
  <text class="code" x="425" y="87" text-anchor="middle">seccomp-unset</text>
  <rect class="ask" x="310" y="130" width="230" height="44" rx="8"/>
  <text class="code" x="425" y="157" text-anchor="middle">Seccomp: 0 or 2</text>
  <text class="code" x="425" y="204" text-anchor="middle">no seccompProfile</text>
  <text class="label" x="425" y="226" text-anchor="middle">follows seccompDefault</text>
  <rect class="box" x="580" y="60" width="230" height="44" rx="8"/>
  <text class="code" x="695" y="87" text-anchor="middle">seccomp-privileged</text>
  <rect class="drop" x="580" y="130" width="230" height="44" rx="8"/>
  <text class="code" x="695" y="157" text-anchor="middle">Seccomp: 0</text>
  <text class="code" x="695" y="204" text-anchor="middle">privileged: true</text>
  <text class="label bad" x="695" y="226" text-anchor="middle">runs without a filter</text>
</svg>
