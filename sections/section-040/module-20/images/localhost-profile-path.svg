<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 280" width="840" height="280" role="img" aria-labelledby="title desc">
  <title id="title">How a localhostProfile value maps to a file</title>
  <desc id="desc">The file /var/lib/kubelet/seccomp/profiles/audit.json splits into the kubelet seccomp directory, which the kubelet adds, and the value profiles/audit.json, which the pod writes in localhostProfile. A value with a leading slash is an absolute path and is not accepted.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>
  <text class="strong" x="40" y="36">Full path of the file on the node</text>
  <rect class="box" x="40" y="52" width="240" height="44" rx="0"/>
  <text class="code" x="160" y="79" text-anchor="middle">/var/lib/kubelet/seccomp/</text>
  <rect class="ok" x="280" y="52" width="220" height="44" rx="0"/>
  <text class="code" x="390" y="79" text-anchor="middle">profiles/audit.json</text>
  <text class="label" x="160" y="122" text-anchor="middle">kubelet seccomp directory</text>
  <text class="label" x="160" y="140" text-anchor="middle">added by the kubelet</text>
  <text class="label good" x="390" y="122" text-anchor="middle">localhostProfile value</text>
  <text class="label good" x="390" y="140" text-anchor="middle">written in the pod</text>
  <text x="560" y="66">In the pod specification:</text>
  <text class="code" x="560" y="88">localhostProfile:</text>
  <text class="code" x="576" y="108">profiles/audit.json</text>
  <line class="sep" x1="30" y1="166" x2="810" y2="166"/>
  <text class="strong bad" x="40" y="196">Not accepted</text>
  <rect class="drop" x="40" y="212" width="380" height="44" rx="8"/>
  <text class="code" x="230" y="239" text-anchor="middle">/var/lib/kubelet/seccomp/profiles/audit.json</text>
  <text x="450" y="230">A leading slash makes it an absolute path.</text>
  <text x="450" y="250">The kubelet does not accept it as a profile name.</text>
</svg>
