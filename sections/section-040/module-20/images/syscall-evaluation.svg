<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 390" width="840" height="390" role="img" aria-labelledby="title desc">
  <title id="title">How a seccomp profile decides one syscall</title>
  <desc id="desc">For each syscall, the kernel checks whether a rule names it. If yes, the action of that rule applies. If no, defaultAction applies. The action is SCMP_ACT_ALLOW, SCMP_ACT_ERRNO, SCMP_ACT_LOG or SCMP_ACT_KILL_PROCESS.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>
  <path class="line" d="M420 76 V108" marker-end="url(#arrow)"/>
  <path class="line" d="M380 156 L242 198" marker-end="url(#arrow)"/>
  <text class="label" x="300" y="168" text-anchor="end">yes</text>
  <path class="line" d="M460 156 L598 198" marker-end="url(#arrow)"/>
  <text class="label" x="540" y="168">no</text>
  <path class="line" d="M240 246 V280"/>
  <path class="line" d="M600 246 V280"/>
  <path class="line" d="M165 280 H695"/>
  <path class="line" d="M165 280 V298" marker-end="url(#arrow)"/>
  <path class="line" d="M335 280 V298" marker-end="url(#arrow)"/>
  <path class="line" d="M505 280 V298" marker-end="url(#arrow)"/>
  <path class="line" d="M695 280 V298" marker-end="url(#arrow)"/>
  <rect class="box" x="320" y="30" width="200" height="46" rx="8"/>
  <text x="420" y="58" text-anchor="middle">Syscall from the process</text>
  <rect class="ask" x="310" y="110" width="220" height="46" rx="8"/>
  <text x="420" y="138" text-anchor="middle">Does a rule name it?</text>
  <rect class="box" x="140" y="200" width="200" height="46" rx="8"/>
  <text x="240" y="228" text-anchor="middle">action of that rule</text>
  <rect class="box" x="500" y="200" width="200" height="46" rx="8"/>
  <text class="code" x="600" y="228" text-anchor="middle">defaultAction</text>
  <rect class="ok" x="90" y="300" width="150" height="44" rx="8"/>
  <text class="code" x="165" y="327" text-anchor="middle">SCMP_ACT_ALLOW</text>
  <rect class="drop" x="260" y="300" width="150" height="44" rx="8"/>
  <text class="code" x="335" y="327" text-anchor="middle">SCMP_ACT_ERRNO</text>
  <rect class="ask" x="430" y="300" width="150" height="44" rx="8"/>
  <text class="code" x="505" y="327" text-anchor="middle">SCMP_ACT_LOG</text>
  <rect class="drop" x="600" y="300" width="190" height="44" rx="8"/>
  <text class="code" x="695" y="327" text-anchor="middle">SCMP_ACT_KILL_PROCESS</text>
  <text class="label" x="165" y="370" text-anchor="middle">runs</text>
  <text class="label" x="335" y="370" text-anchor="middle">returns an error</text>
  <text class="label" x="505" y="370" text-anchor="middle">runs and is logged</text>
  <text class="label" x="695" y="370" text-anchor="middle">process is killed</text>
</svg>
