<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" width="860" height="280" role="img" aria-labelledby="title desc">
  <title id="title">Where a seccomp profile can fail</title>
  <desc id="desc">The kubelet finds the profile file, runc loads the filter, the application starts and the kernel checks its calls. A missing file, a wrong name or invalid JSON stops the container before it starts. A profile that loads can still block a call later, which fails with Operation not permitted while the pod keeps running.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>
  <path class="okline" d="M200 85 H238" marker-end="url(#arrowok)"/>
  <path class="okline" d="M410 85 H448" marker-end="url(#arrowok)"/>
  <path class="okline" d="M620 85 H658" marker-end="url(#arrowok)"/>
  <path class="dashed" d="M115 110 V168" marker-end="url(#arrowbad)"/>
  <path class="dashed" d="M745 110 V168" marker-end="url(#arrowbad)"/>
  <rect class="box" x="30" y="60" width="170" height="50" rx="8"/>
  <text x="115" y="90" text-anchor="middle">kubelet finds file</text>
  <rect class="box" x="240" y="60" width="170" height="50" rx="8"/>
  <text x="325" y="90" text-anchor="middle">runc loads filter</text>
  <rect class="box" x="450" y="60" width="170" height="50" rx="8"/>
  <text x="535" y="90" text-anchor="middle">application starts</text>
  <rect class="box" x="660" y="60" width="170" height="50" rx="8"/>
  <text x="745" y="90" text-anchor="middle">kernel checks calls</text>
  <rect class="drop" x="30" y="170" width="390" height="84" rx="8"/>
  <text class="strong" x="225" y="197" text-anchor="middle">Failure before start</text>
  <text x="225" y="217" text-anchor="middle">missing file, wrong name or invalid JSON</text>
  <text x="225" y="237" text-anchor="middle">pod stays in <tspan class="code">CreateContainerError</tspan></text>
  <rect class="drop" x="440" y="170" width="390" height="84" rx="8"/>
  <text class="strong" x="635" y="197" text-anchor="middle">Failure after start</text>
  <text x="635" y="217" text-anchor="middle">the filter blocks a call that is needed</text>
  <text x="635" y="237" text-anchor="middle">Operation not permitted, pod Running</text>
</svg>
