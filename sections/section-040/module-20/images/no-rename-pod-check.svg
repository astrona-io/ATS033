<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 290" width="840" height="290" role="img" aria-labelledby="title desc">
  <title id="title">Copy and move inside the no-rename pod</title>
  <desc id="desc">Inside the no-rename pod, cp uses syscalls that the filter allows, so the copy succeeds. mv makes a rename syscall that the filter blocks, so it fails with Operation not permitted. The pod stays Running.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>
  <rect class="frame" x="20" y="30" width="300" height="200" rx="10"/>
  <text class="label" x="36" y="54">pod no-rename</text>
  <path class="okline" d="M300 92 H438" marker-end="url(#arrowok)"/>
  <text class="label good" x="370" y="84" text-anchor="middle">allowed calls</text>
  <path class="dashed" d="M300 182 H438" marker-end="url(#arrowbad)"/>
  <text class="label bad" x="370" y="174" text-anchor="middle">rename call</text>
  <path class="okline" d="M590 92 H628" marker-end="url(#arrowok)"/>
  <path class="dashed" d="M590 182 H628" marker-end="url(#arrowbad)"/>
  <rect class="box" x="40" y="70" width="260" height="44" rx="8"/>
  <text class="code" x="170" y="97" text-anchor="middle">cp /tmp/a /tmp/b</text>
  <rect class="box" x="40" y="160" width="260" height="44" rx="8"/>
  <text class="code" x="170" y="187" text-anchor="middle">mv /tmp/a /tmp/c</text>
  <rect class="policy" x="440" y="60" width="150" height="154" rx="8"/>
  <text x="515" y="132" text-anchor="middle">seccomp filter</text>
  <text class="code" x="515" y="152" text-anchor="middle">block-rename.json</text>
  <rect class="ok" x="630" y="70" width="190" height="44" rx="8"/>
  <text x="725" y="97" text-anchor="middle">copy succeeds</text>
  <rect class="drop" x="630" y="160" width="190" height="44" rx="8"/>
  <text x="725" y="187" text-anchor="middle">Operation not permitted</text>
  <text x="40" y="270">The pod stays Running: SCMP_ACT_ERRNO returns EPERM and does not kill the process.</text>
</svg>
