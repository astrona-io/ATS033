apiVersion: v1
kind: Namespace
metadata:
  name: starfleet-033-040-03-02
---
apiVersion: v1
kind: Pod
metadata:
  name: bridge
  namespace: starfleet-033-040-03-02
spec:
  restartPolicy: Always
  securityContext:
    appArmorProfile:
      type: Localhost
      localhostProfile: k8s-deny-tmp-write
  containers:
  - name: console
    image: docker.io/library/busybox:1.37.0
    command:
    - sh
    - -c
    - while true; do date > /tmp/console.log || exit 1; sleep 5; done
    readinessProbe:
      exec:
        command:
        - cat
        - /tmp/console.log
      periodSeconds: 5
  - name: logger
    image: docker.io/library/busybox:1.37.0
    command:
    - sh
    - -c
    - sleep 3600
