apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay
  namespace: starfleet-033-040-03-03
spec:
  replicas: 1
  selector:
    matchLabels:
      app: relay
  template:
    metadata:
      labels:
        app: relay
    spec:
      containers:
      - name: relay
        image: docker.io/library/busybox:1.37.0
        command:
        - sh
        - -c
        - mkdir -p /www && echo relay-ok > /www/index.html && httpd -f -p 80 -h /www
        ports:
        - name: http
          containerPort: 80
        readinessProbe:
          tcpSocket:
            port: http
          periodSeconds: 5
        securityContext:
          privileged: false
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - NET_BIND_SERVICE
