apiVersion: astrona.io/v1
metadata:
  name: ats-033-playground-040-03
  docs:
    guide: docs/overview.md
# AppArmor profiles live in the kernel of the node. A kind node uses the
# kernel of the machine that runs Podman, which often has no AppArmor, so the
# playground runs a real one-node kubeadm cluster in a VM with AppArmor on.
runtime:
  type: qemu
  qemu:
  - image:
      type: oci
      source: ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-cks
    cpus: 2
    memoryMB: 4096
    diskSizeGB: 25
    display: false
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
