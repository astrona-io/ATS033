# Module quiz for section 040, module 02. Contract:
# schemas/question-bank.schema.json. Keep question ids stable once published.
schema_version: 1
kind: question_bank
id: ats033-040-02
course_id: ATS033
exam_code: CKS
status: alpha
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: module
  id: section-040/module-02
  title: Apply seccomp Profiles To Pods
placement:
  position: after
  reading: sections/section-040/module-02/course-04-summary.md
questions:
  - id: ats033-040-02-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Predict the seccomp profile of a pod that sets no seccompProfile."
    source_readings:
      - sections/section-040/module-02/course-01-profile-types-locations-and-the-unconfined-risk.md
    prompt: "A pod sets no `seccompProfile` at pod level or container level. The kubelet on its node has no `seccompDefault` setting. Which filter does the container process get?"
    options:
      - id: a
        text: "`RuntimeDefault`, because Kubernetes always adds it to a pod without a profile."
        explanation: "Kubernetes adds `RuntimeDefault` only when the kubelet runs with `seccompDefault: true`."
      - id: b
        text: "The `restricted` Pod Security profile."
        explanation: "Pod Security levels check a pod at admission. They do not install a seccomp filter."
      - id: c
        text: "No filter, so the process runs as `Unconfined`."
        explanation: "Correct. Without `seccompDefault: true`, the kubelet applies no default and the pod runs unfiltered."
      - id: d
        text: "The last `Localhost` profile that was copied to the node."
        explanation: "A `Localhost` profile applies only when a pod names it in `localhostProfile`."
    correct_option: c
    explanation: "The kubelet picks the container value first, then the pod value, then the node default. The node default is `RuntimeDefault` only with `seccompDefault: true`, otherwise `Unconfined`."

  - id: ats033-040-02-q02
    type: single_choice
    difficulty: intermediate
    learning_objective: "Write the localhostProfile value for a profile file on the node."
    source_readings:
      - sections/section-040/module-02/course-01-profile-types-locations-and-the-unconfined-risk.md
      - sections/section-040/module-02/course-02-write-and-load-a-localhost-profile.md
    prompt: "You copied a profile to `/var/lib/kubelet/seccomp/profiles/audit.json` on every node. The kubelet uses its default root directory. Which value goes in `localhostProfile`?"
    options:
      - id: a
        text: "`/var/lib/kubelet/seccomp/profiles/audit.json`"
        explanation: "A value with a leading slash is an absolute path, and the kubelet does not accept it as a profile name."
      - id: b
        text: "`audit`"
        explanation: "The value is a relative file path with its directory and file name, not a short name."
      - id: c
        text: "`seccomp/profiles/audit.json`"
        explanation: "The path is relative to `/var/lib/kubelet/seccomp`, so `seccomp/` must not be part of it."
      - id: d
        text: "`profiles/audit.json`"
        explanation: "Correct. The value is the part of the path after the kubelet seccomp directory."
    correct_option: d
    explanation: "A `localhostProfile` value is always relative to the kubelet seccomp directory, which is `/var/lib/kubelet/seccomp` by default."

  - id: ats033-040-02-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: "Resolve the seccomp profile when pod and container values differ."
    source_readings:
      - sections/section-040/module-02/course-01-profile-types-locations-and-the-unconfined-risk.md
    prompt: "A pod sets `seccompProfile.type: RuntimeDefault` in its pod `securityContext`. One of its two containers sets `seccompProfile.type: Unconfined` in its own `securityContext`. What does that container get?"
    options:
      - id: a
        text: "No filter, because the container value replaces the pod value for that container."
        explanation: "Correct. The kubelet uses the container value first, so this container runs unfiltered."
      - id: b
        text: "The runtime default filter, because the pod value is stricter and always wins."
        explanation: "The pod value applies only to containers that set no value of their own."
      - id: c
        text: "Both filters, stacked on top of each other."
        explanation: "The kubelet resolves one value for each container. It does not combine the pod and container values."
      - id: d
        text: "Nothing, because the API server rejects the pod for the conflict."
        explanation: "A container override is a normal use of the field, and the pod is accepted."
    correct_option: a
    explanation: "The kubelet checks the container `securityContext` first, the pod `securityContext` second and the node default last."

  - id: ats033-040-02-q04
    type: single_choice
    difficulty: beginner
    learning_objective: "Interpret the Seccomp line in /proc/1/status."
    source_readings:
      - sections/section-040/module-02/course-01-profile-types-locations-and-the-unconfined-risk.md
    prompt: "You run `kubectl exec` on a pod with `privileged: true` and read `grep Seccomp: /proc/1/status`. Which value do you expect, and why?"
    options:
      - id: a
        text: "`Seccomp: 2`, because every container gets the runtime default filter."
        explanation: "The runtime does not apply the default profile to a privileged container."
      - id: b
        text: "`Seccomp: 0`, because a privileged container runs without a seccomp filter."
        explanation: "Correct. `0` means no filter, and a privileged container runs unfiltered."
      - id: c
        text: "`Seccomp: 1`, because privileged containers use strict mode."
        explanation: "`1` is the old strict mode, which Kubernetes does not use for privileged containers."
      - id: d
        text: "The line is missing, because privileged containers hide `/proc`."
        explanation: "A privileged container can still read its own `/proc/1/status`, and the line shows the seccomp mode of the process."
    correct_option: b
    explanation: "In `/proc/1/status`, `Seccomp: 0` means no filter, `1` means strict mode and `2` means a filter is installed."

  - id: ats033-040-02-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Identify which seccomp types the Pod Security levels accept."
    source_readings:
      - sections/section-040/module-02/course-01-profile-types-locations-and-the-unconfined-risk.md
    prompt: "A namespace enforces the `restricted` Pod Security level. Which `seccompProfile` types does a pod in it pass with?"
    options:
      - id: a
        text: "Only `Unconfined`"
        explanation: "Even the `baseline` level rejects an explicit `Unconfined` profile."
      - id: b
        text: "Any type, because Pod Security does not check seccomp"
        explanation: "Pod Security Admission does check the seccomp profile type."
      - id: c
        text: "`RuntimeDefault` or `Localhost`"
        explanation: "Correct. These two types install a filter, and `restricted` accepts only them."
      - id: d
        text: "Only `Localhost`"
        explanation: "`RuntimeDefault` is also accepted, and it is the usual starting point."
    correct_option: c
    explanation: "The `baseline` level rejects an explicit `Unconfined` profile. The `restricted` level accepts only `RuntimeDefault` or `Localhost`."

  - id: ats033-040-02-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain why a deny rule must name every variant of a syscall."
    source_readings:
      - sections/section-040/module-02/course-02-write-and-load-a-localhost-profile.md
    prompt: "A deny-list profile must stop a container from renaming files. The author's rule names only `rename`. Why is this rule weak?"
    options:
      - id: a
        text: "`rename` is not a real syscall, so the rule is ignored."
        explanation: "`rename` is a real syscall, and the rule does block it. The weakness is the other calls that do the same job."
      - id: b
        text: "A deny list cannot block file operations."
        explanation: "A deny list can block any syscall that it names."
      - id: c
        text: "The rule needs `SCMP_ACT_KILL_PROCESS` to work."
        explanation: "`SCMP_ACT_ERRNO` blocks the call and is the usual choice. The action is not the problem."
      - id: d
        text: "A program can use `renameat` or `renameat2` for the same job, and those calls stay allowed."
        explanation: "Correct. List `rename`, `renameat` and `renameat2` so the block does not depend on which call the program uses."
    correct_option: d
    explanation: "Kernels and architectures provide several syscalls for one operation, and a deny list blocks only the names it lists."

  - id: ats033-040-02-q07
    type: single_choice
    difficulty: advanced
    learning_objective: "Predict the effect of an incomplete allow-list profile."
    source_readings:
      - sections/section-040/module-02/course-02-write-and-load-a-localhost-profile.md
    prompt: "An author writes a profile with `defaultAction: SCMP_ACT_ERRNO` and one rule that allows only `read` and `write`. A pod uses it. What is the most likely result?"
    options:
      - id: a
        text: "The container fails, because the runtime and the program need many more syscalls to start."
        explanation: "Correct. Even a small program needs dozens of syscalls, and all others return an error."
      - id: b
        text: "The container runs normally, because unlisted syscalls are allowed."
        explanation: "With `defaultAction: SCMP_ACT_ERRNO`, every syscall that no rule names returns an error."
      - id: c
        text: "The kubelet rejects the profile, because an allow list is not valid JSON."
        explanation: "The profile is valid. It fails when the process runs, not when the file is read."
      - id: d
        text: "The kernel logs each blocked call and then allows it."
        explanation: "That is the behaviour of `SCMP_ACT_LOG`, not `SCMP_ACT_ERRNO`."
    correct_option: a
    explanation: "An allow list is the strongest form, but a list that misses one needed syscall makes the container fail at start or later on a rare code path."

  - id: ats033-040-02-q08
    type: single_choice
    difficulty: beginner
    learning_objective: "Describe the result of an SCMP_ACT_ERRNO rule."
    source_readings:
      - sections/section-040/module-02/course-02-write-and-load-a-localhost-profile.md
    prompt: "A rule uses `action: SCMP_ACT_ERRNO` and sets no `errnoRet`. The process calls one of the named syscalls. What happens?"
    options:
      - id: a
        text: "The kernel ends the whole process."
        explanation: "That is `SCMP_ACT_KILL_PROCESS`. With `SCMP_ACT_ERRNO` the process continues."
      - id: b
        text: "The syscall does not run and returns `EPERM`, shown as `Operation not permitted`, and the process continues."
        explanation: "Correct. `EPERM` is error number 1, the default when `errnoRet` is not set."
      - id: c
        text: "The syscall runs and the kernel writes a log record."
        explanation: "That is `SCMP_ACT_LOG`, which does not block the call."
      - id: d
        text: "The container restarts with the runtime default profile."
        explanation: "A seccomp rule never swaps the profile. The filter stays for the life of the process."
    correct_option: b
    explanation: "`SCMP_ACT_ERRNO` is the usual choice because an application can handle an error, while a killed process is hard to debug."

  - id: ats033-040-02-q09
    type: single_choice
    difficulty: intermediate
    learning_objective: "Repair a pod that cannot start because of a wrong profile name."
    source_readings:
      - sections/section-040/module-02/course-03-find-blocked-syscalls-and-fix-failures.md
    prompt: "A running pod is stuck in `CreateContainerError`. Its events name `profiles/block-renam.json`, but the node has `profiles/block-rename.json`. Which repair keeps the protection?"
    options:
      - id: a
        text: "Set `seccompProfile.type: Unconfined` with `kubectl edit`."
        explanation: "This removes the filter for every syscall, and the security context of a pod cannot be changed in place."
      - id: b
        text: "Restart the kubelet so it finds the file."
        explanation: "The kubelet resolves the exact name it is given. A restart does not fix a typo."
      - id: c
        text: "Correct the name in the pod specification, delete the failed pod and create it again."
        explanation: "Correct. The fix narrows nothing and removes nothing. It only delivers the right file to the runtime."
      - id: d
        text: "Change `defaultAction` in the file on the node to `SCMP_ACT_ALLOW`."
        explanation: "The kubelet never reads that file, because the pod names a different file."
    correct_option: c
    explanation: "A container that never started has a delivery problem: a wrong name, a missing copy or invalid JSON. Fix the name or the file, then recreate the pod."

  - id: ats033-040-02-q10
    type: single_choice
    difficulty: advanced
    learning_objective: "Evaluate the use of SCMP_ACT_LOG as a default action."
    source_readings:
      - sections/section-040/module-02/course-03-find-blocked-syscalls-and-fix-failures.md
    prompt: "A team used a profile with only `{\"defaultAction\": \"SCMP_ACT_LOG\"}` to study an application. They now want to keep it in production because \"it records everything\". What is the problem?"
    options:
      - id: a
        text: "The kubelet rejects a profile that has no `syscalls` list."
        explanation: "The profile is valid without a `syscalls` list. The default action then applies to every call."
      - id: b
        text: "The kernel blocks every call that it logs."
        explanation: "`SCMP_ACT_LOG` lets the call run and only logs it."
      - id: c
        text: "The profile works only on the control-plane node."
        explanation: "A profile works on any node that has the file. The node role is not the problem."
      - id: d
        text: "It allows every syscall, so it protects nothing. Turn the recorded names into an allow list instead."
        explanation: "Correct. The next step is an `SCMP_ACT_ALLOW` list with `defaultAction: SCMP_ACT_ERRNO`."
    correct_option: d
    explanation: "A log-only profile is a tool for investigation. It shows which syscalls the application makes, but it blocks none of them."

  - id: ats033-040-02-q11
    type: single_choice
    difficulty: advanced
    learning_objective: "Choose the smallest repair when one job needs a blocked syscall."
    source_readings:
      - sections/section-040/module-02/course-03-find-blocked-syscalls-and-fix-failures.md
    prompt: "A workload runs under a profile that blocks `rename`, `renameat` and `renameat2`. A maintenance job that runs once a week must rename files. The main workload never does. What is the best change?"
    options:
      - id: a
        text: "Run the maintenance job in a second pod with its own profile that allows rename, and keep the strict profile on the main workload."
        explanation: "Correct. Only the job that needs rename gets it."
      - id: b
        text: "Set the main workload to `Unconfined`."
        explanation: "This opens every syscall for the main workload, which never needed rename."
      - id: c
        text: "Remove the three names from the rule of the main workload."
        explanation: "That is right only if the pod needs rename for its whole life, which this workload does not."
      - id: d
        text: "Set `privileged: true` on the main workload."
        explanation: "A privileged container runs without a seccomp filter, so this removes the protection for every syscall."
    correct_option: a
    explanation: "The right repair is the smallest change that fixes the need. A separate pod keeps the stricter profile on the main workload."

  - id: ats033-040-02-q12
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain the limit of an allow list built from a syscall trace."
    source_readings:
      - sections/section-040/module-02/course-03-find-blocked-syscalls-and-fix-failures.md
    prompt: "You build an allow list from the output of `strace -f -c` during a two-minute test. Which risk remains?"
    options:
      - id: a
        text: "`strace` changes the syscalls that the program uses in production."
        explanation: "The trace counts the calls of the run. The risk is what the run did not do."
      - id: b
        text: "Code paths that the test never ran use syscalls that the allow list then blocks."
        explanation: "Correct. The list is a record of one run, not a proof of everything the program may need."
      - id: c
        text: "`strace` output cannot be used for seccomp profiles."
        explanation: "The syscall names that `strace` prints are the names an allow list uses."
      - id: d
        text: "The profile will allow syscalls that the test did not call."
        explanation: "An allow list with `defaultAction: SCMP_ACT_ERRNO` blocks everything it does not name."
    correct_option: b
    explanation: "Use real traffic and all code paths when you trace, because a path that the trace never touched stays blocked by an allow list."
