apiVersion: v1
kind: Pod
metadata:
  name: no-delete
  namespace: starfleet-033-040-02-01
spec:
  restartPolicy: Never
  securityContext:
    seccompProfile:
      type: Localhost
      localhostProfile: profiles/block-delete.json
  containers:
  - name: shell
    image: docker.io/library/busybox:1.37.0
    command:
    - sh
    - -c
    - sleep 3600
