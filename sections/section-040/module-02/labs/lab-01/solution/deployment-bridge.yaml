apiVersion: apps/v1
kind: Deployment
metadata:
  name: bridge
  namespace: starfleet-033-040-02-01
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bridge
  template:
    metadata:
      labels:
        app: bridge
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: bridge
        image: docker.io/library/busybox:1.37.0
        command:
        - sh
        - -c
        - sleep 3600
