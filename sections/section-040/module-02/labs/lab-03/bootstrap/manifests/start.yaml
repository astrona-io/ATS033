apiVersion: v1
kind: Namespace
metadata:
  name: starfleet-033-040-02-03
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shuttle
  namespace: starfleet-033-040-02-03
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shuttle
  template:
    metadata:
      labels:
        app: shuttle
    spec:
      securityContext:
        seccompProfile:
          type: Localhost
          localhostProfile: profiles/cargo-guard.json
      containers:
      - name: shuttle
        image: docker.io/library/busybox:1.37.0
        command:
        - sh
        - -c
        - while true; do date > /tmp/manifest.new && mv /tmp/manifest.new /tmp/manifest || exit 1; sleep 5; done
        readinessProbe:
          exec:
            command:
            - cat
            - /tmp/manifest
          periodSeconds: 5
