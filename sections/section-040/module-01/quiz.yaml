# Knowledge check for section 040, module 01. Contract:
# schemas/question-bank.schema.json. Keep question ids stable once published.
schema_version: 1
kind: question_bank
id: ats033-040-01
course_id: ATS033
exam_code: CKS
status: draft
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: module
  id: section-040/module-01
  title: Kernel Hardening With seccomp And AppArmor
questions:
  - id: ats033-040-01-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Explain what seccomp filters."
    source_readings:
      - sections/section-040/module-01/course-01-seccomp-filtering-system-calls.md
    prompt: "What does a seccomp profile restrict?"
    options:
      - id: a
        text: "The system calls a process can make."
        explanation: "Correct."
      - id: b
        text: "The files a process can open, by path."
        explanation: "Path-based rules belong to AppArmor."
      - id: c
        text: "The CPU and memory a container may use."
        explanation: "That is the job of cgroup limits."
      - id: d
        text: "The images a node may pull."
        explanation: "Admission and registry policy control images."
    correct_option: a
    explanation: "Seccomp decides on the syscall and its numeric arguments, not on paths."

  - id: ats033-040-01-q02
    type: single_choice
    difficulty: beginner
    learning_objective: "Read the Seccomp line of /proc/PID/status."
    source_readings:
      - sections/section-040/module-01/course-01-seccomp-filtering-system-calls.md
    prompt: "Inside a container, `grep Seccomp /proc/1/status` prints `Seccomp: 2`. What does this show?"
    options:
      - id: a
        text: "A seccomp filter is installed for the process."
        explanation: "Correct."
      - id: b
        text: "Seccomp is disabled."
        explanation: "Disabled is shown as 0."
      - id: c
        text: "The container runs two profiles."
        explanation: "The number is a mode, not a count."
      - id: d
        text: "The process runs with AppArmor in enforce mode."
        explanation: "AppArmor is reported elsewhere, in /proc/PID/attr/current."
    correct_option: a
    explanation: "Mode 2 means filter mode. Mode 0 means no filter."

  - id: ats033-040-01-q03
    type: single_choice
    difficulty: beginner
    learning_objective: "Choose the safe default seccomp profile."
    source_readings:
      - sections/section-040/module-01/course-01-seccomp-filtering-system-calls.md
    prompt: "Which `seccompProfile` type should most workloads use when they have no special syscall needs?"
    options:
      - id: a
        text: "`Unconfined`"
        explanation: "It installs no filter."
      - id: b
        text: "`RuntimeDefault`"
        explanation: "Correct. It uses the default filter of the container runtime."
      - id: c
        text: "`Localhost` with an empty file"
        explanation: "An empty or missing file is an error, not a safe default."
      - id: d
        text: "No field, on every Kubernetes version"
        explanation: "Without the field and without kubelet seccompDefault, the pod runs unfiltered."
    correct_option: b
    explanation: "RuntimeDefault blocks risky syscalls and still suits typical applications."

  - id: ats033-040-01-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Write the localhostProfile path correctly."
    source_readings:
      - sections/section-040/module-01/course-01-seccomp-filtering-system-calls.md
    prompt: "A profile file is at `/var/lib/kubelet/seccomp/profiles/audit.json` on the node, and the kubelet uses the default seccomp directory. What is the correct `localhostProfile` value?"
    options:
      - id: a
        text: "`/var/lib/kubelet/seccomp/profiles/audit.json`"
        explanation: "The value is relative, not an absolute path."
      - id: b
        text: "`profiles/audit.json`"
        explanation: "Correct. The path is relative to the kubelet seccomp directory."
      - id: c
        text: "`audit`"
        explanation: "The file name with its directory is needed."
      - id: d
        text: "`/profiles/audit.json`"
        explanation: "A leading slash makes it an absolute path."
    correct_option: b
    explanation: "localhostProfile is resolved under the kubelet seccomp root."

  - id: ats033-040-01-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Contrast AppArmor with seccomp."
    source_readings:
      - sections/section-040/module-01/course-02-apparmor-profiles-for-files-and-capabilities.md
    prompt: "A root process in a container must not write under `/tmp`, although `/tmp` is writable by file mode. Which control fits?"
    options:
      - id: a
        text: "A seccomp profile that blocks `openat`"
        explanation: "That would block all file opening, not one path."
      - id: b
        text: "An AppArmor profile with `deny /tmp/** w,`"
        explanation: "Correct. AppArmor decides by path."
      - id: c
        text: "`runAsNonRoot: true`"
        explanation: "File mode would still allow a normal user to write to /tmp."
      - id: d
        text: "`fsGroup: 1000`"
        explanation: "It sets group ownership of volumes and does not forbid writes."
    correct_option: b
    explanation: "AppArmor is mandatory access control by resource name, and it also binds root."

  - id: ats033-040-01-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Use the current AppArmor field."
    source_readings:
      - sections/section-040/module-01/course-02-apparmor-profiles-for-files-and-capabilities.md
    prompt: "On Kubernetes v1.35, how is an AppArmor profile selected for a container?"
    options:
      - id: a
        text: "With the annotation `container.apparmor.security.beta.kubernetes.io/<name>`."
        explanation: "The annotation is deprecated."
      - id: b
        text: "With `securityContext.appArmorProfile` and a `type`."
        explanation: "Correct."
      - id: c
        text: "With a kubelet flag that applies one profile to all pods."
        explanation: "Profiles are chosen per pod or container."
      - id: d
        text: "With a `NetworkPolicy` that names the profile."
        explanation: "NetworkPolicy has no such field."
    correct_option: b
    explanation: "The field is available since v1.30 and takes RuntimeDefault, Localhost or Unconfined."

  - id: ats033-040-01-q07
    type: single_choice
    difficulty: advanced
    learning_objective: "Know the node prerequisites for AppArmor."
    source_readings:
      - sections/section-040/module-01/course-02-apparmor-profiles-for-files-and-capabilities.md
    prompt: "A pod uses `appArmorProfile` with type `Localhost`. It stays stuck, and the events say that the profile is not loaded on the node. What is the right fix?"
    options:
      - id: a
        text: "Change the type to `Unconfined`."
        explanation: "That removes the protection."
      - id: b
        text: "Load the profile on that node with `apparmor_parser -r` and recreate the pod."
        explanation: "Correct."
      - id: c
        text: "Add `seccompProfile` to the pod."
        explanation: "Seccomp is a separate boundary and does not load AppArmor profiles."
      - id: d
        text: "Add the profile file to the container image."
        explanation: "AppArmor profiles load into the node kernel, not into the image."
    correct_option: b
    explanation: "The profile must be loaded in the kernel of every node that can run the pod."

  - id: ats033-040-01-q08
    type: single_choice
    difficulty: intermediate
    learning_objective: "Combine securityContext fields correctly."
    source_readings:
      - sections/section-040/module-01/course-03-the-restricted-security-context.md
    prompt: "A container has `readOnlyRootFilesystem: true`, runs as user 1000 and must write to `/scratch`, an `emptyDir`. Writes to `/scratch` fail with a permission error. What is the most likely fix?"
    options:
      - id: a
        text: "Set `readOnlyRootFilesystem: false`."
        explanation: "A volume is a separate mount, and the setting does not cause this error."
      - id: b
        text: "Set the pod-level `fsGroup` so that the volume is writable for the process group."
        explanation: "Correct."
      - id: c
        text: "Add the capability `SYS_ADMIN`."
        explanation: "It widens privileges and does not fix ownership."
      - id: d
        text: "Set `seccompProfile` to `Unconfined`."
        explanation: "Seccomp is not involved in file ownership."
    correct_option: b
    explanation: "A new emptyDir belongs to root. fsGroup gives the process group access."

  - id: ats033-040-01-q09
    type: single_choice
    difficulty: advanced
    learning_objective: "Diagnose a pod blocked by a missing seccomp profile."
    source_readings:
      - sections/section-040/module-01/course-04-diagnosing-profile-failures.md
    prompt: "A pod with a `Localhost` seccomp profile shows `CreateContainerError`. Where do you look first, and what do you do?"
    options:
      - id: a
        text: "The pod events from `kubectl describe pod`; copy the correct profile to the node or fix `localhostProfile`."
        explanation: "Correct."
      - id: b
        text: "The application log; the container has already started."
        explanation: "The container never started, so there is no application log."
      - id: c
        text: "The Service endpoints; the selector is wrong."
        explanation: "Services have no effect on container creation."
      - id: d
        text: "The node CPU usage; the node is overloaded."
        explanation: "A profile error gives a clear event message."
    correct_option: a
    explanation: "A missing profile prevents container creation, and the event names the file."

  - id: ats033-040-01-q10
    type: single_choice
    difficulty: advanced
    learning_objective: "Combine Pod Security levels with kernel profiles."
    source_readings:
      - sections/section-040/module-01/course-03-the-restricted-security-context.md
      - sections/section-040/module-01/course-04-diagnosing-profile-failures.md
    prompt: "You plan `pod-security.kubernetes.io/enforce=restricted` for a namespace where existing pods set no seccomp profile. Which approach is safe?"
    options:
      - id: a
        text: "Apply the label at once; running pods are deleted and recreated correctly."
        explanation: "Admission does not delete running pods, and the recreated pods would be rejected."
      - id: b
        text: "Run the label with `--dry-run=server` to list violations, fix the manifests, and then apply the label."
        explanation: "Correct."
      - id: c
        text: "Set every pod to `Unconfined` so that the label passes."
        explanation: "The restricted level rejects Unconfined."
      - id: d
        text: "Use the `warn` mode on the nodes."
        explanation: "The modes are namespace labels, not node settings."
    correct_option: b
    explanation: "A dry run shows the violations first. Pods that violate the level fail when they are next created."
