# Knowledge check for section 040. Contract:
# schemas/question-bank.schema.json. Keep question ids stable once published.
schema_version: 1
kind: question_bank
id: ats033-040-01
course_id: ATS033
exam_code: CKS
status: draft
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: section
  id: section-040
  title: Appropriately use kernel hardening tools such as AppArmor, seccomp
placement:
  position: after
  reading: sections/section-040/module-03/course-04-summary.md
questions:
  - id: ats033-040-01-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Explain what seccomp filters."
    source_readings:
      - sections/section-040/module-01/course-01-seccomp-filtering-system-calls.md
    prompt: "What does a seccomp profile restrict?"
    options:
      - id: a
        text: "The system calls a process can make."
        explanation: "Correct."
      - id: b
        text: "The files a process can open, by path."
        explanation: "Path-based rules belong to AppArmor."
      - id: c
        text: "The CPU and memory a container may use."
        explanation: "That is the job of cgroup limits."
      - id: d
        text: "The images a node may pull."
        explanation: "Admission and registry policy control images."
    correct_option: a
    explanation: "Seccomp decides on the syscall and its numeric arguments, not on paths."

  - id: ats033-040-01-q03
    type: single_choice
    difficulty: beginner
    learning_objective: "Choose the safe default seccomp profile."
    source_readings:
      - sections/section-040/module-01/course-01-seccomp-filtering-system-calls.md
    prompt: "Which `seccompProfile` type should most workloads use when they have no special syscall needs?"
    options:
      - id: a
        text: "`Unconfined`"
        explanation: "It installs no filter."
      - id: b
        text: "`RuntimeDefault`"
        explanation: "Correct. It uses the default filter of the container runtime."
      - id: c
        text: "`Localhost` with an empty file"
        explanation: "An empty or missing file is an error, not a safe default."
      - id: d
        text: "No field, on every Kubernetes version"
        explanation: "Without the field and without kubelet seccompDefault, the pod runs unfiltered."
    correct_option: b
    explanation: "RuntimeDefault blocks risky syscalls and still suits typical applications."

  - id: ats033-040-01-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Contrast AppArmor with seccomp."
    source_readings:
      - sections/section-040/module-01/course-02-apparmor-profiles-for-files-and-capabilities.md
    prompt: "A root process in a container must not write under `/tmp`, although `/tmp` is writable by file mode. Which control fits?"
    options:
      - id: a
        text: "A seccomp profile that blocks `openat`"
        explanation: "That would block all file opening, not one path."
      - id: b
        text: "An AppArmor profile with `deny /tmp/** w,`"
        explanation: "Correct. AppArmor decides by path."
      - id: c
        text: "`runAsNonRoot: true`"
        explanation: "File mode would still allow a normal user to write to /tmp."
      - id: d
        text: "`fsGroup: 1000`"
        explanation: "It sets group ownership of volumes and does not forbid writes."
    correct_option: b
    explanation: "AppArmor is mandatory access control by resource name, and it also binds root."

  - id: ats033-040-01-q08
    type: single_choice
    difficulty: intermediate
    learning_objective: "Combine securityContext fields correctly."
    source_readings:
      - sections/section-040/module-01/course-03-the-restricted-security-context.md
    prompt: "A container has `readOnlyRootFilesystem: true`, runs as user 1000 and must write to `/scratch`, an `emptyDir`. Writes to `/scratch` fail with a permission error. What is the most likely fix?"
    options:
      - id: a
        text: "Set `readOnlyRootFilesystem: false`."
        explanation: "A volume is a separate mount, and the setting does not cause this error."
      - id: b
        text: "Set the pod-level `fsGroup` so that the volume is writable for the process group."
        explanation: "Correct."
      - id: c
        text: "Add the capability `SYS_ADMIN`."
        explanation: "It widens privileges and does not fix ownership."
      - id: d
        text: "Set `seccompProfile` to `Unconfined`."
        explanation: "Seccomp is not involved in file ownership."
    correct_option: b
    explanation: "A new emptyDir belongs to root. fsGroup gives the process group access."

  - id: ats033-040-01-q09
    type: single_choice
    difficulty: advanced
    learning_objective: "Diagnose a pod blocked by a missing seccomp profile."
    source_readings:
      - sections/section-040/module-01/course-04-diagnosing-profile-failures.md
    prompt: "A pod with a `Localhost` seccomp profile shows `CreateContainerError`. Where do you look first, and what do you do?"
    options:
      - id: a
        text: "The pod events from `kubectl describe pod`; copy the correct profile to the node or fix `localhostProfile`."
        explanation: "Correct."
      - id: b
        text: "The application log; the container has already started."
        explanation: "The container never started, so there is no application log."
      - id: c
        text: "The Service endpoints; the selector is wrong."
        explanation: "Services have no effect on container creation."
      - id: d
        text: "The node CPU usage; the node is overloaded."
        explanation: "A profile error gives a clear event message."
    correct_option: a
    explanation: "A missing profile prevents container creation, and the event names the file."

  - id: ats033-040-01-q11
    type: single_choice
    difficulty: intermediate
    learning_objective: "Read the structure of a seccomp profile."
    source_readings:
      - sections/section-040/module-02/course-02-write-and-load-a-localhost-profile.md
    prompt: "A profile has `defaultAction: SCMP_ACT_ALLOW` and one rule with `names: [\"mkdir\", \"mkdirat\"]` and `action: SCMP_ACT_ERRNO`. What happens when the process calls `openat`?"
    options:
      - id: a
        text: "The call runs normally, because no rule names it and the default action allows it."
        explanation: "Correct. The default action decides every syscall that no rule names."
      - id: b
        text: "The call fails with an error, because the profile has an ERRNO rule."
        explanation: "The ERRNO rule applies only to the syscalls in its names list."
      - id: c
        text: "The kernel ends the process."
        explanation: "No rule uses a kill action."
      - id: d
        text: "The call is logged but blocked."
        explanation: "Logging needs the SCMP_ACT_LOG action, and nothing here blocks openat."
    correct_option: a
    explanation: "A deny list allows by default and blocks only the calls it names."

  - id: ats033-040-01-q12
    type: single_choice
    difficulty: advanced
    learning_objective: "Diagnose a denied operation caused by a seccomp profile."
    source_readings:
      - sections/section-040/module-02/course-03-find-blocked-syscalls-and-fix-failures.md
    prompt: "A container runs as root and owns a file, but `mv` on it fails with `Operation not permitted`. The pod uses a `Localhost` seccomp profile and keeps running. What is the best next step?"
    options:
      - id: a
        text: "Set `seccompProfile` to `Unconfined` for the pod."
        explanation: "That removes the filter for every syscall, not only the one needed."
      - id: b
        text: "Map the failing action to its syscall names, compare them with the profile rules, and allow only the needed call."
        explanation: "Correct. The error comes from the filter, not from file permissions."
      - id: c
        text: "Change the file owner with `chown`."
        explanation: "The process already owns the file, so ownership is not the cause."
      - id: d
        text: "Increase the memory limit of the container."
        explanation: "Memory limits do not produce an EPERM error for rename."
    correct_option: b
    explanation: "A root process that is denied on an operation it may normally do is often blocked by a seccomp rule."

  - id: ats033-040-01-q13
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain AppArmor complain mode."
    source_readings:
      - sections/section-040/module-03/course-01-apparmor-modes-and-loading-profiles.md
    prompt: "You are writing an AppArmor profile for a new application and do not yet know every file it needs. Which mode fits the first runs?"
    options:
      - id: a
        text: "Enforce mode, so that missing rules show up as failures."
        explanation: "Enforce mode blocks the application and makes the first runs hard to read."
      - id: b
        text: "Complain mode, which allows the access and logs what the profile would have denied."
        explanation: "Correct. The log shows which rules to add."
      - id: c
        text: "Unconfined, because profiles cannot be tested."
        explanation: "Profiles can be tested in complain mode."
      - id: d
        text: "Remove the profile, because mode is a node setting."
        explanation: "The mode belongs to the loaded profile."
    correct_option: b
    explanation: "Loop in complain mode until the log shows no needed access is missing, then switch to enforce."

  - id: ats033-040-01-q14
    type: single_choice
    difficulty: intermediate
    learning_objective: "Drop Linux capabilities and read the result."
    source_readings:
      - sections/section-040/module-03/course-03-drop-capabilities-and-block-privilege-escalation.md
    prompt: "A container needs only to listen on port 80 as user 1000. Which securityContext fits the least-privilege rule, and where do you read the result?"
    options:
      - id: a
        text: "`capabilities.drop: [ALL]` and `add: [NET_BIND_SERVICE]`; read `CapBnd` in `/proc/1/status`."
        explanation: "Correct. CapBnd shows the bounding set of a non-root process."
      - id: b
        text: "`capabilities.add: [ALL]`; read the pod events."
        explanation: "Adding all capabilities is the opposite of least privilege."
      - id: c
        text: "`privileged: true`; read `/proc/1/attr/current`."
        explanation: "Privileged gives every capability, and the AppArmor file does not list capabilities."
      - id: d
        text: "`capabilities.drop: [NET_BIND_SERVICE]`; read `Seccomp`."
        explanation: "That removes the one capability the workload needs."
    correct_option: a
    explanation: "Drop everything and add back the single capability that is needed. CapEff is empty for a non-root process, so CapBnd is the line to read."

  - id: ats033-040-01-q15
    type: single_choice
    difficulty: advanced
    learning_objective: "Explain why privileged mode defeats other restrictions."
    source_readings:
      - sections/section-040/module-03/course-03-drop-capabilities-and-block-privilege-escalation.md
    prompt: "A container sets `privileged: true` together with `capabilities.drop: [ALL]` and `allowPrivilegeEscalation: false`. What is the best statement about it?"
    options:
      - id: a
        text: "The capability drop works and the container is hardened."
        explanation: "The privileged flag overrides the restriction."
      - id: b
        text: "The privileged flag keeps all capabilities and device access, so the container is not hardened until `privileged` is removed."
        explanation: "Correct. Remove privileged mode first."
      - id: c
        text: "The kubelet rejects the pod because the fields conflict."
        explanation: "The API server accepts it, and the privileged flag wins."
      - id: d
        text: "Only the seccomp profile is disabled."
        explanation: "Privileged mode removes much more than the seccomp profile."
    correct_option: b
    explanation: "Privileged mode gives a container all capabilities and the devices of the node, so other restrictions do not hold."
