apiVersion: v1
kind: Pod
metadata:
  name: scout
  namespace: starfleet-033-040-01-02
spec:
  restartPolicy: Never
  containers:
  - name: scout
    image: docker.io/library/busybox:1.37.0
    command:
    - sh
    - -c
    - sleep 3600
    securityContext:
      appArmorProfile:
        type: Localhost
        localhostProfile: k8s-deny-tmp-write
