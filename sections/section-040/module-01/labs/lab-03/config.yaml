apiVersion: astrona.io/v1
metadata:
  name: ats-033-lab-040-01-03
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/busybox:1.37.0
bootstrap:
  init:
  - name: seed-lab
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: scout-non-root
    description: The scout process runs with a user ID other than 0 and the container sets runAsNonRoot
    type: file
    source: validation/validate-scout-non-root.sh
    points: 1
  - name: scout-read-only-root
    description: Writing to / fails with Read-only file system while writing under /tmp still works
    type: file
    source: validation/validate-scout-read-only-root.sh
    points: 1
  - name: scout-restricted-admission
    description: A server-side dry run of the restricted Pod Security level reports no violation for the namespace
    type: file
    source: validation/validate-scout-restricted-admission.sh
    points: 1
