apiVersion: v1
kind: Pod
metadata:
  name: scout
  namespace: starfleet-033-040-01-01
spec:
  restartPolicy: Never
  securityContext:
    seccompProfile:
      type: Localhost
      localhostProfile: profiles/scout-guard.json
  containers:
  - name: scout
    image: docker.io/library/busybox:1.37.0
    command:
    - sh
    - -c
    - sleep 3600
