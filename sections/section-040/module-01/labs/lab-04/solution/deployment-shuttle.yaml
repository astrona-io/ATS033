apiVersion: apps/v1
kind: Deployment
metadata:
  name: shuttle
  namespace: starfleet-033-040-01-04
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shuttle
  template:
    metadata:
      labels:
        app: shuttle
    spec:
      securityContext:
        seccompProfile:
          type: Localhost
          localhostProfile: profiles/shuttle-guard.json
      containers:
      - name: shuttle
        image: docker.io/library/busybox:1.37.0
        command:
        - sh
        - -c
        - sleep 3600
