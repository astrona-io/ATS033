<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 320" width="850" height="320" role="img" aria-labelledby="title desc">
  <title id="title">Who may connect to etcd</title>
  <desc id="desc">kube-apiserver connects to etcd on port 2379 with a client certificate. Another etcd member connects on port 2380 with a peer certificate. Any other caller without a certificate reaches the port and is rejected in the TLS handshake.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="okline" d="M220 64 H420 L598 132" marker-end="url(#arrowok)"/>
  <path class="okline" d="M220 164 H598" marker-end="url(#arrowok)"/>
  <path class="dashed" d="M220 264 H420 L568 206" marker-end="url(#arrowbad)"/>

  <text class="label good" x="320" y="54" text-anchor="middle">2379, client certificate</text>
  <text class="label good" x="320" y="154" text-anchor="middle">2380, peer certificate</text>
  <text class="label bad" x="320" y="254" text-anchor="middle">2379, no certificate</text>
  <text class="label bad" x="600" y="276" text-anchor="middle">rejected in the</text>
  <text class="label bad" x="600" y="292" text-anchor="middle">TLS handshake</text>

  <rect x="572" y="186" width="10" height="56" rx="2" fill="#c53030"/>

  <rect class="ok" x="20" y="40" width="200" height="48" rx="8"/>
  <text class="code" x="120" y="69" text-anchor="middle">kube-apiserver</text>
  <rect class="ok" x="20" y="140" width="200" height="48" rx="8"/>
  <text x="120" y="169" text-anchor="middle">other etcd member</text>
  <rect class="drop" x="20" y="240" width="200" height="48" rx="8"/>
  <text x="120" y="269" text-anchor="middle">any other caller</text>

  <rect class="box" x="600" y="110" width="230" height="74" rx="8"/>
  <text class="code" x="715" y="140" text-anchor="middle">etcd</text>
  <text class="code" x="715" y="164" text-anchor="middle">--client-cert-auth=true</text>
</svg>
