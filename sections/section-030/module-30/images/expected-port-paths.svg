<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 370" width="870" height="370" role="img" aria-labelledby="title desc">
  <title id="title">Expected paths between control-plane components</title>
  <desc id="desc">Users, nodes and kube-controller-manager connect to kube-apiserver on port 6443. Only kube-apiserver connects to etcd on port 2379 and to the kubelet on port 10250. Any other caller on those ports is a finding.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="okline" d="M240 84 L328 144" marker-end="url(#arrowok)"/>
  <path class="okline" d="M240 224 L328 166" marker-end="url(#arrowok)"/>
  <path class="okline" d="M500 144 L618 86" marker-end="url(#arrowok)"/>
  <path class="okline" d="M500 166 L618 222" marker-end="url(#arrowok)"/>
  <path class="dashed" d="M500 306 L690 250" marker-end="url(#arrowbad)"/>
  <path class="dashed" d="M500 326 H845 V84 H812" marker-end="url(#arrowbad)"/>

  <text class="label good" x="300" y="100" text-anchor="middle">6443</text>
  <text class="label good" x="300" y="222" text-anchor="middle">6443</text>
  <text class="label good" x="545" y="100" text-anchor="middle">2379</text>
  <text class="label good" x="548" y="222" text-anchor="middle">10250</text>
  <text class="label bad" x="610" y="300" text-anchor="middle">finding</text>
  <text class="label bad" x="670" y="346" text-anchor="middle">finding</text>

  <rect class="box" x="30" y="60" width="210" height="48" rx="8"/>
  <text x="135" y="89" text-anchor="middle">user or node</text>
  <rect class="box" x="30" y="200" width="210" height="48" rx="8"/>
  <text class="code" x="135" y="229" text-anchor="middle">kube-controller-manager</text>
  <rect class="ok" x="330" y="131" width="170" height="48" rx="8"/>
  <text class="code" x="415" y="160" text-anchor="middle">kube-apiserver</text>
  <rect class="box" x="620" y="60" width="190" height="48" rx="8"/>
  <text class="code" x="715" y="89" text-anchor="middle">etcd</text>
  <rect class="box" x="620" y="200" width="190" height="48" rx="8"/>
  <text class="code" x="715" y="229" text-anchor="middle">kubelet</text>
  <rect class="drop" x="330" y="292" width="170" height="48" rx="8"/>
  <text x="415" y="321" text-anchor="middle">any other caller</text>
</svg>
