<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" role="img" aria-labelledby="title desc">
  <title id="title">Kubelet API before and after the repair</title>
  <desc id="desc">Before the repair, the kubelet accepts any caller without credentials and AlwaysAllow returns 200 with the list of all pods. After the repair, an anonymous caller gets 401, while kube-apiserver presents a client certificate and its request is allowed by RBAC through the Webhook check.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <line class="sep" x1="20" y1="170" x2="840" y2="170"/>

  <path class="line" d="M200 94 H318" marker-end="url(#arrow)"/>
  <path class="line" d="M520 94 H638" marker-end="url(#arrow)"/>
  <path class="dashed" d="M200 244 L318 272" marker-end="url(#arrowbad)"/>
  <path class="dashed" d="M520 272 L638 244" marker-end="url(#arrowbad)"/>
  <path class="okline" d="M200 354 L318 318" marker-end="url(#arrowok)"/>
  <path class="okline" d="M520 318 L638 354" marker-end="url(#arrowok)"/>

  <text class="label" x="260" y="84" text-anchor="middle">no credentials</text>
  <text class="label bad" x="248" y="236" text-anchor="middle">no credentials</text>
  <text class="label good" x="258" y="370" text-anchor="middle">client certificate</text>
  <text class="label good" x="586" y="370" text-anchor="middle">Webhook check</text>

  <text class="strong" x="20" y="40">Before: <tspan class="code">anonymous.enabled: true</tspan>, <tspan class="code">mode: AlwaysAllow</tspan></text>
  <rect class="box" x="20" y="70" width="180" height="48" rx="8"/>
  <text x="110" y="99" text-anchor="middle">any caller</text>
  <rect class="box" x="320" y="70" width="200" height="48" rx="8"/>
  <text class="code" x="420" y="99" text-anchor="middle">kubelet :10250</text>
  <rect class="drop" x="640" y="70" width="200" height="48" rx="8"/>
  <text x="740" y="99" text-anchor="middle">200, list of all pods</text>

  <text class="strong" x="20" y="200">After: <tspan class="code">anonymous.enabled: false</tspan>, <tspan class="code">mode: Webhook</tspan></text>
  <rect class="box" x="20" y="220" width="180" height="48" rx="8"/>
  <text x="110" y="249" text-anchor="middle">anonymous caller</text>
  <rect class="box" x="320" y="262" width="200" height="66" rx="8"/>
  <text class="code" x="420" y="300" text-anchor="middle">kubelet :10250</text>
  <rect class="drop" x="640" y="220" width="200" height="48" rx="8"/>
  <text class="strong bad" x="740" y="249" text-anchor="middle">401</text>
  <rect class="ok" x="20" y="330" width="180" height="48" rx="8"/>
  <text class="code" x="110" y="359" text-anchor="middle">kube-apiserver</text>
  <rect class="ok" x="640" y="330" width="200" height="48" rx="8"/>
  <text x="740" y="359" text-anchor="middle">allowed by RBAC</text>
</svg>
