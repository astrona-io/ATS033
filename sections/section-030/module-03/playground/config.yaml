apiVersion: astrona.io/v1
metadata:
  name: ats-033-playground-030-03
  docs:
    guide: docs/overview.md
# A real kubeadm node, so the readings read the real listeners, static pod
# manifests, kubelet configuration and etcd files instead of a kind node
# container.
runtime:
  type: qemu
  qemu:
  - image:
      type: oci
      source: ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-cks
    cpus: 2
    memoryMB: 4096
    diskSizeGB: 25
    display: false
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
