apiVersion: astrona.io/v1
metadata:
  name: ats-033-lab-030-03-03
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  # The lab changes the kubelet configuration file and restarts the kubelet,
  # so it runs a real one-node kubeadm cluster in a VM instead of kind.
  type: qemu
  qemu:
  - image:
      type: oci
      source: ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-cks
      checksums:
        amd64: sha256:dc3348c725b6b36d08888acdcbda44cc34894b76d5b56a594f7ce253b6d2e773
        arm64: sha256:31798490219e2ee856d7f8c2cb9df83182bbac64c7d8ce7c15e81445527d7898
    cpus: 2
    memoryMB: 4096
    diskSizeGB: 25
    display: false
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: vm/install.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: vm/verify-start.sh
  - name: reference-result
    type: file
    source: vm/apply-solution.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: vm/wait-solved.sh
validation:
  scripts:
  - name: anonymous-auth-disabled
    description: The kubelet rejects anonymous requests with 401
    type: file
    source: vm/validate-anonymous-auth-disabled.sh
    points: 1
  - name: webhook-authorization
    description: The kubelet authorization mode is Webhook
    type: file
    source: vm/validate-webhook-authorization.sh
    points: 1
