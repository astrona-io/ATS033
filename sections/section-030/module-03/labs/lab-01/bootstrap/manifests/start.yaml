apiVersion: v1
kind: Namespace
metadata:
  name: starfleet-033-030-03-01
---
apiVersion: v1
kind: Pod
metadata:
  name: shuttle
  namespace: starfleet-033-030-03-01
  labels:
    app: shuttle
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: node-role.kubernetes.io/control-plane
            operator: DoesNotExist
  containers:
  - name: client
    image: docker.io/library/busybox:1.37.0
    command:
    - sh
    - -c
    - sleep 36000
  restartPolicy: Never
