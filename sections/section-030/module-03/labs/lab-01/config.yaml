apiVersion: astrona.io/v1
metadata:
  name: ats-033-lab-030-03-01
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  # The lab changes a static pod manifest on the control-plane node, so it runs
  # a real one-node kubeadm cluster in a VM instead of kind node containers.
  type: qemu
  qemu:
  - image:
      type: oci
      source: ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-cks-20261118-{ARCH}
      checksums:
        amd64: sha256:dc3348c725b6b36d08888acdcbda44cc34894b76d5b56a594f7ce253b6d2e773
        arm64: sha256:31798490219e2ee856d7f8c2cb9df83182bbac64c7d8ce7c15e81445527d7898
    cpus: 2
    memoryMB: 4096
    diskSizeGB: 25
    display: false
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: vm/install.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: vm/verify-start.sh
  - name: reference-result
    type: file
    source: vm/apply-solution.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: vm/wait-solved.sh
validation:
  scripts:
  - name: scheduler-loopback-listener
    description: kube-scheduler runs with --bind-address=127.0.0.1, listens on 127.0.0.1:10259 only and still answers its health check
    type: file
    source: vm/validate-scheduler-loopback-listener.sh
    points: 1
  - name: scheduler-port-closed
    description: A request from the shuttle pod to port 10259 on the control-plane node address is refused
    type: file
    source: vm/validate-scheduler-port-closed.sh
    points: 1
