apiVersion: astrona.io/v1
metadata:
  name: ats-033-lab-030-03-01
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/busybox:1.37.0
    nodes:
      workers: 1
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: scheduler-loopback-listener
    description: kube-scheduler runs with --bind-address=127.0.0.1, listens on 127.0.0.1:10259 only and still answers its health check
    type: file
    source: validation/validate-scheduler-loopback-listener.sh
    points: 1
  - name: scheduler-port-closed
    description: A request from the shuttle pod to port 10259 on the control-plane node address is refused
    type: file
    source: validation/validate-scheduler-port-closed.sh
    points: 1
