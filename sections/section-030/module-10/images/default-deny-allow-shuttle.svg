<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" width="840" height="360" role="img" aria-labelledby="title desc">
  <title id="title">Default deny plus one allow policy</title>
  <desc id="desc">In the starfleet namespace, default-deny-ingress selects every pod and allow-shuttle-to-probe lets pods labelled app: shuttle reach pods labelled app: probe on TCP port 8080. The shuttle pod reaches the probe pods. The drifter pod in the outpost namespace is dropped.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <rect class="frame" x="30" y="30" width="560" height="200" rx="10"/>
  <text class="label" x="46" y="54"><tspan class="code">starfleet</tspan> namespace</text>
  <rect class="frame" x="30" y="260" width="560" height="80" rx="10"/>
  <text class="label" x="46" y="284"><tspan class="code">outpost</tspan> namespace</text>
  <path class="okline" d="M200 125 H408" marker-end="url(#arrowok)"/>
  <text class="label good" x="300" y="115" text-anchor="middle">TCP 8080: allowed</text>
  <path class="dashed" d="M200 305 H300 V170 H408" marker-end="url(#arrowbad)"/>
  <text class="label bad" x="310" y="250">TCP 8080: dropped</text>
  <rect class="box" x="60" y="100" width="140" height="50" rx="8"/>
  <text x="130" y="122" text-anchor="middle" class="code">shuttle</text>
  <text x="130" y="140" text-anchor="middle" class="label">app: shuttle</text>
  <rect class="ok" x="410" y="90" width="160" height="90" rx="8"/>
  <text x="490" y="128" text-anchor="middle"><tspan class="code">probe</tspan> pods</text>
  <text x="490" y="148" text-anchor="middle" class="label">app: probe</text>
  <rect class="box" x="60" y="290" width="140" height="40" rx="8"/>
  <text x="130" y="315" text-anchor="middle" class="code">drifter</text>
  <text class="label" x="620" y="48">policies in <tspan class="code">starfleet</tspan></text>
  <rect class="policy" x="620" y="60" width="200" height="60" rx="8"/>
  <text x="720" y="86" text-anchor="middle" class="code">default-deny-ingress</text>
  <text x="720" y="106" text-anchor="middle" class="label">all pods, no ingress</text>
  <rect class="policy" x="620" y="140" width="200" height="60" rx="8"/>
  <text x="720" y="166" text-anchor="middle" class="code">allow-shuttle-to-probe</text>
  <text x="720" y="186" text-anchor="middle" class="label">app: shuttle, TCP 8080</text>
</svg>
