schema_version: 1
kind: question_bank
id: ats033-030-01
course_id: ATS033
exam_code: CKS
status: draft
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: section
  id: section-030
  title: Minimize External Access To The Network
questions:
- id: ats033-030-01-q01
  type: single_choice
  difficulty: beginner
  learning_objective: Read the Local Address column of ss output.
  source_readings:
  - sections/section-030/module-01/course-01-listeners-and-bind-addresses.md
  prompt: "`ss -tlnp` on a node shows a service with the local address `127.0.0.1:19090`. Who can connect to it?"
  options:
  - id: a
    text: 'Only processes on the same node, including pods that use `hostNetwork: true`.'
    explanation: Correct. Loopback is not reachable from other machines.
  - id: b
    text: Any machine that can route to the node.
    explanation: That describes `0.0.0.0`, not `127.0.0.1`.
  - id: c
    text: Any pod in the cluster.
    explanation: A pod outside the host network reaches the node address, not the loopback of the node.
  - id: d
    text: Nobody, because loopback addresses are disabled in containers.
    explanation: Loopback works normally for local processes.
  correct_option: a
  explanation: A service bound to loopback accepts connections from processes on the same host only.
- id: ats033-030-01-q02
  type: single_choice
  difficulty: beginner
  learning_objective: Tell a refused connection from a timeout.
  source_readings:
  - sections/section-030/module-01/course-01-listeners-and-bind-addresses.md
  prompt: A client gets `Connection refused` immediately when it connects to a node port. What does this most likely mean?
  options:
  - id: a
    text: A firewall rule silently dropped the packet.
    explanation: A drop produces a timeout, not an immediate refusal.
  - id: b
    text: The packet reached the host and no process listens on that address and port.
    explanation: Correct. The host answers with a reset.
  - id: c
    text: The route to the node does not exist.
    explanation: A missing route usually ends in a timeout or a network-unreachable error.
  - id: d
    text: A NetworkPolicy allowed the traffic.
    explanation: An allow decision does not cause a refusal.
  correct_option: b
  explanation: Refused means the host is reachable and nothing listens there. A timeout points to filtering or no route.
- id: ats033-030-01-q06
  type: single_choice
  difficulty: intermediate
  learning_objective: Apply the NetworkPolicy ingress model.
  source_readings:
  - sections/section-030/module-01/course-03-networkpolicy-for-pod-traffic.md
  prompt: 'In namespace `starfleet`, a policy has `podSelector: {}` and `policyTypes: [Ingress]` with no ingress rules. What does it do?'
  options:
  - id: a
    text: It allows all ingress to every pod in the namespace.
    explanation: Without rules nothing is allowed.
  - id: b
    text: It denies all ingress to every pod in the namespace, if the CNI plugin enforces policies.
    explanation: Correct. This is the standard default deny.
  - id: c
    text: It denies ingress to pods in all namespaces.
    explanation: A policy applies to its own namespace.
  - id: d
    text: It blocks egress from the pods as well.
    explanation: Egress is affected only when `Egress` is in `policyTypes`.
  correct_option: b
  explanation: An empty selector selects all pods of the namespace, and an empty rule list allows nothing.
- id: ats033-030-01-q09
  type: single_choice
  difficulty: intermediate
  learning_objective: Know how far a NodePort reaches.
  source_readings:
  - sections/section-030/module-01/course-04-nodeports-control-plane-ports-and-api-access.md
  prompt: 'A Service of type `NodePort` with `nodePort: 30080` selects pods that run on one worker node only. On which nodes is port 30080 open?'
  options:
  - id: a
    text: Only on the worker node that runs the pods.
    explanation: kube-proxy opens it on every node.
  - id: b
    text: On every node of the cluster.
    explanation: Correct.
  - id: c
    text: Only on the control-plane node.
    explanation: No such rule exists.
  - id: d
    text: On no node until a LoadBalancer is added.
    explanation: A NodePort works without one.
  correct_option: b
  explanation: Remove unused NodePort Services, because each one opens a port on all nodes.
- id: ats033-030-01-q10
  type: single_choice
  difficulty: advanced
  learning_objective: Prioritise control-plane ports for restriction.
  source_readings:
  - sections/section-030/module-01/course-04-nodeports-control-plane-ports-and-api-access.md
  prompt: A security group review of a cluster lists the ports 6443, 2379, 10250 and 30080. Which port must never be reachable from the internet because it holds all cluster Secrets?
  options:
  - id: a
    text: 6443, the API server.
    explanation: It needs restriction too, but it is the intended entry point behind authentication.
  - id: b
    text: 2379, the etcd client port.
    explanation: Correct. etcd stores every Secret.
  - id: c
    text: 10250, the kubelet API.
    explanation: It needs restriction, but it does not store the Secrets.
  - id: d
    text: 30080, a NodePort.
    explanation: It exposes one application only.
  correct_option: b
  explanation: Restrict 2379 and 2380 to the API servers and etcd members, and restrict 6443 and 10250 to known networks.
- id: ats033-030-01-q11
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain what externalTrafficPolicy Local changes.
  source_readings:
  - sections/section-030/module-02/course-02-narrowing-nodeports-and-load-balancers.md
  prompt: 'A NodePort Service has `externalTrafficPolicy: Local`. A client sends a request to a node that has no ready pod of the Service. What happens?'
  options:
  - id: a
    text: The node forwards the request to a pod on another node and replaces the client address.
    explanation: That describes `Cluster`, the default policy.
  - id: b
    text: The node drops the request, because it forwards only to its own pods.
    explanation: Correct. A node without a ready local pod does not answer.
  - id: c
    text: The node answers with a redirect to a node that has a pod.
    explanation: Kubernetes does not redirect NodePort traffic.
  - id: d
    text: The node opens a new pod for the request.
    explanation: Traffic does not create pods.
  correct_option: b
  explanation: With `Local`, only nodes with ready pods answer, and the pods see the real client address.
- id: ats033-030-01-q12
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain what an Ingress needs in order to have an effect.
  source_readings:
  - sections/section-030/module-02/course-03-ingress-and-finding-exposed-services.md
  prompt: You create an Ingress object in a cluster that has no Ingress controller. What is the result?
  options:
  - id: a
    text: The API server stores the object and no traffic is routed by it.
    explanation: Correct. A controller must read and apply the object.
  - id: b
    text: The API server opens ports 80 and 443 on every node.
    explanation: The API server opens no data ports for an Ingress.
  - id: c
    text: The API server rejects the object.
    explanation: It accepts the object, even when the class does not exist.
  - id: d
    text: "`kube-proxy` serves the Ingress rules."
    explanation: "`kube-proxy` programs Service rules, not Ingress rules."
  correct_option: a
  explanation: An Ingress is enforced by an Ingress controller. Without one the object is only stored.
- id: ats033-030-01-q13
  type: single_choice
  difficulty: intermediate
  learning_objective: Read an anonymous request result.
  source_readings:
  - sections/section-030/module-03/course-02-api-server-authentication-and-authorization.md
  prompt: An unauthenticated request to `/api/v1/namespaces` returns a `Status` with code 403 that names the user `system:anonymous`. What does this show?
  options:
  - id: a
    text: Anonymous access is enabled and the user is not allowed to list namespaces.
    explanation: Correct. The request was treated as `system:anonymous` and authorization denied it.
  - id: b
    text: Anonymous access is disabled.
    explanation: With anonymous access disabled, the answer is 401.
  - id: c
    text: The API server certificate is invalid.
    explanation: A certificate problem fails the TLS handshake, not an HTTP status.
  - id: d
    text: The `AlwaysAllow` mode is active.
    explanation: With `AlwaysAllow` the request would be allowed.
  correct_option: a
  explanation: A 403 means the caller is known, here as the anonymous user, and not allowed.
- id: ats033-030-01-q14
  type: single_choice
  difficulty: advanced
  learning_objective: Choose the kubelet settings that close port 10250.
  source_readings:
  - sections/section-030/module-03/course-03-kubelet-api-authentication-and-authorization.md
  prompt: 'A kubelet has `authentication.anonymous.enabled: true` and `authorization.mode: AlwaysAllow`. Which change closes the kubelet API to anonymous callers, and what must follow?'
  options:
  - id: a
    text: Set anonymous access to `false` and the mode to `Webhook`, then restart the kubelet.
    explanation: Correct. The kubelet reads its configuration file at start.
  - id: b
    text: Set only the mode to `Webhook`; no restart is needed.
    explanation: Anonymous access stays on, and the kubelet needs a restart to read the file.
  - id: c
    text: Delete the pods on the node.
    explanation: The pods do not control the kubelet API.
  - id: d
    text: Set `readOnlyPort` to 10250.
    explanation: "`readOnlyPort` is a different, unauthenticated port."
  correct_option: a
  explanation: Both settings must change, and the kubelet must restart.
- id: ats033-030-01-q15
  type: single_choice
  difficulty: advanced
  learning_objective: Judge the protection of the etcd client port.
  source_readings:
  - sections/section-030/module-03/course-04-etcd-client-access.md
  prompt: A request to the etcd client port without a certificate ends in a TLS error. A colleague says the firewall rule for port 2379 is therefore not needed. What is the best answer?
  options:
  - id: a
    text: The firewall rule is still needed, because the TLS check is a second control and any caller that reaches the port can attempt the handshake.
    explanation: Correct. Network rules and client certificates are separate layers.
  - id: b
    text: The colleague is right; TLS replaces the firewall.
    explanation: TLS does not stop callers from reaching the port.
  - id: c
    text: The rule is needed only for port 2380.
    explanation: Both etcd ports need a rule.
  - id: d
    text: The rule is needed only when Secrets are encrypted.
    explanation: Encryption at rest is a different control.
  correct_option: a
  explanation: 'Use both: allow 2379 from the API servers only, and keep `--client-cert-auth=true`.'
placement:
  position: after
  reading: sections/section-030/module-03/course-05-summary.md
