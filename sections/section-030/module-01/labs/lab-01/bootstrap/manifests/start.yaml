apiVersion: v1
kind: Namespace
metadata:
  name: starfleet-033-030-01-01
---
apiVersion: v1
kind: Pod
metadata:
  name: node-local-server
  namespace: starfleet-033-030-01-01
  labels:
    app: node-local-server
spec:
  restartPolicy: Never
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
  containers:
  - name: web
    image: docker.io/library/python:3.13-alpine
    command:
    - python
    - -m
    - http.server
    - '19090'
    - --bind
    - 0.0.0.0
---
apiVersion: v1
kind: Pod
metadata:
  name: shuttle
  namespace: starfleet-033-030-01-01
  labels:
    app: shuttle
spec:
  restartPolicy: Never
  containers:
  - name: client
    image: docker.io/library/busybox:1.37.0
    command:
    - sh
    - -c
    - sleep 86400
