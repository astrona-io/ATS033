apiVersion: astrona.io/v1
metadata:
  name: ats-033-lab-030-01-02
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  # The lab turns on ufw, the host firewall of the node, so it runs a one-node
  # kubeadm cluster in a VM instead of kind node containers.
  type: qemu
  qemu:
  - image:
      type: oci
      source: ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-cks
    cpus: 2
    memoryMB: 4096
    diskSizeGB: 25
    display: false
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: vm/install.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: vm/verify-start.sh
  - name: reference-result
    type: file
    source: vm/apply-solution.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: vm/wait-solved.sh
validation:
  scripts:
  - name: ufw-deny-rule
    description: ufw is active and has a DENY or REJECT rule for TCP port 19091
    type: file
    source: vm/validate-ufw-deny-rule.sh
    points: 1
  - name: pod-access-blocked
    description: A request from the shuttle pod to port 19091 on the node address fails, while the node itself still gets the page
    type: file
    source: vm/validate-pod-access-blocked.sh
    points: 1
