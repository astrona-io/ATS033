apiVersion: v1
kind: Namespace
metadata:
  name: starfleet-033-030-01-03
---
apiVersion: v1
kind: Namespace
metadata:
  name: outpost-033-030-01-03
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: probe-code
  namespace: starfleet-033-030-01-03
data:
  server.py: |
    from http.server import BaseHTTPRequestHandler, HTTPServer
    import os
    import socket


    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            body = f"version={os.getenv('VERSION', 'v1')} host={socket.gethostname()}\n"
            self.send_response(200)
            self.send_header("Content-Type", "text/plain")
            self.end_headers()
            self.wfile.write(body.encode())


    HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe
  namespace: starfleet-033-030-01-03
spec:
  replicas: 2
  selector:
    matchLabels:
      app: probe
  template:
    metadata:
      labels:
        app: probe
    spec:
      containers:
      - name: probe
        image: docker.io/library/python:3.13-alpine
        command:
        - python
        - /app/server.py
        env:
        - name: VERSION
          value: v1
        ports:
        - name: http
          containerPort: 8080
        volumeMounts:
        - name: app
          mountPath: /app
          readOnly: true
      volumes:
      - name: app
        configMap:
          name: probe-code
---
apiVersion: v1
kind: Service
metadata:
  name: probe
  namespace: starfleet-033-030-01-03
spec:
  selector:
    app: probe
  ports:
  - name: http
    port: 80
    targetPort: http
---
apiVersion: v1
kind: Pod
metadata:
  name: beacon
  namespace: starfleet-033-030-01-03
  labels:
    app: beacon
spec:
  restartPolicy: Never
  containers:
  - name: beacon
    image: docker.io/library/python:3.13-alpine
    command:
    - python
    - /app/server.py
    env:
    - name: VERSION
      value: beacon
    ports:
    - name: http
      containerPort: 8080
    volumeMounts:
    - name: app
      mountPath: /app
      readOnly: true
  volumes:
  - name: app
    configMap:
      name: probe-code
---
apiVersion: v1
kind: Pod
metadata:
  name: shuttle
  namespace: starfleet-033-030-01-03
  labels:
    app: shuttle
spec:
  restartPolicy: Never
  containers:
  - name: client
    image: docker.io/library/busybox:1.37.0
    command:
    - sh
    - -c
    - sleep 86400
---
apiVersion: v1
kind: Pod
metadata:
  name: drifter
  namespace: outpost-033-030-01-03
  labels:
    app: drifter
spec:
  restartPolicy: Never
  containers:
  - name: client
    image: docker.io/library/busybox:1.37.0
    command:
    - sh
    - -c
    - sleep 86400
