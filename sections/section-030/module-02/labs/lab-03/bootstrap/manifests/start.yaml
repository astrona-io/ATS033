apiVersion: v1
kind: Namespace
metadata:
  name: starfleet-033-030-02-03
---
apiVersion: v1
kind: Namespace
metadata:
  name: outpost-033-030-02-03
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: probe-code
  namespace: starfleet-033-030-02-03
data:
  server.py: |
    from http.server import BaseHTTPRequestHandler, HTTPServer
    import os
    import socket


    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            body = f"version={os.getenv('VERSION', 'v1')} host={socket.gethostname()}\n"
            self.send_response(200)
            self.send_header("Content-Type", "text/plain")
            self.end_headers()
            self.wfile.write(body.encode())


    HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe
  namespace: starfleet-033-030-02-03
spec:
  replicas: 2
  selector:
    matchLabels:
      app: probe
  template:
    metadata:
      labels:
        app: probe
    spec:
      containers:
      - name: probe
        image: docker.io/library/python:3.13-alpine
        command:
        - python
        - /app/server.py
        env:
        - name: VERSION
          value: v1
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          tcpSocket:
            port: http
          periodSeconds: 2
        volumeMounts:
        - name: app
          mountPath: /app
          readOnly: true
      volumes:
      - name: app
        configMap:
          name: probe-code
---
apiVersion: v1
kind: Service
metadata:
  name: probe-public
  namespace: starfleet-033-030-02-03
spec:
  type: NodePort
  selector:
    app: probe
  ports:
  - name: http
    port: 80
    targetPort: http
    nodePort: 30081
---
apiVersion: v1
kind: Service
metadata:
  name: probe-legacy
  namespace: starfleet-033-030-02-03
spec:
  type: ClusterIP
  selector:
    app: probe
  externalIPs:
  - 203.0.113.10
  ports:
  - name: http
    port: 80
    targetPort: http
---
apiVersion: v1
kind: Pod
metadata:
  name: shuttle
  namespace: starfleet-033-030-02-03
  labels:
    app: shuttle
spec:
  restartPolicy: Never
  containers:
  - name: client
    image: docker.io/library/busybox:1.37.0
    command:
    - sh
    - -c
    - sleep 86400
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: beacon-code
  namespace: outpost-033-030-02-03
data:
  server.py: |
    from http.server import BaseHTTPRequestHandler, HTTPServer
    import socket


    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            body = f"version=beacon host={socket.gethostname()}\n"
            self.send_response(200)
            self.send_header("Content-Type", "text/plain")
            self.end_headers()
            self.wfile.write(body.encode())


    HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: v1
kind: Pod
metadata:
  name: beacon
  namespace: outpost-033-030-02-03
  labels:
    app: beacon
spec:
  restartPolicy: Never
  containers:
  - name: beacon
    image: docker.io/library/python:3.13-alpine
    command:
    - python
    - /app/server.py
    ports:
    - name: http
      containerPort: 8080
    readinessProbe:
      tcpSocket:
        port: http
      periodSeconds: 2
    volumeMounts:
    - name: app
      mountPath: /app
      readOnly: true
  volumes:
  - name: app
    configMap:
      name: beacon-code
---
apiVersion: v1
kind: Service
metadata:
  name: beacon-debug
  namespace: outpost-033-030-02-03
spec:
  type: NodePort
  selector:
    app: beacon
  ports:
  - name: http
    port: 80
    targetPort: http
    nodePort: 30090
---
apiVersion: v1
kind: Pod
metadata:
  name: relay
  namespace: outpost-033-030-02-03
  labels:
    app: relay
spec:
  restartPolicy: Never
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: node-role.kubernetes.io/control-plane
            operator: DoesNotExist
  containers:
  - name: web
    image: docker.io/library/python:3.13-alpine
    command:
    - python
    - -m
    - http.server
    - '18080'
