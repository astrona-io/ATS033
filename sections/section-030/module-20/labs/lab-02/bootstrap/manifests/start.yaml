apiVersion: v1
kind: Namespace
metadata:
  name: starfleet-033-030-02-02
---
apiVersion: v1
kind: Namespace
metadata:
  name: outpost-033-030-02-02
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: probe-code
  namespace: starfleet-033-030-02-02
data:
  server.py: |
    from http.server import BaseHTTPRequestHandler, HTTPServer
    import os
    import socket


    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            body = f"version={os.getenv('VERSION', 'v1')} host={socket.gethostname()}\n"
            self.send_response(200)
            self.send_header("Content-Type", "text/plain")
            self.end_headers()
            self.wfile.write(body.encode())


    HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe
  namespace: starfleet-033-030-02-02
spec:
  replicas: 2
  selector:
    matchLabels:
      app: probe
  template:
    metadata:
      labels:
        app: probe
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
      containers:
      - name: probe
        image: docker.io/library/python:3.13-alpine
        command:
        - python
        - /app/server.py
        env:
        - name: VERSION
          value: v1
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          tcpSocket:
            port: http
          periodSeconds: 2
        volumeMounts:
        - name: app
          mountPath: /app
          readOnly: true
      volumes:
      - name: app
        configMap:
          name: probe-code
---
apiVersion: v1
kind: Service
metadata:
  name: probe-public
  namespace: starfleet-033-030-02-02
spec:
  type: NodePort
  externalTrafficPolicy: Cluster
  selector:
    app: probe
  ports:
  - name: http
    port: 80
    targetPort: http
    nodePort: 30081
---
apiVersion: v1
kind: Pod
metadata:
  name: drifter
  namespace: outpost-033-030-02-02
  labels:
    app: drifter
spec:
  restartPolicy: Never
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: node-role.kubernetes.io/control-plane
            operator: DoesNotExist
  containers:
  - name: client
    image: docker.io/library/busybox:1.37.0
    command:
    - sh
    - -c
    - sleep 86400
