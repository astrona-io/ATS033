apiVersion: astrona.io/v1
metadata:
  name: ats-033-lab-030-02-03
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/python:3.13-alpine
    - docker.io/library/busybox:1.37.0
    nodes:
      workers: 1
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: no-external-ips
    description: No Service in the cluster sets externalIPs, probe-legacy still answers inside the cluster, and 203.0.113.10 no longer answers
    type: file
    source: validation/validate-no-external-ips.sh
    points: 1
  - name: single-node-port
    description: Only probe-public keeps a node port, port 30081 still answers and port 30090 no longer answers
    type: file
    source: validation/validate-single-node-port.sh
    points: 1
  - name: no-host-network-listener
    description: No pod outside kube-* namespaces uses the host network, and port 18080 on the worker refuses connections
    type: file
    source: validation/validate-no-host-network-listener.sh
    points: 1
