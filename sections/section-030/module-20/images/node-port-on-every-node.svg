<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" width="840" height="380" role="img" aria-labelledby="title desc">
  <title id="title">A node port answers on every node</title>
  <desc id="desc">The drifter pod sends a request to port 30090 on the control-plane node and on the worker node. On each node, the kube-proxy rules rewrite the destination (DNAT) to a probe pod on port 8080. The control-plane node has no probe pod, so its rules forward the request to the pod on the worker node.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <path class="okline" d="M160 170 L298 110" marker-end="url(#arrowok)"/>
  <path class="okline" d="M160 200 L298 290" marker-end="url(#arrowok)"/>
  <path class="okline" d="M500 290 H598" marker-end="url(#arrowok)"/>
  <path class="okline" d="M500 110 H695 V266" marker-end="url(#arrowok)"/>

  <rect class="frame" x="220" y="30" width="590" height="140" rx="10"/>
  <text class="label" x="236" y="54">control-plane node</text>
  <rect class="frame" x="220" y="200" width="590" height="150" rx="10"/>
  <text class="label" x="236" y="224">worker node</text>

  <text class="label" x="598" y="100" text-anchor="middle">DNAT to pod IP:8080</text>
  <text class="label" x="549" y="280" text-anchor="middle">DNAT</text>
  <text class="label" x="300" y="158">no <tspan class="code">probe</tspan> pod on this node</text>

  <rect class="box" x="30" y="160" width="130" height="50" rx="8"/>
  <text x="95" y="190" text-anchor="middle"><tspan class="code">drifter</tspan> pod</text>

  <rect class="ask" x="300" y="80" width="200" height="58" rx="8"/>
  <text x="400" y="104" text-anchor="middle"><tspan class="code">kube-proxy</tspan> rules</text>
  <text class="code" x="400" y="126" text-anchor="middle">node IP:30090</text>
  <rect class="ask" x="300" y="261" width="200" height="58" rx="8"/>
  <text x="400" y="285" text-anchor="middle"><tspan class="code">kube-proxy</tspan> rules</text>
  <text class="code" x="400" y="307" text-anchor="middle">node IP:30090</text>

  <rect class="ok" x="600" y="268" width="190" height="44" rx="8"/>
  <text x="695" y="295" text-anchor="middle"><tspan class="code">probe</tspan> pod :8080</text>
</svg>
