<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="840" height="330" role="img" aria-labelledby="title desc">
  <title id="title">How far each Service type reaches</title>
  <desc id="desc">A ClusterIP Service has only a cluster address, reachable inside the cluster. A NodePort Service has the cluster address plus a port from 30000 to 32767 on every node. A LoadBalancer Service has both of those plus an external load balancer that the cloud provider integration creates.</desc>
  <style>
    .box { fill: #f4f5f7; stroke: #5b6472; }
    .ask { fill: #fff7e0; stroke: #b7791f; }
    .ok { fill: #e3f5e8; stroke: #2f855a; }
    .drop { fill: #fde8e8; stroke: #c53030; }
    .box, .ask, .ok, .drop { stroke-width: 1.5; }
    .frame { fill: none; stroke: #9aa5b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .policy { fill: #fff7e0; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 13px; font-weight: 600; fill: #7b8494; }
    .good { fill: #2f855a; }
    .bad { fill: #c53030; }
    .strong { font-weight: 600; }
    .line { fill: none; stroke: #7b8494; stroke-width: 1.5; }
    .okline { fill: none; stroke: #2f855a; stroke-width: 1.75; }
    .dashed { fill: none; stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .sep { stroke: #d5dae1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#7b8494" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#2f855a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="arrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path fill="#c53030" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>
  <line class="sep" x1="30" y1="112" x2="810" y2="112"/>
  <line class="sep" x1="30" y1="212" x2="810" y2="212"/>
  <text class="strong" x="30" y="62">ClusterIP</text>
  <text class="label" x="30" y="82">the default</text>
  <rect class="ok" x="200" y="40" width="196" height="56" rx="8"/>
  <text x="298" y="63" text-anchor="middle">cluster address</text>
  <text class="code" x="298" y="83" text-anchor="middle">spec.clusterIP</text>
  <text x="420" y="73">Reachable inside the cluster only.</text>
  <text class="strong" x="30" y="162">NodePort</text>
  <text class="label" x="30" y="182">adds a node port</text>
  <rect class="ok" x="200" y="140" width="196" height="56" rx="8"/>
  <text x="298" y="163" text-anchor="middle">cluster address</text>
  <text class="code" x="298" y="183" text-anchor="middle">spec.clusterIP</text>
  <rect class="ask" x="412" y="140" width="196" height="56" rx="8"/>
  <text x="510" y="163" text-anchor="middle">port on every node</text>
  <text class="code" x="510" y="183" text-anchor="middle">30000-32767</text>
  <text x="624" y="164">Reachable by any client</text>
  <text x="624" y="184">that reaches a node address.</text>
  <text class="strong" x="30" y="262">LoadBalancer</text>
  <text class="label" x="30" y="282">adds a load balancer</text>
  <rect class="ok" x="200" y="240" width="196" height="56" rx="8"/>
  <text x="298" y="263" text-anchor="middle">cluster address</text>
  <text class="code" x="298" y="283" text-anchor="middle">spec.clusterIP</text>
  <rect class="ask" x="412" y="240" width="196" height="56" rx="8"/>
  <text x="510" y="263" text-anchor="middle">port on every node</text>
  <text class="code" x="510" y="283" text-anchor="middle">30000-32767</text>
  <rect class="drop" x="624" y="240" width="196" height="56" rx="8"/>
  <text x="722" y="263" text-anchor="middle">external load balancer</text>
  <text class="code" x="722" y="283" text-anchor="middle">status.loadBalancer</text>
</svg>
