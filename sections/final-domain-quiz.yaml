- id: ats033-final-q01
  type: single_choice
  difficulty: intermediate
  learning_objective: Distinguish `disable` from `mask`.
  source_readings:
  - sections/section-010/module-01/course-02-stop-disable-and-mask-services.md
  prompt: A package ships `legacy-agent.service`. Another package needs the first
    package installed, so you cannot uninstall it. You must make sure that nothing,
    not even a dependency, starts the agent. Which command does that?
  options:
  - id: a
    text: "`systemctl stop legacy-agent.service`"
    explanation: The service can start again at boot or by dependency.
  - id: b
    text: "`systemctl disable legacy-agent.service`"
    explanation: A disabled unit can still be started by hand or as a dependency of
      another unit.
  - id: c
    text: "`systemctl mask --now legacy-agent.service`"
    explanation: Correct. Masking links the unit to `/dev/null`, so it cannot be started
      at all, and `--now` stops it.
  - id: d
    text: "`systemctl daemon-reload`"
    explanation: This reloads unit files. It does not change the state of a service.
  correct_option: c
  explanation: "`mask` blocks every start of the unit and package updates do not undo
    it."
- id: ats033-final-q02
  type: single_choice
  difficulty: intermediate
  learning_objective: Predict the effective value of an sshd setting that appears
    in two files.
  source_readings:
  - sections/section-010/module-02/course-01-read-the-sshd-settings.md
  prompt: The main file `/etc/ssh/sshd_config` sets `PermitRootLogin yes` after an
    `Include /etc/ssh/sshd_config.d/*.conf` line. A drop-in file in that directory
    sets `PermitRootLogin no`. Which value does sshd use?
  options:
  - id: a
    text: "`yes`, because the main file is read last and overrides the drop-in."
    explanation: sshd keeps the first value it reads for a setting, not the last.
  - id: b
    text: "`no`, because the Include line comes first and the first value wins."
    explanation: Correct. The drop-in is read at the Include line, before the later
      line in the main file.
  - id: c
    text: "`prohibit-password`, because sshd merges conflicting values."
    explanation: sshd does not merge values.
  - id: d
    text: sshd refuses to start because the value is set twice.
    explanation: Repeated settings are allowed. The first one is used.
  correct_option: b
  explanation: Use `sshd -T` to print the effective values instead of reading the
    files by eye.
- id: ats033-final-q03
  type: single_choice
  difficulty: advanced
  learning_objective: Find where Pod Security Admission rejects a Deployment with
    host access.
  source_readings:
  - sections/section-010/module-03/course-02-enforce-limits-with-pod-security-admission.md
  prompt: 'A namespace has the label `pod-security.kubernetes.io/enforce=baseline`.
    You apply a Deployment whose pod template sets `hostPID: true`. `kubectl apply`
    succeeds. What do you see next?'
  options:
  - id: a
    text: The Deployment has no ready replicas, and the ReplicaSet records a `FailedCreate`
      event.
    explanation: Correct. Admission checks the pod, so the rejection appears when
      the ReplicaSet creates it.
  - id: b
    text: The Deployment is rejected with an error from `kubectl apply`.
    explanation: Admission checks pods, not Deployments.
  - id: c
    text: The pod starts, and a warning is printed.
    explanation: A warning belongs to the `warn` mode. `enforce` rejects.
  - id: d
    text: The kubelet refuses the pod on the node.
    explanation: The API server rejects it before scheduling.
  correct_option: a
  explanation: Read the events of the ReplicaSet when a Deployment shows no ready
    replicas.
- id: ats033-final-q04
  type: single_choice
  difficulty: intermediate
  learning_objective: Turn off an account completely.
  source_readings:
  - sections/section-020/module-01/course-02-privilege-elevation-and-account-locking.md
  prompt: An employee leaves. You run `usermod --lock` on the account. The employee
    can still log in over SSH with a private key. Why?
  options:
  - id: a
    text: The lock marker blocks password authentication only. Key-based login needs
      an expiry date or a `nologin` shell to stop.
    explanation: Correct. Combine the lock with an expiry date and a non-login shell.
  - id: b
    text: "`usermod --lock` only works on accounts with a home directory."
    explanation: The lock does not depend on the home directory.
  - id: c
    text: SSH ignores all account settings.
    explanation: SSH uses the account checks, which is why an expiry date works.
  - id: d
    text: The account must be removed from `/etc/group` first.
    explanation: Group membership does not control SSH login.
  correct_option: a
  explanation: A password lock leaves key-based logins open unless the account is
    also expired or has a `nologin` shell.
- id: ats033-final-q05
  type: single_choice
  difficulty: intermediate
  learning_objective: Remove a wide grant completely after adding a narrow one.
  source_readings:
  - sections/section-020/module-02/course-02-wildcards-cluster-admin-and-escalation.md
  prompt: You create a narrow Role and RoleBinding for a ServiceAccount. It can still
    delete Secrets in every namespace. A ClusterRoleBinding to `cluster-admin` still
    names it. What fixes this?
  options:
  - id: a
    text: Delete the narrow Role, because Kubernetes uses the strictest role.
    explanation: RBAC has no strictest-role rule. Permissions only add up.
  - id: b
    text: Delete the ClusterRoleBinding that names `cluster-admin`.
    explanation: Correct. RBAC only adds permissions, so the wide binding must be
      removed.
  - id: c
    text: Add a deny rule for Secrets to the narrow Role.
    explanation: RBAC has no deny rule.
  - id: d
    text: Restart the API server so it reloads the roles.
    explanation: The API server already evaluates all bindings on every request.
  correct_option: b
  explanation: Access ends only when every binding that grants it is deleted.
- id: ats033-final-q06
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain a bound projected token.
  source_readings:
  - sections/section-020/module-03/course-02-bound-projected-tokens.md
  prompt: Which statement about the token that the kubelet projects into a current
    pod is correct?
  options:
  - id: a
    text: It never expires, and it is stored in a Secret for the ServiceAccount.
    explanation: This describes the old long-lived token Secret.
  - id: b
    text: It expires, it is tied to the pod, and the API server rejects it after the
      pod is deleted.
    explanation: Correct. It is a bound token that the API server issues through the
      TokenRequest API.
  - id: c
    text: It is valid for any audience and any cluster.
    explanation: A token carries an audience, and a service accepts only tokens meant
      for it.
  - id: d
    text: It is created once per ServiceAccount and shared by all pods.
    explanation: The kubelet requests a token for each pod.
  correct_option: b
  explanation: Bound tokens have an expiry and are tied to the pod.
- id: ats033-final-q07
  type: single_choice
  difficulty: beginner
  learning_objective: Tell a refused connection from a timeout.
  source_readings:
  - sections/section-030/module-01/course-01-listeners-and-bind-addresses.md
  prompt: A client gets `Connection refused` immediately when it connects to a node
    port. What does this most likely mean?
  options:
  - id: a
    text: A firewall rule silently dropped the packet.
    explanation: A drop produces a timeout, not an immediate refusal.
  - id: b
    text: The packet reached the host and no process listens on that address and port.
    explanation: Correct. The host answers with a reset.
  - id: c
    text: The route to the node does not exist.
    explanation: A missing route usually ends in a timeout or a network-unreachable
      error.
  - id: d
    text: A NetworkPolicy allowed the traffic.
    explanation: An allow decision does not cause a refusal.
  correct_option: b
  explanation: Refused means the host is reachable and nothing listens there. A timeout
    points to filtering or no route.
- id: ats033-final-q08
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain what externalTrafficPolicy Local changes.
  source_readings:
  - sections/section-030/module-02/course-02-narrowing-nodeports-and-load-balancers.md
  prompt: 'A NodePort Service has `externalTrafficPolicy: Local`. A client sends a
    request to a node that has no ready pod of the Service. What happens?'
  options:
  - id: a
    text: The node forwards the request to a pod on another node and replaces the
      client address.
    explanation: That describes `Cluster`, the default policy.
  - id: b
    text: The node drops the request, because it forwards only to its own pods.
    explanation: Correct. A node without a ready local pod does not answer.
  - id: c
    text: The node answers with a redirect to a node that has a pod.
    explanation: Kubernetes does not redirect NodePort traffic.
  - id: d
    text: The node opens a new pod for the request.
    explanation: Traffic does not create pods.
  correct_option: b
  explanation: With `Local`, only nodes with ready pods answer, and the pods see the
    real client address.
- id: ats033-final-q09
  type: single_choice
  difficulty: advanced
  learning_objective: Choose the kubelet settings that close port 10250.
  source_readings:
  - sections/section-030/module-03/course-03-kubelet-api-authentication-and-authorization.md
  prompt: 'A kubelet has `authentication.anonymous.enabled: true` and `authorization.mode:
    AlwaysAllow`. Which change closes the kubelet API to anonymous callers, and what
    must follow?'
  options:
  - id: a
    text: Set anonymous access to `false` and the mode to `Webhook`, then restart
      the kubelet.
    explanation: Correct. The kubelet reads its configuration file at start.
  - id: b
    text: Set only the mode to `Webhook`; no restart is needed.
    explanation: Anonymous access stays on, and the kubelet needs a restart to read
      the file.
  - id: c
    text: Delete the pods on the node.
    explanation: The pods do not control the kubelet API.
  - id: d
    text: Set `readOnlyPort` to 10250.
    explanation: "`readOnlyPort` is a different, unauthenticated port."
  correct_option: a
  explanation: Both settings must change, and the kubelet must restart.
- id: ats033-final-q10
  type: single_choice
  difficulty: intermediate
  learning_objective: Contrast AppArmor with seccomp.
  source_readings:
  - sections/section-040/module-01/course-02-apparmor-profiles-for-files-and-capabilities.md
  prompt: A root process in a container must not write under `/tmp`, although `/tmp`
    is writable by file mode. Which control fits?
  options:
  - id: a
    text: A seccomp profile that blocks `openat`
    explanation: That would block all file opening, not one path.
  - id: b
    text: An AppArmor profile with `deny /tmp/** w,`
    explanation: Correct. AppArmor decides by path.
  - id: c
    text: "`runAsNonRoot: true`"
    explanation: File mode would still allow a normal user to write to /tmp.
  - id: d
    text: "`fsGroup: 1000`"
    explanation: It sets group ownership of volumes and does not forbid writes.
  correct_option: b
  explanation: AppArmor is mandatory access control by resource name, and it also
    binds root.
- id: ats033-final-q11
  type: single_choice
  difficulty: advanced
  learning_objective: Diagnose a denied operation caused by a seccomp profile.
  source_readings:
  - sections/section-040/module-02/course-03-find-blocked-syscalls-and-fix-failures.md
  prompt: A container runs as root and owns a file, but `mv` on it fails with `Operation
    not permitted`. The pod uses a `Localhost` seccomp profile and keeps running.
    What is the best next step?
  options:
  - id: a
    text: Set `seccompProfile` to `Unconfined` for the pod.
    explanation: That removes the filter for every syscall, not only the one needed.
  - id: b
    text: Map the failing action to its syscall names, compare them with the profile
      rules, and allow only the needed call.
    explanation: Correct. The error comes from the filter, not from file permissions.
  - id: c
    text: Change the file owner with `chown`.
    explanation: The process already owns the file, so ownership is not the cause.
  - id: d
    text: Increase the memory limit of the container.
    explanation: Memory limits do not produce an EPERM error for rename.
  correct_option: b
  explanation: A root process that is denied on an operation it may normally do is
    often blocked by a seccomp rule.
- id: ats033-final-q12
  type: single_choice
  difficulty: intermediate
  learning_objective: Drop Linux capabilities and read the result.
  source_readings:
  - sections/section-040/module-03/course-03-drop-capabilities-and-block-privilege-escalation.md
  prompt: A container needs only to listen on port 80 as user 1000. Which securityContext
    fits the least-privilege rule, and where do you read the result?
  options:
  - id: a
    text: "`capabilities.drop: [ALL]` and `add: [NET_BIND_SERVICE]`; read `CapBnd`
      in `/proc/1/status`."
    explanation: Correct. CapBnd shows the bounding set of a non-root process.
  - id: b
    text: "`capabilities.add: [ALL]`; read the pod events."
    explanation: Adding all capabilities is the opposite of least privilege.
  - id: c
    text: "`privileged: true`; read `/proc/1/attr/current`."
    explanation: Privileged gives every capability, and the AppArmor file does not
      list capabilities.
  - id: d
    text: "`capabilities.drop: [NET_BIND_SERVICE]`; read `Seccomp`."
    explanation: That removes the one capability the workload needs.
  correct_option: a
  explanation: Drop everything and add back the single capability that is needed.
    CapEff is empty for a non-root process, so CapBnd is the line to read.
